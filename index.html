 </div>

<div class="card" id="c8-a1c"> <div class="card-title"><i class="fa-solid fa-house-user c-accent"></i> Homemade leverage</div> <div class="card-body mb6">Los inversores pueden elegir su propio nivel de leverage <strong>pidiendo prestado o prestando a la tasa libre de riesgo</strong>.</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Quiere más leverage</span><span class="ex-val">Pide <strong>prestado por su cuenta</strong> y <strong>compra más shares</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Quiere menos leverage</span><span class="ex-val fw400"><strong>Presta</strong> a la tasa libre de riesgo.</span></div> </div><div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span>Por eso management <strong>no agrega valor</strong> reordenando la mezcla: la firma se enfoca en su <strong>negocio</strong> (generar retornos).</span> </div> </div>

<div class="subsection-label" id="c8-a-sub2"><i class="fa-solid fa-arrow-trend-up"></i> 2. MM II sin impuestos: cost of equity y WACC</div>

<div class="card" id="c8-a2"> <div class="card-title"><i class="fa-solid fa-arrow-trend-up c-accent"></i> MM II (sin impuestos): cost of equity y leverage</div> <div class="card-body mb6">La <strong>MM Proposition II</strong> habla del <strong>costo de capital</strong>, con los mismos supuestos. Más deuda aumenta el <strong>riesgo de bankruptcy</strong>, así que el equity exige <strong>más retorno</strong>: el <strong>cost of equity sube linealmente</strong> con el D/E. Ese aumento <strong>compensa exactamente</strong> el menor costo de la deuda, así que el <strong>WACC no cambia</strong> (consistente con MM I).</div><div class="fbox"> <div class="fbox-eq" style="font-size:14px;"> <span>r<sub>e</sub>&nbsp;=&nbsp;r<sub>0</sub>&nbsp;+&nbsp;</span> <span class="frac"><span class="frac-num">D</span><span class="frac-den">E</span></span> <span>&nbsp;(r<sub>0</sub>&nbsp;−&nbsp;r<sub>d</sub>)</span> </div> </div><div class="var-table"> <div class="var-row"><span class="var-name" style="min-width:120px;">r<sub>0</sub></span><span class="var-desc"><strong>Retorno base:</strong> cost of equity de la firma sin deuda (100% equity)</span></div> <div class="var-row"><span class="var-name" style="min-width:120px;">(r<sub>0</sub> − r<sub>d</sub>) × D/E</span><span class="var-desc"><strong>Retorno extra</strong> (uplift) por el riesgo adicional de endeudarse; <strong>crece con el D/E</strong></span></div> <div class="var-row"><span class="var-name" style="min-width:120px;">r<sub>e</sub>, r<sub>d</sub></span><span class="var-desc">Cost of equity y cost of debt</span></div> </div><div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Cost of equity (r<sub>e</sub>)</span><span class="ex-val"><strong>Sube</strong> linealmente con el D/E.</span></div> <div class="ex-row"><span class="ex-label">Cost of debt (r<sub>d</sub>)</span><span class="ex-val"><strong>No cambia.</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">WACC</span><span class="ex-val fw400"><strong>No cambia:</strong> es constante e igual a r<sub>0</sub>.</span></div> </div>

 </div>

<div class="card" id="c8-a2b"> <div class="card-title"><i class="fa-solid fa-calculator c-accent"></i> Ejemplo: Gerhardt Corporation (MM I y II sin impuestos)</div> <button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: pasar de 100% equity a €15,000 de deuda</span><span class="example-badge">Click para expandir</span></button><div class="example-body" id="c8-a2b-ex"> <div class="card-body mb6"><em>Gerhardt es <strong>all-equity</strong>: cash flows de €5,000 por año (perpetuos), cost of equity y WACC de 10%. Emite <strong>€15,000 de deuda al 5%</strong> y recompra €15,000 de equity (capital total: €50,000). Calculá cost of equity, WACC y valor.</em></div><div class="ex-table"> <div class="ex-row"><span class="ex-label">1) Valor inicial</span><span class="ex-val">CF / r = €5,000 / 0.10 = <strong>€50,000</strong> (perpetuidad; r = r<sub>0</sub> = WACC)</span></div> <div class="ex-row"><span class="ex-label">2) Nueva estructura</span><span class="ex-val">D = <strong>€15,000</strong>; E = €50,000 − €15,000 = <strong>€35,000</strong></span></div> <div class="ex-row"><span class="ex-label">3) Cost of equity</span><span class="ex-val">r<sub>e</sub> = 0.10 + (0.10 − 0.05) × (15,000 / 35,000) = <strong>12.143%</strong></span></div> <div class="ex-row"><span class="ex-label">4) WACC</span><span class="ex-val">(15,000 / 50,000) × 5% + (35,000 / 50,000) × 12.143% = 1.5% + 8.5% = <strong>10%</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">5) Valor</span><span class="ex-val fw400">Deuda = €750 / 0.05 = €15,000. Equity = €4,250 / 0.12143 = €35,000 (se descuenta a r<sub>e</sub>, no a r<sub>0</sub>). Firma = <strong>€50,000</strong>. Con el WACC: (€750 + €4,250) / 0.10 = <strong>€50,000</strong></span></div> </div><div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>El <strong>cost of equity sube</strong> (10% → 12.143%), pero el <strong>WACC y el valor no cambian</strong>.</span> </div> </div> </div>

<div class="subsection-label" id="c8-a-sub3"><i class="fa-solid fa-shield-halved"></i> 3. MM I con impuestos: el tax shield agrega valor</div>

<div class="card" id="c8-a3"> <div class="card-title"><i class="fa-solid fa-shield-halved c-accent"></i> MM I (con impuestos): el tax shield agrega valor</div> <div class="card-body mb6">Ahora los <strong>earnings tributan</strong>: el pie (el EBIT) se reparte entre el <strong>gobierno</strong>, los <strong>debtholders</strong> y los <strong>equity holders</strong>. Como los <strong>intereses son deducibles</strong> (los dividendos no), con deuda la firma paga <strong>menos impuestos</strong>: la porción del gobierno es <strong>más chica que la de una firma sin deuda</strong> y queda <strong>más pie para los inversores</strong>. Ese ahorro es el <strong>tax shield = t × debt</strong>, y con <strong>100% deuda</strong> es máximo.</div><div class="card-body mt10">Con los números de Gerhardt (EBIT €5,000, t = 25%):</div><div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Sin deuda</span><span class="ex-val">Gobierno <strong>€1,250</strong>; inversores <strong>€3,750</strong>.</span></div> <div class="ex-row"><span class="ex-label">Con deuda (interés €750)</span><span class="ex-val">Gobierno <strong>€1,062.5</strong>; inversores <strong>€3,937.5</strong> (€750 a debtholders + €3,187.5 a equity).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Diferencia</span><span class="ex-val fw400"><strong>+€187.5 por año</strong> para los inversores = t × interés (0.25 × €750). Su valor presente (€187.5 / 0.05) es <strong>€3,750</strong> = t × debt.</span></div> </div><div class="fbox">V<sub>L</sub>&nbsp;=&nbsp;V<sub>U</sub>&nbsp;+&nbsp;(t&nbsp;×&nbsp;debt)</div><div class="var-table"> <div class="var-row"><span class="var-name" style="min-width:60px;">V<sub>L</sub>, V<sub>U</sub></span><span class="var-desc">Value of levered / unlevered firm</span></div> <div class="var-row"><span class="var-name" style="min-width:60px;">t</span><span class="var-desc"><strong>Tax rate</strong> corporativa</span></div> </div> </div>

<div class="subsection-label" id="c8-a-sub4"><i class="fa-solid fa-percent"></i> 4. MM II con impuestos: el WACC baja al subir el leverage</div>

<div class="card" id="c8-a4"> <div class="card-title"><i class="fa-solid fa-percent c-accent"></i> MM II (con impuestos): cost of equity y WACC</div> <div class="fbox"> <div class="fbox-eq" style="font-size:14px;"> <span>r<sub>e</sub>&nbsp;=&nbsp;r<sub>0</sub>&nbsp;+&nbsp;</span> <span class="frac"><span class="frac-num">D</span><span class="frac-den">E</span></span> <span>&nbsp;(r<sub>0</sub>&nbsp;−&nbsp;r<sub>d</sub>)&nbsp;(1&nbsp;−&nbsp;T<sub>C</sub>)</span> </div> </div><div class="card-body mt10">T<sub>C</sub> = tax rate (la misma t del tax shield). La deuda es todavía <strong>más barata</strong> (<strong>after-tax cost of debt = r<sub>d</sub> × (1 − T<sub>C</sub>)</strong>) y ese ahorro <strong>supera</strong> el aumento del cost of equity, que sigue subiendo pero <strong>más lento</strong> que sin impuestos. El <strong>WACC baja</strong> con el leverage, hacia el after-tax cost of debt, y el valor se maximiza donde es <strong>mínimo</strong>: 100% deuda.</div>
<svg viewBox="0 0 640 275" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Con impuestos: el WACC baja hacia el after-tax cost of debt" style="width:100%;height:auto;max-width:640px;display:block;margin:0 auto;">

  <text x="505" y="258" text-anchor="end" font-size="11" fill="var(--text-sec)">D/E →</text>
  <text x="32" y="145" text-anchor="middle" font-size="11" fill="var(--text-sec)" transform="rotate(-90 32 145)">Cost of capital →</text>
  <circle cx="80" cy="170" r="3.5" fill="var(--text)"/>
  <text x="72" y="174" text-anchor="end" font-size="10.5" fill="var(--text-sec)">r<tspan font-size="8" dy="3">0</tspan></text>
  <line x1="80" y1="170" x2="500" y2="100" stroke="var(--text)" stroke-width="2.5"/>
  <path d="M 80 170 C 200 184, 340 202, 500 208" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <line x1="80" y1="224" x2="500" y2="224" stroke="var(--text-sec)" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="508" y="104" font-size="10.5" font-weight="600" fill="var(--text)">Cost of equity (r<tspan font-size="8" dy="3">e</tspan>)</text>
  <text x="508" y="208" font-size="10.5" font-weight="600" fill="var(--accent)">WACC</text>
  <text x="508" y="228" font-size="10.5" fill="var(--text-sec)">After-tax cost of debt</text>
</svg>
<div class="alert mt8"> <i class="fa-solid fa-scale-balanced"></i> <span><strong>Antes vs. ahora:</strong> sin impuestos da lo mismo cómo te financies; con el tax shield <strong>conviene más deuda</strong>. Pero el modelo ignora que el <strong>cost of debt debería subir</strong> con más deuda: eso lo corrige la static tradeoff.</span> </div> </div>

<div class="card" id="c8-a4b"> <div class="card-title"><i class="fa-solid fa-calculator c-accent"></i> Ejemplo: Gerhardt Corporation (MM I y II con impuestos, 25%)</div> <button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: el mismo caso, con tax rate de 25%</span><span class="example-badge">Click para expandir</span></button><div class="example-body" id="c8-a4b-ex"> <div class="card-body mb6"><em>Mismo caso que antes (cash flows de €5,000, r<sub>0</sub> = 10%, deuda de €15,000 al 5% para recomprar equity), pero ahora Gerhardt paga <strong>impuestos de 25%</strong>. Calculá cost of equity, WACC y valor.</em></div><div class="ex-table"> <div class="ex-row"><span class="ex-label">1) V<sub>U</sub></span><span class="ex-val">CF after-tax = €5,000 × 0.75 = €3,750. V<sub>U</sub> = €3,750 / 0.10 = <strong>€37,500</strong></span></div> <div class="ex-row"><span class="ex-label">2) V<sub>L</sub> y equity</span><span class="ex-val">V<sub>L</sub> = €37,500 + (0.25 × €15,000) = <strong>€41,250</strong>. Equity = €41,250 − €15,000 = <strong>€26,250</strong></span></div> <div class="ex-row"><span class="ex-label">3) Cost of equity</span><span class="ex-val">r<sub>e</sub> = 0.10 + (15,000 / 26,250) × (0.10 − 0.05) × (1 − 0.25) = <strong>12.143%</strong> (igual que sin impuestos por coincidencia: acá el D/E es mayor)</span></div> <div class="ex-row"><span class="ex-label">4) WACC</span><span class="ex-val">(15,000 / 41,250) × 5% × 0.75 + (26,250 / 41,250) × 12.143% = 1.364% + 7.727% = <strong>9.091%</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">5) Chequeo</span><span class="ex-val fw400">V<sub>L</sub> = €3,750 / 0.09091 = €41,250. Equity = (€5,000 − €750) × 0.75 / 0.12143 = €26,250 (los €750 son los <strong>intereses</strong>, deducibles)</span></div> </div><div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>El <strong>WACC baja</strong> (10% → 9.091%) y el valor sube <strong>€3,750</strong>: justo el tax shield (0.25 × €15,000).</span> </div><div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Comparalo con la firma sin deuda <strong>con impuestos</strong> (€37,500), no con el ejemplo sin impuestos (€50,000).</span> </div> </div> </div>

<div class="subsection-label" id="c8-a-sub5"><i class="fa-solid fa-house-crack"></i> 5. Costos de financial distress</div>

<div class="card" id="c8-a5"> <div class="card-title"><i class="fa-solid fa-triangle-exclamation c-accent"></i> Por qué el 100% de deuda no es el óptimo: costos de financial distress</div> <div class="card-body mb6">MM asumieron que <strong>no hay costos de bankruptcy</strong>, pero existen y <strong>aumentan con la deuda</strong>. MM sugirieron que las <strong>tasas impositivas distintas de los inversores</strong> (dividendos vs. intereses) podrían explicar las diferencias; la teoría actual apunta a los <strong>costos de financial distress</strong>: los costos adicionales cuando los earnings caen y la firma tiene problemas para pagar sus <strong>costos financieros fijos</strong>. El <strong>costo esperado</strong> tiene dos componentes:</div><div id="c8-a5-cost" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Costos, si el distress ocurre</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Directos</span><span class="ex-val"><strong>Honorarios legales y administrativos</strong> de la bankruptcy.</span></div> <div class="ex-row"><span class="ex-label">Indirectos</span><span class="ex-val"><strong>Oportunidades de inversión perdidas</strong> y pérdida de confianza de customers, creditors, suppliers y employees.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Agency costs of debt</span><span class="ex-val fw400">Conflictos de interés entre <strong>managers (que representan a los equity owners) y debtholders</strong> durante el distress.</span></div> </div><div id="c8-a5-prob" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Probabilidad de distress</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Financial leverage</span><span class="ex-val">Más deuda, <strong>mayor</strong> probabilidad de no poder pagarla.</span></div> <div class="ex-row"><span class="ex-label">Operating leverage</span><span class="ex-val">Más costos fijos, cash flows más volátiles (Module 25.1).</span></div> <div class="ex-row"><span class="ex-label">Calidad del management</span><span class="ex-val">Menor calidad, <strong>mayor</strong> probabilidad.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Corporate governance</span><span class="ex-val fw400">Governance pobre, <strong>mayor</strong> probabilidad.</span></div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-bullseye" style="margin-right:6px;color:var(--accent)"></i>LOS 25.d — Estructura de capital óptima y target</div>

<div class="subsection-label" id="c8-b-sub1"><i class="fa-solid fa-scale-unbalanced"></i> 1. Static tradeoff theory</div>

<div class="card" id="c8-b1"> <div class="card-title"><i class="fa-solid fa-scale-unbalanced c-accent"></i> Static tradeoff theory: tax shield vs. costos de distress</div> <div class="card-body mb6">La <strong>static tradeoff theory</strong> balancea el <strong>tax shield</strong> de más leverage contra el <strong>PV de los costos de financial distress, ponderados por su probabilidad</strong>. El punto donde el tax shield de un poco más de deuda deja de superar el aumento de esos costos es la <strong>estructura de capital óptima</strong>: <strong>WACC mínimo</strong> y <strong>valor máximo</strong>.</div><div class="fbox">V<sub>L</sub>&nbsp;=&nbsp;V<sub>U</sub>&nbsp;+&nbsp;(t&nbsp;×&nbsp;debt)&nbsp;−&nbsp;PV(costs&nbsp;of&nbsp;financial&nbsp;distress)</div><div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">V<sub>U</sub> + (t × debt)</span><span class="ex-val">La parte de <strong>MM con impuestos</strong>: la deuda solo suma valor.</span></div> <div class="ex-row"><span class="ex-label">− PV(costs of financial distress)</span><span class="ex-val">El <strong>realismo</strong> que se le agrega a MM.</span></div> <div class="ex-row"><span class="ex-label">Poca deuda</span><span class="ex-val"><strong>Sube</strong> el valor: el tax shield supera el aumento de los costos potenciales de bankruptcy.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Mucha deuda</span><span class="ex-val fw400">Esos costos <strong>aumentan significativamente</strong> y el valor <strong>cae</strong>.</span></div> </div>

<div id="c8-b1-leer" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Cómo leer el gráfico</div><div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Línea gris continua (V<sub>U</sub>)</span><span class="ex-val">Valor de la firma <strong>sin deuda</strong>.</span></div> <div class="ex-row"><span class="ex-label">Línea gris punteada (V<sub>U</sub> + tD)</span><span class="ex-val">Valor <strong>hipotético</strong> con deuda si <strong>solo existiera el tax shield</strong> y no hubiera costos de financial distress. Por eso <strong>sigue subiendo</strong>: supone que endeudarse siempre aporta beneficios y nunca genera problemas.</span></div> <div class="ex-row"><span class="ex-label">Línea rosada (V<sub>L</sub>)</span><span class="ex-val">Valor <strong>efectivo</strong> de la firma levered bajo la static tradeoff: V<sub>L</sub> = V<sub>U</sub> + PV(tax shield) − PV(financial distress). Sube al principio, llega al <strong>máximo</strong> en el óptimo y después <strong>cae</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Flechas</span><span class="ex-val fw400"><strong>Verde:</strong> PV del tax shield (lo que suma la deuda). <strong>Roja:</strong> PV de los costos de financial distress (lo que resta): es la distancia entre la línea punteada y la rosada.</span></div> </div><div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span><strong>Cada firma tiene su propio óptimo:</strong> depende de su <strong>business risk</strong> (operating y sales risk), <strong>tax rate</strong>, <strong>corporate governance</strong>, <strong>industria</strong> y otros factores.</span> </div> </div>

<div class="card" id="c8-b1b"> <div class="card-title"><i class="fa-solid fa-chart-line c-accent"></i> Static tradeoff: el WACC en forma de U</div> <div class="card-body mb6">El <strong>WACC baja</strong> por el tax shield, toca su <strong>mínimo en la estructura óptima</strong> y <strong>vuelve a subir</strong>: a alto D/E también sube el after-tax cost of debt, por el riesgo de distress.</div>

<div class="card bt-accent" id="c8-b1s"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Resumen: de MM a la static tradeoff</div> <div class="reason-box"> <span class="reason-num">1</span> <div class="reason-body"> <div class="reason-title">MM sin impuestos</div> La estructura de capital es <strong>irrelevante</strong>: WACC y valor no cambian. </div> </div><div class="reason-box"> <span class="reason-num">2</span> <div class="reason-body"> <div class="reason-title">MM con impuestos</div> WACC <strong>mínimo</strong> y valor <strong>máximo</strong> con <strong>100% deuda</strong> (&quot;toda la deuda que puedas&quot;). </div> </div><div class="reason-box"> <span class="reason-num">3</span> <div class="reason-body"> <div class="reason-title">Static tradeoff</div> Más deuda sube el valor <strong>hasta cierto punto</strong> y después lo baja, cuando los costos de distress superan el tax shield: un poco de deuda conviene, mucha es peligrosa. </div> </div> </div>

<div class="subsection-label" id="c8-b-sub2"><i class="fa-solid fa-crosshairs"></i> 2. Óptima, target y actual: qué pesos usar en el WACC</div>

<div class="card" id="c8-b2"> <div class="card-title"><i class="fa-solid fa-bullseye c-accent"></i> Estructura de capital óptima vs. target vs. actual</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Óptima</span><span class="ex-val">La de la static tradeoff: <strong>WACC mínimo</strong> y <strong>valor máximo</strong>.</span></div> <div class="ex-row"><span class="ex-label">Target</span><span class="ex-val">La que la firma <strong>busca alcanzar en promedio con el tiempo</strong> para maximizar su valor: lo que <strong>management cree</strong> óptimo, más factores internos y externos. Suele ser un <strong>rango</strong>, no un valor puntual.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Actual</span><span class="ex-val fw400">La que tiene <strong>hoy</strong>. <strong>Fluctúa alrededor del target</strong>.</span></div> </div> </div>

<div class="card" id="c8-b3"> <div class="card-title"><i class="fa-solid fa-percent c-accent"></i> Target: cómo lo estima un analista externo</div> <div class="card-body mb6">Los <strong>weights</strong> del WACC deben basarse en el <strong>target</strong>: las proporciones de deuda, preferred stock y equity que la firma <strong>espera alcanzar con el tiempo</strong>. Pocas firmas informan su target, así que el analista lo <strong>estima</strong>:</div><div class="reason-box"> <span class="reason-num">1</span> <div class="reason-body"> <div class="reason-title">Estructura actual</div> La <strong>estructura de capital actual</strong> como mejor indicio del target. </div> </div><div class="reason-box"> <span class="reason-num">2</span> <div class="reason-body"> <div class="reason-title">Tendencia</div> Si hay una <strong>tendencia</strong> notoria, incorporarla a la estimación. </div> </div><div class="reason-box"> <span class="reason-num">3</span> <div class="reason-body"> <div class="reason-title">Promedio de comparables</div> Los <strong>promedios de la industria</strong> (companies comparables). </div> </div> </div>

<div class="card" id="c8-b4"> <div class="card-title"><i class="fa-solid fa-book c-accent"></i> Target: ¿market value o book value?</div> <div class="card-body mb6">En los cálculos habituales del WACC se usa <strong>market value</strong> (Module 25.1). Para el <strong>target</strong> se mira el <strong>largo plazo</strong>:</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-chart-line"></i> Market value</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li>Perspectiva del <strong>inversor</strong></li><li>Base de los cálculos habituales del WACC</li><li>Fluctúa en el corto plazo: habría que <strong>recalcular seguido</strong></li></ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-user-tie"></i> Book value</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li>Perspectiva de <strong>management</strong>: cómo usa el capital internamente</li><li>Lo usan los <strong>managers</strong> para fijar el target</li><li>Lo usan las <strong>credit rating agencies</strong></li></ul> </div> </div><div id="c8-b4-bv" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">De dónde sale el book value</div><div class="fbox">Book value of equity&nbsp;=&nbsp;Share capital&nbsp;+&nbsp;All reserves</div><div class="card-body mt10">Sale del <strong>balance sheet</strong> (statement of financial position, SoFP). Las reserves incluyen, entre otras, los retained earnings.</div><div class="alert mt10"> <i class="fa-solid fa-lightbulb"></i> <span><strong>Cómo decidir:</strong> fijate <strong>qué te piden</strong>. Management, credit rating agency o <strong>target</strong>: book value. WACC con datos de mercado o perspectiva del inversor: market value.</span> </div><div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Ojo con las fuentes:</strong> la lectura arma el target a market value; la Masterclass lo fija con <strong>book value</strong> (y la pregunta de práctica sale de ahí).</span> </div><button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver pregunta, opciones y respuesta</span><span class="example-badge">Click para expandir</span></button><div class="example-body" id="c8-b4-ex"> <div class="card-body mb6"><em>Verdadero o falso: el target capital structure debería estimarse usando el market value del equity y de la deuda al calcular el WACC.</em></div><div class="ex-table"> <div class="ex-row"><span class="ex-label">A</span><span class="ex-val">True</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">B</span><span class="ex-val fw400">False</span></div> </div><div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(B) False</strong>. El target es una mirada de largo plazo: se usa <strong>book value</strong>.</span> </div> </div> </div>

<div class="card" id="c8-b5"> <div class="card-title"><i class="fa-solid fa-arrows-left-right c-accent"></i> Por qué la estructura actual se desvía del target</div> <div class="card-body mb6">Como no siempre se puede tener el target exacto, se busca mantener la estructura <strong>dentro de un rango</strong>. Se desvía por:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Cambios en los market values</span><span class="ex-val">Sobre todo del <strong>equity</strong> (y la deuda), que mueven los pesos.</span></div> <div class="ex-row"><span class="ex-label">Oportunidades de corto plazo</span><span class="ex-val">Emitir <strong>deuda o equity</strong> cuando conviene. Ej.: con el stock price alto, emitir equity deja un <strong>% de equity mayor al target</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Costos de transacción y lotes mínimos</span><span class="ex-val fw400">Pueden ser demasiado altos para justificar <strong>rebalancear seguido</strong>; el capital externo se levanta en lotes mínimos.</span></div> </div> </div>

<div class="subsection-label" id="c8-b-sub3"><i class="fa-solid fa-eye-slash"></i> 3. Asymmetric information y agency costs</div>

<div class="card" id="c8-b6"> <div class="card-title"><i class="fa-solid fa-eye-slash c-accent"></i> Costos de asymmetric information y señales</div> <div class="card-body mb6">Los <strong>managers</strong> tienen <strong>más información</strong> que los owners y creditors (Module 22.1). Con <strong>productos complejos</strong> o <strong>poca transparencia</strong>, los costos son mayores y suben los <strong>required returns</strong> de deuda y equity. El costo <strong>aumenta con la proporción de equity</strong>.</div><div id="c8-b6-sig" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Señales que envía la estructura de capital</div><div class="card-body mt10">Los inversores <strong>buscan señales</strong> en las decisiones de management:</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-hand-holding-dollar"></i> Emitir deuda</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Positiva:</strong> compromiso de pagar <strong>intereses fijos</strong>; management tiene <strong>confianza</strong> en poder pagarlos.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-coins"></i> Emitir equity</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Negativa:</strong> management cree que la acción está <strong>sobrevaluada</strong> (o no confía en poder pagar más deuda).</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-arrow-rotate-left"></i> Recomprar shares</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Positiva:</strong> management cree que la acción está <strong>undervalued</strong>.</div> </div> </div><button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: CLP AG (asymmetric information y signaling)</span><span class="example-badge">Click para expandir</span></button><div class="example-body" id="c8-b6-ex"> <div class="card-body mb6"><em>CLP AG, una farmacéutica chica, prueba su drug en un nuevo uso. En <strong>julio</strong> management sabe que los trials van bien y CLP divulga un <strong>gran aumento de su credit line</strong>. En <strong>agosto</strong> anuncia resultados exitosos y su share price sube 35%. ¿Dónde hay asymmetric information y signaling?</em></div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Asymmetric information</span><span class="ex-val">Management <strong>conocía el resultado</strong> en julio, <strong>antes</strong> del anuncio público de agosto.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Signaling</span><span class="ex-val fw400">El aumento de la <strong>credit line</strong> en julio fue la <strong>señal</strong>: resultados positivos y capacidad de producción por expandir.</span></div> </div> </div> </div>

<div class="card" id="c8-b7"> <div class="card-title"><i class="fa-solid fa-handshake c-accent"></i> Agency costs of equity y free cash flow hypothesis</div> <div class="card-body mb6">Vienen del conflicto <strong>managers ↔ owners</strong> (Module 22.1): los managers sin participación no cargan con el costo de una compensación excesiva ni de tomar demasiado (o muy poco) riesgo. Los shareholders lo saben y actúan: queda el <strong>net agency cost of equity</strong>:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Monitoring costs</span><span class="ex-val">Costos de <strong>supervisar a management</strong> (reportes, pagarle al board). Un <strong>strong corporate governance</strong> los reduce.</span></div> <div class="ex-row"><span class="ex-label">Bonding costs</span><span class="ex-val">Costos de <strong>asegurarle a los shareholders</strong> que los managers actúan en su interés (ej. primas de seguros de desempeño, acuerdos de no competencia).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Residual losses</span><span class="ex-val fw400">Pérdidas que quedan <strong>aun con monitoring y bonding</strong>: no son una garantía perfecta.</span></div> </div><div id="c8-b7-fcf" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Free cash flow hypothesis</div><div class="card-body mt10">La deuda <strong>disciplina a los managers</strong>: con menos free cash flow tienen menos cash para gastar en beneficio propio. Por eso <strong>más financial leverage tiende a reducir los agency costs</strong>.</div><div id="c8-b7-vs" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">No confundir: agency costs of equity vs. agency costs of debt</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-user-tie"></i> Agency costs of equity</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li>Conflicto <strong>managers ↔ shareholders</strong></li><li>Monitoring, bonding y residual losses</li><li><strong>Bajan</strong> con más deuda (free cash flow hypothesis)</li></ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-building-columns"></i> Agency costs of debt</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li>Conflicto <strong>managers (por los equity owners) ↔ debtholders</strong></li><li>Aparecen en <strong>financial distress</strong></li><li>Pesan más cuanto <strong>más probable</strong> es el distress (más leverage)</li></ul> </div> </div> </div>

<div class="subsection-label" id="c8-b-sub4"><i class="fa-solid fa-ranking-star"></i> 4. Pecking order theory</div>

<div class="card" id="c8-b8"> <div class="card-title"><i class="fa-solid fa-ranking-star c-accent"></i> Pecking order theory: la jerarquía de financiamiento</div> <div class="card-body mb6">Management usa <strong>primero los fondos generados internamente</strong> (por su <strong>bajo contenido de información</strong>: no le pide nada a nadie). Si tiene que salir a buscar plata, lo hace en el orden que <strong>revele menos información</strong>, y deja el equity público para el final (<strong>alto contenido de información</strong>):</div><div class="reason-box"> <span class="reason-num">1</span> <div class="reason-body"> <div class="reason-title">Fondos internos</div> La fuente <strong>más preferida</strong> (free cash flow). </div> </div><div class="reason-box"> <span class="reason-num">2</span> <div class="reason-body"> <div class="reason-title">Deuda privada</div> Primera opción del financiamiento <strong>externo</strong>. </div> </div><div class="reason-box"> <span class="reason-num">3</span> <div class="reason-body"> <div class="reason-title">Deuda pública (bonds)</div> Segunda opción del financiamiento externo. </div> </div><div class="reason-box"> <span class="reason-num">4</span> <div class="reason-body"> <div class="reason-title">Equity (public offering)</div> La <strong>menos preferida</strong>. </div> </div><div id="c8-b8-vs" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Static tradeoff vs. pecking order</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-scale-unbalanced"></i> Static tradeoff</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li>Balancea el <strong>tax shield</strong> contra los <strong>costos de distress</strong></li><li>Hay una estructura <strong>óptima</strong></li></ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-ranking-star"></i> Pecking order</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li>Se basa en <strong>asymmetric information</strong> y <strong>señales</strong></li><li><strong>No hay</strong> estructura óptima: es un <strong>subproducto</strong> de las decisiones individuales de financiamiento</li></ul> </div> </div><button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver pregunta, opciones y respuesta</span><span class="example-badge">Click para expandir</span></button><div class="example-body" id="c8-b8-ex"> <div class="card-body mb6"><em>Verdadero o falso: bajo la pecking order theory, la firma no tiene una estructura de capital óptima y su estructura refleja su necesidad histórica de financiamiento externo.</em></div><div class="ex-table"> <div class="ex-row"><span class="ex-label">A</span><span class="ex-val">True</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">B</span><span class="ex-val fw400">False</span></div> </div><div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(A) True</strong>. No busca un ratio óptimo: la estructura es el resultado acumulado del financiamiento externo que fue necesitando.</span> </div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 25.2</div><div class="card bt-accent" id="c8-glossary"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">MM I (sin impuestos)</span><span class="ex-val">V<sub>L</sub> = V<sub>D</sub> + V<sub>E</sub> = V<sub>U</sub>: el valor depende solo de los expected future cash flows. Supuestos: mercados perfectos, expectativas homogéneas, borrowing/lending sin riesgo, sin agency costs, inversión independiente del financiamiento. <strong>Homemade leverage:</strong> el inversor arma su propio leverage</span></div> <div class="ex-row"><span class="ex-label">MM II (sin impuestos)</span><span class="ex-val">r<sub>e</sub> = r<sub>0</sub> + D/E × (r<sub>0</sub> − r<sub>d</sub>): r<sub>e</sub> <strong>sube</strong>, r<sub>d</sub> y <strong>WACC no cambian</strong>. Gerhardt: r<sub>e</sub> 10% → 12.143%, WACC 10%, valor €50,000</span></div> <div class="ex-row"><span class="ex-label">MM I (con impuestos)</span><span class="ex-val">Tax shield = t × debt; V<sub>L</sub> = V<sub>U</sub> + (t × debt): el valor <strong>sube</strong> con la deuda y es máximo con <strong>100% deuda</strong></span></div> <div class="ex-row"><span class="ex-label">MM II (con impuestos)</span><span class="ex-val">r<sub>e</sub> = r<sub>0</sub> + D/E × (r<sub>0</sub> − r<sub>d</sub>) × (1 − T<sub>C</sub>): r<sub>e</sub> sube más lento y el <strong>WACC baja</strong> (hacia r<sub>d</sub> × (1 − T<sub>C</sub>)). Gerhardt 25%: V<sub>U</sub> €37,500 → V<sub>L</sub> €41,250; WACC 10% → 9.091%</span></div> <div class="ex-row"><span class="ex-label">Costos de financial distress</span><span class="ex-val">Costos: <strong>directos</strong>, <strong>indirectos</strong> y <strong>agency costs of debt</strong>. Probabilidad: financial y operating leverage, calidad de management, corporate governance</span></div> <div class="ex-row"><span class="ex-label">Static tradeoff</span><span class="ex-val">V<sub>L</sub> = V<sub>U</sub> + (t × debt) − PV(costs of financial distress). <strong>Óptimo:</strong> WACC mínimo y valor máximo</span></div> <div class="ex-row"><span class="ex-label">Óptima, target y actual</span><span class="ex-val">Óptima: WACC mínimo. <strong>Target:</strong> lo que management busca en promedio (un rango). <strong>Actual:</strong> fluctúa alrededor del target por cambios de mercado, oportunidades y costos de transacción</span></div> <div class="ex-row"><span class="ex-label">Market value vs. book value</span><span class="ex-val">Cálculos habituales del WACC: <strong>market value</strong>. <strong>Target:</strong> <strong>book value</strong> (managers, credit rating agencies); T/F &quot;target con market value&quot; = <strong>False</strong>. Book value of equity = share capital + all reserves. Sin target declarado: estructura actual, tendencia o comparables</span></div> <div class="ex-row"><span class="ex-label">Asymmetric information</span><span class="ex-val">Managers saben más. Deuda = señal <strong>positiva</strong>; emitir equity = <strong>negativa</strong>; recomprar shares = <strong>positiva</strong>. El costo <strong>sube</strong> con la proporción de equity. CLP: la credit line fue la señal</span></div> <div class="ex-row"><span class="ex-label">Agency costs</span><span class="ex-val"><strong>Of equity:</strong> managers ↔ shareholders (monitoring + bonding + residual losses); la deuda los reduce (free cash flow hypothesis). <strong>Of debt:</strong> managers ↔ debtholders, en financial distress</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Pecking order theory</span><span class="ex-val fw400">Fondos internos &gt; deuda privada &gt; deuda pública &gt; equity. <strong>No hay estructura óptima</strong>: refleja el financiamiento externo histórico</span></div> </div> </div>

</div>`;}

function pageC9() { return `<div class="module-theme module-c9"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 26.a, 26.b</div> <div class="page-title">Module 26.1: Business Model Features and Types</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 26: Business Models</div>

<div class="card bt-accent" id="c9-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body"><strong>LOS 26.a:</strong> las <strong>5 preguntas</strong> de un business model, las <strong>estrategias de pricing</strong>, y <strong>value proposition</strong> vs. <strong>value chain</strong> vs. <strong>supply chain</strong>. <strong>LOS 26.b:</strong> los <strong>tipos</strong> de modelos, la <strong>innovación</strong> de los new entrants, los <strong>network effects</strong> y el <strong>crowdsourcing</strong>.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-briefcase" style="margin-right:6px;color:var(--accent)"></i>LOS 26.a — Características de un business model</div>

<div class="subsection-label" id="c9-a-sub1"><i class="fa-solid fa-circle-question"></i> 1. Las 5 preguntas de un business model</div>

<div class="card" id="c9-a1"> <div class="card-title"><i class="fa-solid fa-circle-question c-accent"></i> Business model: qué responde</div> <div class="card-body mb6">Explica cómo la firma <strong>ofrece un producto o servicio, encuentra clientes, se lo entrega y gana plata</strong>. Se arma con 5 preguntas:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Who — clientes</span><span class="ex-val">Quiénes son, cómo se los adquiere (y cuánto cuesta) y cómo se mantiene su satisfacción. Se los agrupa por <strong>segmenting</strong> (ej. dueños de perros). La firma es <strong>B2B</strong> (vende a empresas) o <strong>B2C</strong> (a consumidores).</span></div> <div class="ex-row"><span class="ex-label">What — producto</span><span class="ex-val">Qué necesidad cubre y qué lo diferencia (bajo precio, calidad premium, features innovadores).</span></div> <div class="ex-row"><span class="ex-label">How — assets y suppliers</span><span class="ex-val"><strong>Key assets</strong> (patente, software, empleados calificados) y <strong>key suppliers</strong>, que se encadenan (vehículos eléctricos → baterías → litio → maquinaria de excavación): es la parte externa de la <strong>supply chain</strong>.</span></div> <div class="ex-row"><span class="ex-label">Where — canales</span><span class="ex-val"><strong>Channel strategy</strong>: cómo se vende (online, físico, direct mail, trade shows, sales reps) y se entrega. <strong>Omnichannel</strong> = digital + físico. Se vende directo o vía intermediarios (wholesalers, retailers, agents, franchisees).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">How much — pricing</span><span class="ex-val fw400">La <strong>pricing strategy</strong> y por qué los compradores pagarían ese precio (subsección 2).</span></div> </div> </div>

<div class="subsection-label" id="c9-a-sub3"><i class="fa-solid fa-tags"></i> 2. How much: estrategias de pricing</div>

<div class="card" id="c9-a5"> <div class="card-title"><i class="fa-solid fa-scale-unbalanced c-accent"></i> Price takers vs. pricing power</div> <div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-arrow-down-wide-short"></i> Price takers</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Productos <strong>indiferenciados</strong> (commodity producers). Ej.: oil and gas, home loans.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-arrow-up-wide-short"></i> Pricing power</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Pocos competidores</strong> o productos <strong>muy diferenciados</strong> (ej. drogas patentadas). Pueden cobrar <strong>precio premium</strong> si suman servicios o features valorados.</div> </div> </div> </div>

<div class="card" id="c9-a6"> <div class="card-title"><i class="fa-solid fa-tags c-accent"></i> Price discrimination</div> <div class="card-body mb6">Fijar <strong>precios distintos a grupos de clientes identificables</strong>:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Tiered pricing</span><span class="ex-val">Según el <strong>volumen</strong> de compra.</span></div> <div class="ex-row"><span class="ex-label">Dynamic pricing</span><span class="ex-val">Según el <strong>momento</strong>: peak vs. off-peak, vuelos muy temprano o muy tarde, cines, Uber.</span></div> <div class="ex-row"><span class="ex-label">Value-based pricing</span><span class="ex-val">Según el <strong>valor</strong> que el cliente percibe (ej. una droga nueva apenas mejor que las existentes).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Auction pricing</span><span class="ex-val fw400">El precio surge de una <strong>subasta</strong> (ej. eBay).</span></div> </div> </div>

<div class="card" id="c9-a7"> <div class="card-title"><i class="fa-solid fa-boxes-stacked c-accent"></i> Pricing models para múltiples productos</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Bundling</span><span class="ex-val">Productos <strong>complementarios</strong> vendidos juntos (ej. un departamento amoblado). Efectivo cuando los <strong>costos de marketing son altos</strong>: no hay que buscar compradores por separado ni hacer dos campañas.</span></div> <div class="ex-row"><span class="ex-label">Razors-and-blades</span><span class="ex-val"><strong>Equipo barato</strong> (márgenes bajos) y ganancia en el <strong>consumible</strong>. Ej.: impresora y tinta; e-reader y e-books; Verizon (celular barato, fees de red más altos).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Add-on pricing</span><span class="ex-val fw400">Extras de <strong>alto margen</strong> que se ofrecen <strong>después</strong> de que el cliente decidió comprar (ej. opcionales de un auto).</span></div> </div> </div>

<div class="card" id="c9-a8"> <div class="card-title"><i class="fa-solid fa-rocket c-accent"></i> Otros modelos de pricing</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Penetration pricing</span><span class="ex-val">Precio bajo (o a pérdida) por un tiempo para <strong>ganar market share</strong> y escala. Ej.: Netflix.</span></div> <div class="ex-row"><span class="ex-label">Freemium pricing</span><span class="ex-val">Versión <strong>básica gratis</strong>; lo extra se paga. Ej.: videojuegos, Spotify premium.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Hidden revenue</span><span class="ex-val fw400">Gratis para el usuario; el ingreso viene de la <strong>publicidad</strong>. Ej.: Google search (Schweser: venta de datos de usuario).</span></div> </div> </div>

<div class="card" id="c9-a8b"> <div class="card-title"><i class="fa-solid fa-scale-balanced c-accent"></i> Confusiones típicas entre pricing models</div> <div id="c9-a8b-loss" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Penetration pricing vs. loss leader</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-rocket"></i> Penetration pricing</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Precio bajo <strong>temporal</strong> para ganar market share.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-cart-shopping"></i> Loss leader</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Producto <strong>muy barato</strong> para que compren otras cosas (ej. supermercado). Término fuera de Schweser.</div> </div> </div><div id="c9-a8b-free" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Freemium vs. hidden revenue</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-unlock"></i> Freemium</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">El usuario <strong>puede pagar</strong> por más (Spotify premium).</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-bullhorn"></i> Hidden revenue</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Paga un <strong>tercero</strong>, no el usuario (Google; Spotify gratis con ads).</div> </div> </div> </div>

<div class="card" id="c9-a9"> <div class="card-title"><i class="fa-solid fa-rotate c-accent"></i> Alternativas a la compra directa</div> <div class="card-body mb6">El cliente no compra de una vez. <strong>Licensing y franchising</strong> comparten la idea de dejar que otro use tu <strong>propiedad intelectual (IP)</strong>:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Subscription model</span><span class="ex-val">Pago periódico por <strong>acceso</strong> (ej. Microsoft Office, cloud storage).</span></div> <div class="ex-row"><span class="ex-label">Licensing</span><span class="ex-val">Licenciar la <strong>producción</strong> a un tercero (ej. una biotech le licencia su droga a un fabricante con fuerza de ventas y distribución).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Franchising</span><span class="ex-val fw400">El franchisee vende en un <strong>área específica</strong> y paga un <strong>% de sus ventas</strong> al franchisor, que da soporte de producto y marketing.</span></div> </div> </div>

<div class="subsection-label" id="c9-a-sub4"><i class="fa-solid fa-gem"></i> 3. Value proposition, value chain y supply chain</div>

<div class="card" id="c9-a10"> <div class="card-title"><i class="fa-solid fa-gem c-accent"></i> Value proposition vs. value chain</div> <div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-gem"></i> Value proposition</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Qué reciben los clientes y por qué lo valoran</strong>, frente a la competencia y sus precios.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-link"></i> Value chain</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Cómo la firma ejecuta</strong> su value proposition (cómo crea valor) a través de las funciones de Porter. Schweser suma: calidad, funcionalidad, servicio, proceso de venta y pricing relativo.</div> </div> </div> </div>

<div class="card" id="c9-a11"> <div class="card-title"><i class="fa-solid fa-diagram-project c-accent"></i> Porter: las 5 actividades de la value chain</div> <div class="card-body mb6">En <em>Competitive Advantage</em> (1985), <strong>Porter</strong> presenta 5 actividades (value chain analysis). La analysis las <strong>mapea</strong>, mira su <strong>costo</strong> y dónde se <strong>crea valor</strong> para el cliente, para ver si se gasta en lo que él valora:</div><div class="reason-box"> <span class="reason-num">1</span> <div class="reason-body"> <div class="reason-title">Inbound logistics</div> </div> </div><div class="reason-box"> <span class="reason-num">2</span> <div class="reason-body"> <div class="reason-title">Operations</div> </div> </div><div class="reason-box"> <span class="reason-num">3</span> <div class="reason-body"> <div class="reason-title">Outbound logistics</div> </div> </div><div class="reason-box"> <span class="reason-num">4</span> <div class="reason-body"> <div class="reason-title">Marketing</div> </div> </div><div class="reason-box" style="margin-bottom:0;"> <span class="reason-num">5</span> <div class="reason-body"> <div class="reason-title">Sales and service</div> </div> </div><div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span>Masterclass: <em>marketing and sales</em> + <em>service</em>. Schweser: <em>marketing</em> + <em>sales and service</em>. Son 5 en ambos.</span> </div> </div>

<div class="card" id="c9-a13"> <div class="card-title"><i class="fa-solid fa-truck-fast c-accent"></i> Value chain vs. supply chain</div> <div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-link"></i> Value chain</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Foco en <strong>lo que hace la firma</strong> para crear valor (sus funciones).</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-truck-fast"></i> Supply chain</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Procesos para crear un producto</strong>, internos y externos (suppliers, labor, etc.).</div> </div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-shapes" style="margin-right:6px;color:var(--accent)"></i>LOS 26.b — Tipos de business models</div>

<div class="card" id="c9-b2"> <div class="card-title"><i class="fa-solid fa-store c-accent"></i> Modelos convencionales y otros modelos</div> <div class="card-body mb6">Los <strong>convencionales</strong> son específicos de cada industria (recursos naturales, manufacturers, distributors, retailers, banks, brokers, service providers, software). Otros modelos:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Private label / contract manufacturers</span><span class="ex-val">Una empresa (ej. un supermercado) le <strong>paga a un contract manufacturer</strong> para que fabrique y vende el producto con <strong>su propia marca</strong>. Ej.: Kirkland de Costco.</span></div> <div class="ex-row"><span class="ex-label">Licensing agreements</span><span class="ex-val">Otra firma usa tu <strong>marca</strong> en sus productos, a cambio de un fee (ej. una lunchbox de Marvel).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Value-added resellers</span><span class="ex-val fw400"><strong>Instalación, service, soporte o customización</strong> de equipo complejo.</span></div> </div><div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>No confundir:</strong> licensing en 26.a es licenciar la <strong>producción</strong>; acá, los licensing agreements licencian la <strong>marca</strong>.</span> </div> </div>

<div class="card" id="c9-b3"> <div class="card-title"><i class="fa-solid fa-bolt c-accent"></i> Innovación: new entrants vs. incumbents</div> <div class="card-body">Los <strong>new entrants</strong> desafían a los <strong>incumbents</strong> con nueva tecnología. Ej.: pricing de <strong>SaaS</strong>, aerolíneas <strong>ultra-low-cost</strong>, <strong>discount brokers</strong>.</div><div id="c9-b3-bynta" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Ilustración (Masterclass): Bynta vs. Ocean Hill</div><div class="card-body mt10"><strong>Bynta</strong> (retailer de ropa, new entrant) vs. <strong>Ocean Hill</strong> (incumbent convencional). Con tecnología digital, Bynta puede:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Costos</span><span class="ex-val">Bajar el costo de <strong>comunicaciones y transacciones</strong>.</span></div> <div class="ex-row"><span class="ex-label">Outsourcing</span><span class="ex-val">Facilitarlo, para enfocarse en <strong>diseño y marketing</strong>.</span></div> <div class="ex-row"><span class="ex-label">Segmentación</span><span class="ex-val">Mejorarla y llegar a <strong>segmentos específicos</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Colaboración</span><span class="ex-val fw400">Usar <strong>network effects / crowdsourcing</strong>.</span></div> </div> </div>

<div class="card" id="c9-b4"> <div class="card-title"><i class="fa-solid fa-network-wired c-accent"></i> Network effects</div> <div class="card-body mb6">El <strong>valor de la red sube a medida que crece su base de usuarios</strong> (WhatsApp, eBay, Facebook). Capitaliza <strong>tamaño y alcance</strong> y respalda una estrategia inicial de <strong>penetration pricing</strong>.</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-user"></i> One-sided</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Un solo tipo de participante: los <strong>usuarios</strong> (ej. Facebook).</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-people-arrows"></i> Two-sided</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Dos grupos que se necesitan: <strong>sellers y buyers</strong> (eBay), <strong>hosts y guests</strong> (Airbnb). Con más de dos grupos: <strong>multi-sided</strong>.</div> </div> </div> </div>

<div class="card" id="c9-b5"> <div class="card-title"><i class="fa-solid fa-users-line c-accent"></i> Crowdsourcing</div> <div class="card-body mb6">Se beneficia de las <strong>contribuciones de los usuarios</strong>:</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Contenido</span><span class="ex-val">Wikipedia, TikTok.</span></div> <div class="ex-row"><span class="ex-label">Tráfico y eventos</span><span class="ex-val">Waze.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Mejoras de producto o nuevas aplicaciones</span><span class="ex-val fw400">Open-source software.</span></div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 26.1</div>
<div class="card bt-accent" id="c9-glossary"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Business model</span><span class="ex-val">5 preguntas: who, what, how, where, how much</span></div> <div class="ex-row"><span class="ex-label">B2B / B2C</span><span class="ex-val">Vende a empresas / a consumidores</span></div> <div class="ex-row"><span class="ex-label">Price taker / pricing power</span><span class="ex-val">Commodity indiferenciado / pocos competidores o alta diferenciación</span></div> <div class="ex-row"><span class="ex-label">Price discrimination</span><span class="ex-val">Precios distintos por grupo: tiered, dynamic, value-based, auction</span></div> <div class="ex-row"><span class="ex-label">Múltiples productos</span><span class="ex-val">Bundling, razors-and-blades, add-on pricing</span></div> <div class="ex-row"><span class="ex-label">Otros pricing models</span><span class="ex-val">Penetration, freemium, hidden revenue</span></div> <div class="ex-row"><span class="ex-label">Alternativas a la compra</span><span class="ex-val">Subscription, licensing, franchising (uso de IP)</span></div> <div class="ex-row"><span class="ex-label">Value proposition / chain / supply chain</span><span class="ex-val">Qué valoran los clientes / cómo la firma lo ejecuta (Porter) / procesos para crear el producto, internos y externos</span></div> <div class="ex-row"><span class="ex-label">Otros modelos (26.b)</span><span class="ex-val">Private label (contract manufacturers), licensing agreements, value-added resellers</span></div> <div class="ex-row"><span class="ex-label">Innovación</span><span class="ex-val">New entrants + tecnología digital vs. incumbents (Bynta vs. Ocean Hill)</span></div> <div class="ex-row"><span class="ex-label">Network effects</span><span class="ex-val">El valor sube con los usuarios; one-sided vs. two-sided</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Crowdsourcing</span><span class="ex-val fw400">Contribuciones de usuarios: Wikipedia, TikTok, Waze, open-source</span></div> </div> </div>
</div>`;}

function openSearch() {
  document.getElementById('searchOverlay').classList.add('open');
  setTimeout(() => document.getElementById('searchInput').focus(), 50);
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('open');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('searchCount').style.display = 'none';
}
function closeSearchOnBg(e) { if(e.target === document.getElementById('searchOverlay')) closeSearch(); }

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Escape') closeSearch();
});

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  const count = document.getElementById('searchCount');

  if (q.length < 2) {
    results.innerHTML = `<div class="search-empty"><i class="fa-solid fa-magnifying-glass" style="font-size:24px;color:var(--border);display:block;margin-bottom:8px"></i>Escribe al menos 2 caracteres para buscar</div>`;
    count.style.display = 'none';
    return;
  }

  const words = q.split(/\s+/);
  const hits = searchIndex.filter(entry =>
    words.every(w => entry.text.toLowerCase().includes(w))
  );

  if (hits.length === 0) {
    results.innerHTML = `<div class="search-empty"><i class="fa-solid fa-face-sad-tear" style="font-size:24px;color:var(--border);display:block;margin-bottom:8px"></i>Sin resultados para "<strong>${q}</strong>"</div>`;
    count.style.display = 'none';
    return;
  }

  count.textContent = `${hits.length} resultado${hits.length > 1 ? 's' : ''} encontrado${hits.length > 1 ? 's' : ''}`;
  count.style.display = 'block';

  results.innerHTML = hits.map(hit => {
    let snippet = hit.text.slice(0, 160);
    words.forEach(w => {
      const re = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
      snippet = snippet.replace(re, '<mark>$1</mark>');
    });
    return `<div class="search-result-item" onclick="goToModule('${hit.module}', '${hit.anchor || ''}')">
      <div class="sri-module"><i class="fa-solid fa-book-open" style="margin-right:4px"></i>${moduleLabels[hit.module] || hit.label}</div>
      <div class="sri-text">${snippet}…</div>
    </div>`;
  }).join('');
});

function toggleExample(btn) {
  const body = btn.nextElementSibling;
  const isOpen = body.classList.toggle('example-open');
  btn.classList.toggle('open', isOpen);
}

function goToModule(moduleId, anchorId) {
  closeSearch();
  const btn = document.querySelector(`.nav-module-btn[data-id="${moduleId}"]`);
  if (btn) {
    const modList = btn.closest('.nav-module');
    if (modList) modList.classList.add('open');
    const secBtn = modList?.previousElementSibling;
    if (secBtn) secBtn.classList.add('open');
    btn.click();
  }
  if (anchorId) {
    setTimeout(() => {
      const target = document.getElementById(anchorId);
      if (!target) return;
      const exampleBody = target.classList.contains('example-body') ? target : target.closest('.example-body');
      if (exampleBody && !exampleBody.classList.contains('example-open')) {
        exampleBody.classList.add('example-open');
        const toggle = exampleBody.previousElementSibling;
        if (toggle && toggle.classList.contains('example-toggle')) toggle.classList.add('open');
      }
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('search-jump-highlight');
      setTimeout(() => target.classList.remove('search-jump-highlight'), 2600);
    }, 80);
  }
}
