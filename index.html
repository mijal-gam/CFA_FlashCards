</div>

<div class="card" style="border-top:3px solid var(--amber)" id="c2-c4"> <div class="card-title"><i class="fa-solid fa-temperature-arrow-up" style="color:var(--amber)"></i> Riesgos climáticos: physical, transition, stranded assets</div> <div class="card-body">Ante el cambio climático, las compañías enfrentan <strong>physical risk</strong> (efectos adversos sobre activos/operaciones si aumenta la frecuencia de clima severo) y <strong>transition risk</strong> (regulaciones o preferencias de consumo que exigen pasar de actividades high-carbon a low-carbon).</div> <div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Stranded assets:</strong> activos que se vuelven <strong>inviables</strong> debido a estos cambios. Políticas de seguridad pobres o governance inadecuado aumentan el riesgo de eventos adversos (ej. derrames de petróleo, contaminación de napas), con costos de penalidades, cleanup, litigios y pérdida de reputación.</span> </div> </div>

<div class="card bt-blue" id="c2-c5"> <div class="card-title"><i class="fa-solid fa-people-group c-blue"></i> Factores sociales y su impacto en costos</div> <div class="card-body">Los factores sociales contribuyen a la <strong>imagen</strong> de la compañía en cuanto a cómo trata a empleados, clientes y comunidades. Tomar medidas para reducir el riesgo social puede <strong>reducir costos</strong> a través de mayor productividad, menor rotación, mayor lealtad de clientes, y menor riesgo de litigios.</div> </div>

<div class="card bt-purple" id="c2-c6"> <div class="card-title"><i class="fa-solid fa-shield-halved c-purple"></i> Governance: checks sobre los managers</div> <div class="card-body">Los sistemas de corporate governance deben tener <strong>checks adecuados</strong> para asegurar que los managers actúen de forma <strong>ética, legal, y en interés de los shareholders</strong>. Incluye la composición del board y el audit committee, executive compensation, soborno/corrupción, contribuciones políticas, y lobbying.</div> </div>

<div class="card bt-purple" id="c2-c6b"> <div class="card-title"><i class="fa-solid fa-graduation-cap c-purple"></i> Trampa de examen: identificar el factor correcto por la palabra clave</div> <div class="card-body mb6"><em>"A company's effectiveness in managing long-term risks and sustainability is best classified as a: (A) social factor (B) governance factor (C) environmental factor"</em></div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(B) Governance factor</strong>.</span> </div> <div class="card-body mt8">Aunque <strong>"sustainability"</strong> suene a un tema environmental, la clave está en la palabra <strong>"managing"</strong>: evaluar y administrar riesgos —de cualquier naturaleza, incluidos los ambientales o sociales— es una función de <strong>oversight</strong>, y esa es precisamente la responsabilidad del <strong>board of directors</strong>. Por eso, la <strong>efectividad de una compañía en gestionar</strong> sus riesgos de largo plazo es, en sí misma, un factor de <strong>governance</strong> — independientemente de sobre qué tema verse el riesgo gestionado.</div> </div>

<div class="card" style="border-top:3px solid var(--red)" id="c2-c7"> <div class="card-title"><i class="fa-solid fa-shield-halved c-red"></i> Exposición diferencial: equity vs. debt investors ante riesgo ESG</div> <div class="card-body mb6">Los analistas deben identificar y medir los riesgos ESG a los que está expuesta una compañía, y cómo pueden afectar sus <strong>flujos de caja futuros</strong>.</div> <div class="contrast-row"> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-chart-line"></i> Equity investors</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">Absorben el <strong>grueso del riesgo</strong> de resultados adversos por su claim residual.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-hand-holding-dollar"></i> Debt investors</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;">Menor exposición, salvo que las pérdidas sean lo bastante grandes como para causar <strong>default</strong>.</div> </div> </div> <div class="alert alert-red mt10"> <i class="fa-solid fa-hourglass-half"></i> <span>No todos los debtholders están igualmente expuestos: como algunos riesgos ESG son <strong>de manifestación tardía</strong> (ej. una planta de carbón hoy compliant puede volverse obsoleta en el futuro), los debt investors de <strong>mayor maturity</strong> tienen más exposición que los de corto plazo.</span> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 21.1</div> <div class="card bt-accent" id="c2-formulas"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Lenders vs. shareholders</span><span class="ex-val">Claim contractual (prioridad, sin upside) vs. claim residual (upside ilimitado)</span></div> <div class="ex-row"><span class="ex-label">Leverage y ROE</span><span class="ex-val">Amplifica el ROE si el retorno de activos supera el costo de deuda; amplifica también las pérdidas</span></div> <div class="ex-row"><span class="ex-label">Covenants</span><span class="ex-val">Provisiones contractuales (leverage máximo, interest coverage mínimo) para proteger a debtholders</span></div> <div class="ex-row"><span class="ex-label">Shareholder theory</span><span class="ex-val">Foco en maximizar market value de equity; conflicto managers-owners</span></div> <div class="ex-row"><span class="ex-label">Stakeholder theory</span><span class="ex-val">Foco amplio: conflictos entre múltiples grupos de interés</span></div> <div class="ex-row"><span class="ex-label">One-tier vs. two-tier board</span><span class="ex-val">Un solo board (mayoría independiente) vs. supervisory + management board (Europa continental)</span></div> <div class="ex-row"><span class="ex-label">Staggered board</span><span class="ex-val">Solo una fracción se elige por año; reduce poder de shareholders para overhaul</span></div> <div class="ex-row"><span class="ex-label">ESG</span><span class="ex-val">Environmental, Social, Governance — factores no financieros con impacto material en cash flows</span></div> <div class="ex-row"><span class="ex-label">Physical risk / Transition risk</span><span class="ex-val">Efectos físicos del clima vs. costos de pasar a low-carbon; pueden generar stranded assets</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Exposición ESG: equity vs. debt</span><span class="ex-val fw400">Equity absorbe el grueso del riesgo; debt de mayor maturity más expuesto que el de corto plazo</span></div> </div> </div></div>`;}

function pageC3() { return `<div class="module-theme module-c3"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 22.a, 22.b, 22.c</div> <div class="page-title">Module 22.1: Corporate Governance</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 22: Corporate Governance</div>

<div class="card bt-accent" id="c3-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">Este módulo arranca definiendo el <strong>principal-agent relationship</strong> y los distintos <strong>conflictos de interés</strong> que pueden surgir entre stakeholders (shareholders vs. managers/directors, entre grupos de shareholders, y entre creditors y shareholders). Después recorre los <strong>mecanismos de corporate governance</strong> disponibles para cada grupo de stakeholders — shareholders (AGM, proxy voting, activismo), creditors (indentures, covenants, creditor committees), el board of directors (comités de audit, nominating/governance, compensation), empleados/customers/suppliers, y el gobierno. Cierra comparando los <strong>riesgos de una governance débil</strong> contra los <strong>beneficios de una governance efectiva</strong>.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-people-arrows" style="margin-right:6px;color:var(--accent)"></i>LOS 22.a — Principal-agent relationship y conflictos</div>

<div class="card bt-blue" id="c3-a1"> <div class="card-title"><i class="fa-solid fa-handshake c-blue"></i> Principal-agent relationship y agency costs</div> <div class="card-body">Cuando una parte (el <strong>principal</strong>) contrata a otra (el <strong>agent</strong>) para llevar a cabo una tarea, existe un <strong>principal-agent relationship</strong>. El <strong>principal-agent conflict</strong> surge porque el agent es contratado para actuar en interés del principal, pero sus propios intereses pueden no coincidir exactamente.</div> <div class="alert alert-blue mt10"> <i class="fa-solid fa-file-shield"></i> <span><strong>Ejemplo — insurance agent:</strong> a un agente de seguros se le paga comisión por póliza emitida, lo que lo incentiva a escribir pólizas sobre riesgos <strong>malos</strong> para maximizar su comisión — algo que el principal (la aseguradora) no quiere, porque le genera pérdidas. Las aseguradoras mitigan esto con <strong>underwriting standards</strong> y trabajando solo con agentes que consistentemente actúan en su interés.</span> </div> <div class="card-body mt8"><strong>Agency costs:</strong> son los costos del principal-agent conflict. Pueden ser <strong>directos</strong> (ej. contratar empleados para monitorear al agent) o <strong>indirectos</strong> (ej. el opportunity cost de negocio perdido).</div> </div>

<div class="card" id="c3-a2"> <div class="card-title"><i class="fa-solid fa-scale-unbalanced c-accent"></i> Conflictos entre shareholders y managers/directors</div> <div class="card-body">En una corporation, los <strong>shareholders</strong> son los principals (dueños), y el management y el board (directors) son sus <strong>agents</strong>. Managers y directors pueden preferir un <strong>menor nivel de riesgo</strong> del que preferirían los shareholders: los managers tienen su ingreso laboral atado a la firma y lo pierden si esta fracasa, mientras que los shareholders pueden diversificar sus portfolios fácilmente y preferir más riesgo por empresa.</div> <div class="alert alert-amber mt10"> <i class="fa-solid fa-eye-slash"></i> <span><strong>Information asymmetry:</strong> los managers tienen información <strong>más y mejor</strong> sobre el funcionamiento y la dirección estratégica de la firma que los shareholders — esto reduce la capacidad de shareholders o directors no ejecutivos de monitorear si los managers actúan en su interés. Es más aguda en compañías <strong>grandes</strong>, con <strong>productos complejos</strong>, que operan en <strong>múltiples geografías/negocios</strong>, y con <strong>menor ownership institucional y free float</strong>.</span> </div> </div>

<div class="card bt-purple" id="c3-a3"> <div class="card-title"><i class="fa-solid fa-list-check c-purple"></i> 5 formas comunes de principal-agent conflict (managers)</div> <div class="card-body mb6">Estos son los conflictos típicos entre shareholders y managers/directors:</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Esfuerzo insuficiente</span><span class="ex-val">Peor evaluación de oportunidades de inversión y riesgos, mayores costos totales</span></div> <div class="ex-row"><span class="ex-label">Compensación con options vs. cash</span><span class="ex-val">Options (sin downside) incentivan a subir el riesgo; cash puro puede desincentivar tomar riesgo necesario</span></div> <div class="ex-row"><span class="ex-label">Compensación atada al tamaño</span><span class="ex-val">Incentiva <strong>empire building</strong> vía adquisiciones pobres o innecesarias</span></div> <div class="ex-row"><span class="ex-label">Entrenchment</span><span class="ex-val">Managers toman riesgo inadecuado, imitan competidores en vez de innovar, o se aferran a proyectos que requieren su conocimiento específico — haciendo ver su trabajo como más difícil o especializado de lo que es, para que sea más difícil despedirlos (job security); directors se entrincheran acompañando decisiones de management sin cuestionarlas</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Self-dealing</span><span class="ex-val fw400">Explotar recursos de la firma para beneficio personal</span></div> </div> </div>

<div class="card bt-purple" id="c3-a3c"> <div class="card-title"><i class="fa-solid fa-graduation-cap c-purple"></i> Ejemplo: agency costs y compensación all-cash</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver pregunta, opciones y respuesta</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Una constructora tiene la oportunidad de invertir en un proyecto de infraestructura de alto riesgo y alto retorno. ¿Cuál de las siguientes podría ser una razón por la que la compañía decide <strong>no</strong> llevar adelante el proyecto?</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">La compensación de los managers está fuertemente atada al tamaño del negocio de la compañía</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">El management recibe compensación excesiva, toda en cash</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">El management recibió recientemente una generosa entrega de options sobre shares de la compañía</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(B)</strong>.</span> </div> <div class="card-body mt8">Como al management se le paga <strong>en cash, pase lo que pase</strong>, su compensación no depende del resultado del proyecto: si el proyecto <strong>sale bien</strong>, ese éxito no se traduce en mayor pago para ellos (no tienen options ni compensación atada al tamaño del negocio, como en A o C). Pero si el proyecto <strong>sale mal</strong>, sí enfrentan consecuencias — pérdida de reputación, posibilidad de ser despedidos, etc. Dado este perfil de <strong>solo downside y ningún upside</strong>, a los managers compensados 100% en cash les conviene, en su propio interés, <strong>evitar el riesgo</strong> y rechazar el proyecto — aunque agregar ese riesgo pudiera convenirle a los shareholders.</div> </div> </div>

<div class="card" style="border-top:3px solid var(--teal)" id="c3-a4"> <div class="card-title"><i class="fa-solid fa-users-viewfinder c-teal"></i> Conflictos entre grupos de shareholders</div> <div class="card-body mb6">La ownership de una corporation puede ser <strong>dispersed</strong> (widely held) o <strong>concentrated</strong>:</div> <div class="contrast-row"> <div class="contrast-box" style="background:var(--blue-light);"> <div class="contrast-label" style="color:var(--blue);"><i class="fa-solid fa-people-group"></i> Dispersed ownership</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;">Muchos <strong>minority shareholders</strong>, ninguno con una porción grande del total.</div> </div> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-user-shield"></i> Concentrated ownership</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">Refleja ownership <strong>individual</strong> o de un <strong>grupo</strong> (ej. una familia fundadora) — son los <strong>controlling shareholders</strong>.</div> </div> </div> <div class="card-body mt10">Un <strong>controlling shareholder</strong> (o grupo) puede tener la mayoría de los votos y actuar contra los <strong>minority shareholders</strong>. Si su riqueza está concentrada en la compañía, puede preferir que esta se <strong>diversifique</strong> hacia otros negocios para reducir su propio riesgo — algo que los minority shareholders (ya diversificados en sus propios portfolios) no quieren, porque implica <strong>malgastar recursos</strong> en un negocio menos atractivo.</div> <div class="alert alert-red mt10"> <i class="fa-solid fa-layer-group"></i> <span><strong>Dual-class structure:</strong> la concentración de ownership también puede surgir de tener distintas <strong>clases de shares</strong> — no solo de tener más shares. Distintas clases de common stock con distinto poder de voto le dan a un grupo (ej. los founders) <strong>control efectivo</strong> de la compañía aunque tengan derecho a <strong>menos del 50%</strong> de sus earnings y assets. CFA Institute está <strong>en contra</strong> de estas estructuras, porque permiten que un grupo favorezca sus intereses a costa de otros.</span> </div> </div>

<div class="card" style="border-top:3px solid var(--red)" id="c3-a4b"> <div class="card-title"><i class="fa-solid fa-scale-unbalanced c-red"></i> Dual-class structures: ilustración con casos reales</div> <div class="card-body mb6">Un dual-class share structure típicamente tiene <strong>Class A</strong> shares (un voto cada una) y <strong>Class B</strong> shares (múltiples votos cada una) — estas últimas suelen estar en manos de los <strong>founders</strong> de la compañía. Las distintas clases pueden transarse por separado, o algunas no transarse en absoluto.</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Meta Platforms</span><span class="ex-val">Mark Zuckerberg posee casi todas las Class B shares, con <strong>10 votos cada una</strong> — esto le da un <strong>61% del poder de voto total</strong> (2026)</span></div> <div class="ex-row bd-none"><span class="ex-label">Berkshire Hathaway</span><span class="ex-val">Class A con alto poder de voto y Class B con bajo poder de voto — las Class B tienen solo <strong>1/10.000</strong> del voting power de las Class A (2026)</span></div> </div> <div class="alert alert-red mt10"> <i class="fa-solid fa-circle-info"></i> <span>Clave: ambas clases suelen tener el <strong>mismo derecho económico</strong> (igual participación proporcional en las profits/dividends), pero <strong>no</strong> el mismo poder de <strong>voto</strong> — la desproporción está en el control, no en el reparto de resultados.</span> </div> </div>

<div class="card" style="border-top:3px solid var(--red)" id="c3-a4c"> <div class="card-title"><i class="fa-solid fa-graduation-cap c-red"></i> Ejemplo: controlling shareholder con 55%</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver pregunta, opciones y respuesta</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Un controlling shareholder de Stillcreek Corporation posee el <strong>55%</strong> de sus shares, y el resto está disperso entre un gran grupo de shareholders. En esta situación, los conflictos de interés son <strong>most likely</strong> a surgir entre:</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">Shareholders y bondholders</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">El controlling shareholder y los managers</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">El controlling shareholder y los minority shareholders</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(C)</strong>.</span> </div> <div class="card-body mt8">Con el <strong>55%</strong> de las shares, el controlling shareholder tiene la <strong>mayoría absoluta de los votos</strong> — puede aprobar lo que quiera (elegir al board, aprobar resoluciones, etc.) <strong>sin importar</strong> lo que prefieran los demás shareholders, ya que ellos solos no alcanzan para bloquearlo. Por eso el conflicto más probable es precisamente entre el controlling shareholder y los <strong>minority shareholders</strong>, no con bondholders (que no votan) ni con managers (a quienes el controlling shareholder, de hecho, puede terminar controlando a través del board).</div> </div> </div>

<div class="card bt-blue" id="c3-a5"> <div class="card-title"><i class="fa-solid fa-hand-holding-dollar c-blue"></i> Conflictos entre creditors y shareholders</div> <div class="card-body">Los shareholders pueden preferir <strong>más riesgo</strong> de negocio que los creditors, porque los creditors tienen un <strong>upside limitado</strong> frente a buenos resultados comparado con los shareholders. Acciones de management que favorecen a equity sobre creditors incluyen: emitir <strong>nueva deuda</strong> que aumenta el default risk de los debtholders existentes, o aumentar <strong>dividendos</strong> a costa de reducir los assets de la compañía que sirven de collateral (aumentando el riesgo de default).</div> <div class="alert alert-blue mt8"> <i class="fa-solid fa-hourglass-half"></i> <span>Este conflicto es un <strong>riesgo mayor</strong> para debtholders de <strong>largo plazo</strong>, que están expuestos por más tiempo a estas acciones.</span> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-shield-halved" style="margin-right:6px;color:var(--accent)"></i>LOS 22.b — Corporate governance y mecanismos</div>

<div class="card bt-accent" id="c3-b1"> <div class="card-title"><i class="fa-solid fa-sitemap c-accent"></i> Corporate governance: los 7 mecanismos</div> <div class="card-body">Corporate governance es el sistema de controles internos y procedimientos con el que se gestionan las compañías — provee una estructura para <strong>minimizar y gestionar</strong> los conflictos entre company insiders y shareholders, a través de estas <strong>7 categorías de mecanismos</strong>:</div>

<div class="subsection-label" id="c3-b1a"><i class="fa-solid fa-file-lines"></i> 1. Corporate reporting y transparency</div>
<div class="alert alert-blue"> <span><strong>Corporate reporting y transparency</strong> es la <strong>base (foundation)</strong> de la governance — la idea de ir informando qué está pasando en la compañía (assets, profits, etc.). Está <strong>mandado por ley y regulación</strong>. Las public companies divulgan información <strong>extensa</strong> vía <strong>annual reports, proxy statements y public notices</strong> (desempeño financiero, related-party transactions, remuneración ejecutiva, governance). Esta <strong>transparencia reduce la information asymmetry</strong>. Las private companies tienen <strong>mucho menos</strong> disclosure y suelen informar directamente a sus inversores.</span> </div>

<div class="subsection-label" id="c3-b2"><i class="fa-solid fa-people-roof"></i> 2. Shareholder mechanisms</div>
<div class="card-body mb6">El objetivo de los <strong>shareholder mechanisms</strong> es darle a los shareholders un canal para <strong>decir lo que quieren</strong> respecto de la gestión de la compañía — principalmente a través de <strong>2 tipos de meetings</strong>: la AGM y las EGMs.</div>
<div class="card-body">Las corporations suelen realizar una <strong>Annual General Meeting (AGM)</strong> después del cierre del año fiscal, donde el management presenta los <strong>audited financial statements</strong>, repasa el desempeño y responde preguntas. Cualquier shareholder puede asistir, hablar, preguntar y <strong>votar sus shares</strong>.</div>
<div class="alert alert-purple mt10"> <i class="fa-solid fa-signature"></i> <span><strong>Voting by proxy:</strong> un shareholder que no asiste puede asignar su derecho a voto a otra persona (a menudo un director, un miembro del management, o su asesor de inversiones) — la proxy puede especificar el voto en temas puntuales o dejarlo a discreción de quien la recibe.</span> </div>
<div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">AGM (annual general meeting)</span><span class="ex-val">La reunión anual. Agenda de rutina — aprobar auditor, elegir directors — que se decide por <strong>ordinary resolutions</strong> (simple majority)</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">EGM (extraordinary general meeting)</span><span class="ex-val fw400">Se convoca <strong>fuera</strong> del calendario anual, solo cuando hay que votar un tema especial — ej. cambios a bylaws, merger/takeover, election especial de board, liquidación</span></div> </div>
<div style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Shareholder activism</div>
<div class="card-body mt10" id="c3-b3">Los <strong>activist shareholders</strong> presionan a compañías donde tienen participación significativa para lograr cambios que creen que aumentarán el valor — iniciando <strong>lawsuits</strong>, buscando representación en el board, proponiendo resoluciones para votación, o llevando sus reclamos al público. Los <strong>hedge funds</strong> han incrementado su activismo en años recientes.</div>
<div class="alert alert-amber mt10"> <i class="fa-solid fa-file-signature"></i> <span><strong>Proxy contest:</strong> un grupo activista busca las proxies de otros shareholders para votar a favor de sus propuestas alternativas. También pueden hacer un <strong>tender offer</strong> por suficientes shares para ganar control.</span> </div>
<div style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Amenaza de takeover (un mecanismo aparte, no activismo)</div>
<div class="card-body mt10">Más allá del activismo, la sola <strong>amenaza</strong> de un <strong>hostile takeover</strong> (una adquisición no apoyada por el management) ya presiona a management/board a alinearse mejor con los shareholders — nadie quiere ser comprado y reemplazado por bajo desempeño. Pero esa misma amenaza también puede llevarlos a adoptar <strong>takeover defenses</strong> como <strong>staggered board elections</strong> o <strong>poison pill provisions</strong> (ofertas de shares adicionales a bajo precio para current shareholders), que dificultan la adquisición.</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: ¿qué describe mejor a los shareholder activists?</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>¿Cuál de las siguientes <strong>best</strong> describe a los shareholder activists? Los shareholder activists:</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">Ayudan a estabilizar la dirección estratégica de una compañía</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">Tienen poco efecto sobre los inversores de largo plazo de la compañía</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">Es poco probable que alteren la composición del shareholder base de la compañía</span></div> </div> <div class="alert alert-amber mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(A)</strong>.</span> </div> <div class="card-body mt8">Los activists presionan justamente para <strong>corregir el rumbo</strong> de compañías con management/board que consideran desalineados o con bajo desempeño — su presión (lawsuits, proxy contests, representación en el board) busca <strong>estabilizar</strong> la dirección estratégica hacia una que maximice valor. <strong>B es falsa:</strong> pueden tener un efecto <strong>significativo</strong> sobre long-term investors (cambios de estrategia, management, composición del board). <strong>C es falsa:</strong> tácticas como el tender offer o el proxy contest pueden justamente <strong>alterar</strong> quién compone el shareholder base.</div> </div>

<div class="subsection-label" id="c3-b4"><i class="fa-solid fa-file-contract"></i> 3. Creditor mechanisms</div>
<div class="card-body">Cuando una compañía emite un bono, especifica los derechos de los bondholders y sus obligaciones en un <strong>bond indenture</strong>, que típicamente incluye <strong>covenants</strong> (requieren o restringen ciertas acciones). Un bono puede tener <strong>collateral</strong> — un asset específico sobre el cual los bondholders tienen claim si hay default. Una institución financiera puede actuar como <strong>trustee</strong> para monitorear el cumplimiento de los covenants.</div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-people-group"></i> <span><strong>Creditor committees:</strong> se forman entre bondholders para proteger sus intereses cuando el issuer atraviesa distress financiero (algunos países las exigen en bankruptcy). Un <strong>ad hoc committee</strong> puede formarse cuando la compañía tiene dificultades para cumplir sus obligaciones — no representa a todos los bondholders, pero sus intereses suelen estar alineados.</span> </div>

<div class="subsection-label" id="c3-b5"><i class="fa-solid fa-users-gear"></i> 4. Board / management mechanisms</div>
<div class="card-body mb6">El board tiene comités integrados por miembros con expertise particular, que reportan al board (que retiene la responsabilidad general). Los siguientes 3 comités deberían estar compuestos <strong>solo por independent directors</strong>:</div>
<div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Audit committee</div> Responsables de las decisiones de <strong>financial reporting</strong> (accounting policies, depreciación, revenue recognition, etc.); oversight de la efectividad de internal controls e internal audit; hacen <strong>liaise</strong> (trabajan en conjunto) con los external auditors y con el internal audit; recomiendan al external auditor independiente y su compensación; proponen remedios según su revisión de audits. </div> </div>
<div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Nominating / governance committee</div> Decide <strong>quién va a ser</strong> el siguiente director, CEO, etc.; oversight del código de corporate governance (incluida elección del board); políticas de nominación de candidatos; implementa el código de ética y políticas de conflictos de interés; monitorea cambios regulatorios y asegura compliance. </div> </div>
<div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">3</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Compensation / remuneration committee</div> Decide <strong>cuánto</strong> se le está pagando a directors y senior managers, y de qué tipo (cash, options, shares); puede supervisar employee benefit plans y evaluar a senior managers. Debe estar compuesto <strong>solo por independent directors</strong> — los managers no deben evaluarse ni compensarse a sí mismos. </div> </div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-industry"></i> <span>Comités <strong>específicos de industria</strong>: <strong>risk committee</strong> (financial services — risk policy y risk tolerance) e <strong>investment committee</strong> (seguros — políticas de inversión y capital). El número y tamaño de comités depende del tamaño, complejidad y naturaleza del negocio; muchas regulaciones exigen audit committees.</span> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: compensation committee y risk-taking</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>El compensation committee de una compañía busca <strong>desalentar el excesivo risk-taking</strong> por parte de los managers. Es <strong>most likely</strong> que diseñe un incentive compensation plan que:</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">Permita a directors y managers tener mayor discreción sobre su propia remuneración</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">Incluya un componente variable de stock options condicionado al near-term stock performance</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">Otorgue shares (en vez de options) que hacen vesting a lo largo de varios años y están sujetas a minimum holding requirements</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(C)</strong>.</span> </div> <div class="card-body mt8"><strong>B es incorrecta:</strong> atar el payout a <strong>near-term stock performance</strong> genera más riesgo de corto plazo — el precio puede valer mucho o caer a nada en poco tiempo, lo que incentiva a los managers a <strong>tomar más riesgo</strong> para intentar maximizar ese resultado de corto plazo. <strong>C es correcta:</strong> las shares (a diferencia de las options) tienen valor incluso si el precio no sube, y el <strong>vesting</strong> (se ganan gradualmente con el tiempo) obliga al management a <strong>seguir trabajando varios años</strong> para efectivamente quedarse con las acciones — esto alinea sus incentivos con el desempeño <strong>sostenido de largo plazo</strong> de la compañía, en vez de premiar apuestas riesgosas de corto plazo.</div> </div>

<div class="subsection-label" id="c3-b6"><i class="fa-solid fa-people-group"></i> 5. Employee mechanisms</div>
<div class="card-body">Labor laws, employment contracts, y el derecho a formar unions son los mecanismos primarios. Algunos países exigen representación de empleados en el board de compañías grandes. Los <strong>ESOPs (employee stock ownership plans)</strong> ayudan a alinear intereses de compañía y empleados — al tener una porción de ownership, los empleados sienten que <strong>son parte de la empresa</strong>.</div>

<div class="subsection-label" id="c3-b6b"><i class="fa-solid fa-handshake"></i> 6. Customer y supplier mechanisms</div>
<div class="card-body">Los contratos son el mecanismo principal para gestionar la relación con customers y suppliers. Cada vez más, usan las <strong>redes sociales</strong> para influir en el comportamiento de la compañía.</div>

<div class="subsection-label" id="c3-b6c"><i class="fa-solid fa-landmark"></i> 7. Government mechanisms</div>
<div class="alert" style="background:var(--teal-light);color:#57554F;"> <span><strong>Government mechanisms:</strong> las <strong>leyes y regulaciones</strong> — incluyendo la protección y aplicación de property rights y contract rights — son la <strong>base (foundation)</strong> sobre la cual una compañía puede crecer con confianza. A esto se suman los <strong>corporate governance codes</strong>: la idea de <strong>"comply or explain"</strong> (cumplir la norma, o explicar por qué no se cumple), pensada para <strong>proteger a los inversores</strong>.</span> </div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span><strong>Dato curioso:</strong> Estados Unidos <strong>no tiene</strong> un corporate governance code nacional — aunque sí tiene leyes de securities a nivel nacional, como la <strong>Sarbanes-Oxley Act</strong>.</span> </div>

<div class="card-body mt10"><strong>Stakeholder management</strong> se basa en entender los intereses de los stakeholders y mantener una <strong>comunicación efectiva</strong> con ellos.</div>
</div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-triangle-exclamation" style="margin-right:6px;color:var(--accent)"></i>LOS 22.c — Riesgos y beneficios de la governance</div>

<div class="card" style="border-top:3px solid var(--red)" id="c3-c1"> <div class="card-title"><i class="fa-solid fa-circle-exclamation c-red"></i> Riesgos de una governance débil</div> <div class="card-body mb6">Una <strong>governance fuerte</strong> beneficia a las compañías, mientras que una <strong>governance débil</strong> puede disminuir su valor. Los riesgos y beneficios se agrupan en <strong>3 categorías</strong>: operational, legal/regulatory/reputational, y financial. Cuando la governance es débil, las funciones de control (audits, board oversight) también lo son, y algunos stakeholders pueden obtener ventaja a costa de otros.</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Operational</span><span class="ex-val">Accounting fraud / recordkeeping pobre — impacto negativo en performance y valor; managers sin monitoreo eligen riesgo subóptimo, incentive compensation mal diseñada, related-party transactions que benefician a amigos/familia en detrimento de shareholders</span></div> <div class="ex-row"><span class="ex-label">Legal / regulatory / reputational</span><span class="ex-val">Compliance pobre → legal y reputational risk; lawsuits de stakeholders; daño reputacional por incumplir regulaciones</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Financial</span><span class="ex-val fw400">Mala gestión de creditors' rights → puede llevar a debt default y bankruptcy</span></div> </div> </div>

<div class="card" style="border-top:3px solid var(--green)" id="c3-c2"> <div class="card-title"><i class="fa-solid fa-circle-check" style="color:var(--green)"></i> Beneficios de una governance efectiva</div> <div class="card-body mb6">Los beneficios reflejan la misma lógica en las 3 categorías:</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Operational</span><span class="ex-val">Mejor eficiencia operacional al alinear incentivos de management y board con los de shareholders; políticas formales sobre conflictos de interés y related-party transactions mejoran los resultados operativos</span></div> <div class="ex-row"><span class="ex-label">Legal / regulatory / reputational</span><span class="ex-val">Control y monitoreo efectivos evitan muchos riesgos legales y regulatorios</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Financial</span><span class="ex-val fw400">Buena governance con creditors reduce el riesgo de default/bankruptcy y, por lo tanto, el costo de la deuda; alinear intereses de management con shareholders lleva a mejor desempeño financiero</span></div> </div> <div class="alert alert-green mt10"> <i class="fa-solid fa-thumbs-up"></i> <span><strong>¿Por qué baja el costo de la deuda?</strong> Los inversores en deuda ven que la compañía está <strong>bien manejada</strong> y no tiene problemas de control — esa <strong>estabilidad percibida</strong> reduce el riesgo de default a sus ojos, y por eso le exigen a la compañía una <strong>tasa de interés menor</strong>.</span> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: ¿cuál NO es un beneficio de una buena governance?</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>¿Cuál de las siguientes <strong>no</strong> es un beneficio de una estructura de corporate governance efectiva?</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">El operating performance puede mejorar</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">El costo de la deuda de una corporation puede reducirse</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">Las decisiones y actividades corporativas requieren menos control</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(C)</strong> — no es un beneficio.</span> </div> <div class="card-body mt8"><strong>A y B sí son beneficios</strong> reales de una governance efectiva (ver tabla arriba). <strong>C es lo opuesto</strong> a un beneficio: una buena governance implica <strong>más</strong> control y monitoreo sobre las decisiones y actividades corporativas, no menos — el control es precisamente el mecanismo que genera los otros beneficios (mejor performance, menor costo de deuda), no algo que se pueda reducir.</div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 22.1</div> <div class="card bt-accent" id="c3-formulas"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Principal-agent relationship</span><span class="ex-val">Principal contrata a agent; conflicto surge si sus intereses no coinciden; agency costs (directos/indirectos)</span></div> <div class="ex-row"><span class="ex-label">Information asymmetry</span><span class="ex-val">Managers saben más que shareholders; más aguda en firmas grandes/complejas con bajo free float</span></div> <div class="ex-row"><span class="ex-label">Conflictos manager-shareholder</span><span class="ex-val">Esfuerzo insuficiente, options vs. cash, empire building, entrenchment, self-dealing</span></div> <div class="ex-row"><span class="ex-label">Controlling vs. minority shareholders</span><span class="ex-val">Controlling puede preferir diversificar la firma; dual-class structures dan control desproporcionado</span></div> <div class="ex-row"><span class="ex-label">Creditors vs. shareholders</span><span class="ex-val">Equity prefiere más riesgo; nueva deuda o mayores dividendos perjudican a debtholders existentes</span></div> <div class="ex-row"><span class="ex-label">AGM vs. EGM</span><span class="ex-val">AGM: reunión anual, agenda de rutina, ordinary resolutions (simple majority). EGM: se convoca fuera de calendario para temas especiales</span></div> <div class="ex-row"><span class="ex-label">Activismo / takeover defenses</span><span class="ex-val">Proxy contest, tender offer, hostile takeover vs. staggered board, poison pill</span></div> <div class="ex-row"><span class="ex-label">Creditor mechanisms</span><span class="ex-val">Bond indenture, covenants, collateral, trustee, creditor committees</span></div> <div class="ex-row"><span class="ex-label">Board committees</span><span class="ex-val">Audit, nominating/governance, compensation (solo independent directors), risk (financial), investment (seguros)</span></div> <div class="ex-row"><span class="ex-label">Riesgos governance débil</span><span class="ex-val">Fraud, related-party abuse, legal/reputational risk, default/bankruptcy</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Beneficios governance efectiva</span><span class="ex-val fw400">Mejor eficiencia operacional, menor costo de deuda, mejor desempeño financiero</span></div> </div> </div></div>`;}

<div class="card bt-accent" id="c4-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">Este módulo mide qué tan eficientemente una compañía convierte sus inversiones en cash. Arranca con el <strong>cash conversion cycle (CCC)</strong> — DOH + DSO − DPO — y cómo compararlo entre issuers. Sigue con el concepto de <strong>liquidez</strong> (para activos y para pasivos), sus fuentes primarias y secundarias, los <strong>3 ratios de liquidez</strong> (current, quick, cash), y los drags/pulls que la deterioran. Cierra con los <strong>objetivos y métodos</strong> de working capital management — enfoques conservative, moderate y aggressive — y los factores que determinan las fuentes de financiamiento de corto plazo de un issuer.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-arrows-rotate" style="margin-right:6px;color:var(--accent)"></i>LOS 23.a — Cash Conversion Cycle</div>

<div class="card bt-blue" id="c4-a1"> <div class="card-title"><i class="fa-solid fa-rotate c-blue"></i> Qué mide el CCC</div> <div class="card-body">El <strong>cash conversion cycle (CCC)</strong> mide la eficiencia con la que una compañía gestiona su flujo de caja: es el tiempo que le toma convertir sus inversiones en inventario y otros recursos en <strong>cash inflows</strong> por ventas. En otras palabras, mide qué tan rápido la compañía convierte sus inversiones en cash, y ese cash en nuevas oportunidades de inversión.</div>

<div class="card bt-accent" id="c4-a2"> <div class="card-title"><i class="fa-solid fa-square-root-variable c-accent"></i> Fórmula del CCC</div> <div class="fbox">CCC&nbsp;=&nbsp;DOH&nbsp;+&nbsp;DSO&nbsp;−&nbsp;DPO</div> <div class="var-table"> <div class="var-row"><span class="var-name">DOH</span><span class="var-desc"><strong>Days of inventory on hand</strong> — días que tarda en vender su inventario</span></div> <div class="var-row"><span class="var-name">DSO</span><span class="var-desc"><strong>Days sales outstanding</strong> — días que tarda en cobrarle a sus clientes</span></div> <div class="var-row"><span class="var-name">DPO</span><span class="var-desc"><strong>Days payable outstanding</strong> — días que tarda en pagarle a sus proveedores</span></div> </div> <div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>El cálculo de DOH, DSO y DPO se cubre en la lectura de Financial Statement Analysis sobre <strong>Financial Analysis Techniques</strong>. Acá el foco está en cómo se combinan e interpretan dentro del CCC.</span> </div> </div>

<div class="card" id="c4-a3"> <div class="card-title"><i class="fa-solid fa-gauge-high c-accent"></i> CCC bajo vs. CCC alto</div> <div class="contrast-row"> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-arrow-trend-down"></i> CCC bajo</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;">La compañía genera cash rápida y eficientemente — menos capital queda atado en working capital.</div> </div> <div class="contrast-box" style="background:var(--amber-light);"> <div class="contrast-label" style="color:var(--amber);"><i class="fa-solid fa-arrow-trend-up"></i> CCC alto</div> <div style="font-size:12.5px;color:#8A5A12;line-height:1.6;">Tarda más en convertir inversiones en cash — riesgo de problemas de flujo de caja y menor capacidad de invertir en crecimiento.</div> </div> </div> </div>

<div class="card" id="c4-a4"> <div class="card-title"><i class="fa-solid fa-scissors c-accent"></i> Cómo reducir el CCC — y sus contrapartidas</div> <div class="card-body mb6">La compañía puede reducir su CCC reduciendo inventarios y receivables, o aumentando (extendiendo) sus payables. Cada palanca tiene una desventaja potencial:</div>
<div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Reducir inventario (↓ DOH)</div> <strong>Métodos:</strong> eliminar productos de baja rotación · mantener niveles de inventario <strong>"just-in-time" (JIT)</strong> · analizar datos con cuidado para refinar los forecasts de demanda y los niveles de stock.<br><br>JIT significa sostener <strong>solo el inventario justo y necesario</strong> para vender y producir. Reduce el capital atado en inventario y por lo tanto el CCC — pero es también un <strong>riesgo</strong>: con menos stock de colchón, un shock inesperado de demanda puede dejar a la compañía sin suficiente producto terminado para vender, o sin suficiente materia prima para producir. </div> </div>
<div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Reducir/ajustar crédito a clientes (↓ DSO)</div> <strong>Métodos:</strong> ofrecer descuentos por pronto pago · incentivar pagos en cash, débito o tarjeta de crédito (suelen liquidarse de inmediato) · exigir depósitos por adelantado · cobrar cargos por atraso · endurecer los estándares de crédito. Endurecer las condiciones de crédito a clientes puede resultar en <strong>pérdida de ventas</strong>. </div> </div>
<div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">3</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Extender cuentas por pagar (↑ DPO)</div> <strong>Método:</strong> negociar con los proveedores plazos más largos a cambio de mayores volúmenes de compra — de <strong>éxito cuestionable</strong>, ya que depende del poder de negociación que el issuer pueda ejercer sobre sus proveedores. Las cuentas por pagar son además una fuente <strong>implícita</strong> de crédito de proveedores: resignar un descuento por pronto pago equivale a pedir prestado al proveedor, y ese costo implícito puede ser más caro que el financiamiento explícito de un banco (ver próxima card). </div> </div>
</div>

<div class="card bt-purple" id="c4-a5"> <div class="card-title"><i class="fa-solid fa-calculator c-purple"></i> Ejemplo: EAR del financiamiento implícito de proveedores</div> <div class="card-body mb6">Los proveedores suelen ofrecer condiciones de pago del tipo <strong>2/10 net 30</strong>: un <strong>discount%</strong> de descuento si se paga dentro del <strong>discount period</strong>, o el pago completo dentro del <strong>payment period</strong> (más largo). Resignar el descuento equivale a pedir prestado al proveedor por (payment period − discount period) días, a la siguiente tasa efectiva anual:</div> <div class="fbox"> <div class="fbox-eq" style="font-size:14px;"> <span>EAR&nbsp;of&nbsp;supplier&nbsp;financing&nbsp;=&nbsp;</span> <span>(1&nbsp;+</span> <span class="frac"><span class="frac-num">discount%</span><span class="frac-den">100%&nbsp;−&nbsp;discount%</span></span> <span>)</span> <sup style="font-size:0.68em;line-height:1;position:relative;top:-11px;margin-left:1px;"> <span class="frac" style="margin:0 3px;"><span class="frac-num">365</span><span class="frac-den">payment&nbsp;period&nbsp;−&nbsp;discount&nbsp;period</span></span> </sup> <span>&nbsp;−&nbsp;1</span> </div> </div> <div class="var-table"> <div class="var-row"><span class="var-name" style="min-width:110px;">discount period</span><span class="var-desc">días hasta que vence el descuento</span></div> <div class="var-row"><span class="var-name" style="min-width:110px;">payment period</span><span class="var-desc">días hasta el vencimiento del pago total</span></div> </div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-lightbulb"></i> <span><strong>La intuición detrás de la fórmula:</strong> con términos como 2/10 net 30, nadie paga antes de que termine el <strong>discount period</strong>, porque hasta ese día igual conserva el descuento. Si paga dentro del discount period, paga <strong>(100% − discount%)</strong> por cada 100 de factura (con un descuento de 1%, paga 99); si espera hasta el <strong>payment period</strong>, paga el <strong>100% completo</strong>. El costo de resignar el descuento <strong>no es el discount%</strong> — es lo que paga de más <strong>relativo a lo que hubiera pagado tomando el descuento</strong> (100% − discount%), es decir <strong>discount% / (100% − discount%)</strong>, no discount%/100%. Por eso el denominador de la fórmula es (100% − discount%) y no simplemente 100%. Ese costo corresponde al período de (payment period − discount period) días, y hay que <strong>anualizarlo</strong> elevando a 365 / (payment period − discount period) para poder compararlo con una tasa anual como la del banco.</span> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: 2/10 net 30 vs. tasa bancaria del 8%</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Un proveedor ofrece condiciones 2/10 net 30. La tasa de interés bancaria es 8%. ¿Qué fuente de financiamiento debería preferir la compañía?</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label">Días de financiamiento</span><span class="ex-val">30 − 10 = 20 días</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">EAR financiamiento proveedor</span><span class="ex-val fw400">(1 + 0.02/0.98)<sup>(365/20)</sup> − 1 = 0.446, o <strong>44.6%</strong></span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>El costo del financiamiento implícito del proveedor (<strong>44.6%</strong>) es mucho más alto que el costo del financiamiento explícito del banco (<strong>8%</strong>). La compañía debería <strong>pedir prestado al banco</strong> para pagarle al proveedor dentro de los 10 días y quedarse con el descuento.</span> </div> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: elegir los términos de crédito menos costosos entre 3 opciones</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Un issuer con cash flow limitado tiene que decidir cuál de las siguientes condiciones de crédito de sus proveedores es la menos costosa (menor EAR):</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">1/10, net 50</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">2/15, net 40</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">3/15, net 60</span></div> </div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label">EAR A</span><span class="ex-val">(1 + 0.01/0.99)<sup>(365/40)</sup> − 1 = 0.096, o 9.6%</span></div> <div class="ex-row"><span class="ex-label">EAR B</span><span class="ex-val">(1 + 0.02/0.98)<sup>(365/25)</sup> − 1 = 0.343, o 34.3%</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">EAR C</span><span class="ex-val fw400">(1 + 0.03/0.97)<sup>(365/45)</sup> − 1 = 0.280, o 28.0%</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(A) 1/10, net 50</strong> — es la que tiene el menor EAR (9.6%).</span> </div> <div class="card-body mt8"><strong>La trampa:</strong> un descuento mayor (3% en C) no significa necesariamente el menor costo. El EAR depende de la <strong>combinación</strong> entre el tamaño del descuento y el período (payment period − discount period) sobre el que se anualiza: A tiene el descuento más chico (1%) pero también el período más largo relativo a su descuento, así que ese costo termina diluido al anualizarlo. Siempre hay que calcular el EAR completo — no alcanza con mirar el % de descuento ni el período por separado.</div> </div>
</div>

<div class="card" id="c4-a6"> <div class="card-title"><i class="fa-solid fa-industry c-accent"></i> El CCC varía por industria</div> <div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-pills"></i> Pharmaceutical companies</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">CCC <strong>largo</strong> — mantienen inventarios de drogas de alto margen para cubrir picos inesperados de demanda.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-plane"></i> Airlines</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">CCC <strong>corto</strong> — la mayoría de las ventas se cobra por adelantado (prepaid) y no mantienen inventarios significativos.</div> </div> </div> <div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>Los analistas deben usar el CCC para comparar compañías <strong>dentro de la misma industria</strong>, o para trackear la evolución de una misma compañía en el tiempo — comparar el CCC entre industrias distintas no aporta información útil.</span> </div> </div>

<div class="card" id="c4-a7"> <div class="card-title"><i class="fa-solid fa-scale-balanced c-accent"></i> Working capital: total vs. neto (operativo)</div> <div class="card-body mb6">Además del CCC, el nivel general de working capital indica qué tan eficientemente una compañía gestiona su liquidez. Para comparar compañías de distinto tamaño, los analistas suelen calcular el working capital como <strong>proporción de las ventas</strong> — y como ese ratio varía por industria, hay que comparar firmas de líneas de negocio similares.</div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span><strong>NWC y CCC miden cosas distintas, pero relacionadas:</strong> el <strong>net working capital</strong> es el <strong>dinero ($)</strong> que queda atrapado en el ciclo operativo de corto plazo; el <strong>CCC</strong> es la cantidad de <strong>días</strong> que tarda la compañía en recuperar ese efectivo. Uno se mide en pesos, el otro en tiempo — pero un CCC más largo generalmente implica más NWC atado (relativo a ventas), y viceversa.</span> </div>
<div style="border-top:1px solid var(--border-light);margin-top:12px;padding-top:10px;"> <div style="font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-sec);margin-bottom:4px;">Total working capital</div> <div style="font-size:13px;color:var(--text-sec);line-height:1.6;">Todos los rubros corrientes, sin distinguir operativos de financieros — incluye cash, marketable securities y <strong style="color:var(--text);text-decoration:underline;text-decoration-color:var(--accent-mid);">deuda de corto plazo</strong>.</div> </div>
<div class="fbox mt10">Total&nbsp;working&nbsp;capital&nbsp;=&nbsp;Current&nbsp;assets&nbsp;−&nbsp;Current&nbsp;liabilities</div>
<div style="border-top:1px solid var(--border-light);margin-top:14px;padding-top:10px;"> <div style="font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-sec);margin-bottom:4px;">Net working capital (operativo)</div> <div style="font-size:13px;color:var(--text-sec);line-height:1.6;">La medida <strong>preferida</strong> por los analistas — separa lo <strong>operativo</strong> de lo <strong>financiero</strong>, por lo que está directamente vinculada al CCC.</div> </div>
<div class="fbox mt10">Net&nbsp;working&nbsp;capital&nbsp;=&nbsp;Current&nbsp;operating&nbsp;assets&nbsp;−&nbsp;Current&nbsp;operating&nbsp;liabilities</div>
<div class="card-body mt10 mb6" style="font-size:12.5px;">Es decir: <strong>(current assets excluyendo cash y marketable securities)</strong> menos <strong>(current liabilities excluyendo short-term debt y current portion de long-term debt)</strong>. La pregunta clave para clasificar cada cuenta:</div>
<div class="highlight-box" style="text-align:center;font-weight:650;color:var(--text);">"¿Esta cuenta forma parte de la operación normal de corto plazo del negocio?"</div>
<div class="contrast-row mt10"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-check"></i> Entra (operación de corto plazo)</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li><strong>Accounts receivable</strong> — clientes que todavía no pagan</li> <li><strong>Inventory</strong> — dinero metido en inventario</li> <li><strong>Prepaid expenses</strong> — gastos pagados por adelantado</li> <li><strong>Accounts payable</strong> — dinero que todavía no le pagamos a proveedores (resta)</li> <li><strong>Accrued expenses</strong> — gastos devengados no pagados (resta)</li> </ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-xmark"></i> No entra (financiamiento / largo plazo)</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li><strong>Cash y marketable securities</strong> — activos financieros, no atados al ciclo operativo</li> <li><strong>Short-term debt</strong> — decisión de financiamiento, no surge de comprar inventario o vender</li> <li><strong>Long-term debt</strong> — financiamiento, y además no es current</li> <li><strong>PP&E e intangibles</strong> — activos de largo plazo</li> <li><strong>Shareholders' equity</strong> — financiamiento, no operación</li> </ul> </div> </div>
<div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Ojo con el short-term debt</strong> (short-term loan, notes payable, current portion de long-term debt): es una cuenta <strong>current</strong>, así que <strong>sí entra</strong> al current/quick/cash ratio (que usan todos los current assets y current liabilities, sin distinguir origen). Pero <strong>no entra</strong> al NWC — el NWC solo mira lo <strong>operativo</strong>, nunca lo <strong>financiero</strong>, sea de corto o largo plazo.</span> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: calcular el net working capital de un issuer</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>A partir del siguiente balance sheet, el net working capital del issuer es el más cercano a: (A) −500 (B) 380 (C) 500</em></div> <div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:12px;"> <thead> <tr style="background:var(--bg);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Activos</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);"></th> <th style="padding:6px 8px;text-align:left;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Pasivos y equity</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);"></th> </tr> </thead> <tbody> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Cash</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">100</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Accounts payable</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">980</td></tr> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Marketable securities</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">20</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Accrued expenses</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">70</td></tr> <tr><td style="padding:5px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Accounts receivable</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">600</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Short-term debt</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">1,000</td></tr> <tr><td style="padding:5px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Inventory</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">800</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Long-term debt</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">2,000</td></tr> <tr><td style="padding:5px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Prepaid expenses</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">30</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Shareholders' equity</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">8,000</td></tr> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">PP&E</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">10,000</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Intangibles</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">500</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:5px 8px;font-weight:700;">Total assets</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;">12,050</td><td style="padding:5px 8px;font-weight:700;">Total pasivos + equity</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;">12,050</td></tr> </tbody> </table> </div> <div class="card-body mt10 mb6" style="font-size:12.5px;">Las cuentas en <strong>negrita</strong> son las operativas — el resto es cash, financiamiento, o activo de largo plazo, y queda afuera del NWC.</div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label">+ Current operating assets</span><span class="ex-val">600 + 800 + 30 = 1,430</span></div> <div class="ex-row"><span class="ex-label">− Current operating liabilities</span><span class="ex-val">980 + 70 = 1,050</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">= Net working capital</span><span class="ex-val fw400"><strong>380</strong></span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(B) 380</strong>.</span> </div> </div> </div>


<hr class="div"> <div class="section-label"><i class="fa-solid fa-droplet" style="margin-right:6px;color:var(--accent)"></i>LOS 23.b — Liquidez</div>

<div class="card bt-blue" id="c4-b1"> <div class="card-title"><i class="fa-solid fa-water c-blue"></i> Qué es la liquidez</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Liquidez de un activo</span><span class="ex-val">Qué tan <strong>cerca del cash</strong> está — ej. las marketable securities son muy líquidas</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Liquidez de un pasivo</span><span class="ex-val fw400">Qué tan cerca está de su <strong>settlement</strong> (vencimiento/pago)</span></div> </div> <div class="card-body mt10">En ambos casos, liquidez es cercanía <strong>dentro de los próximos 12 meses</strong> — por eso los activos y pasivos se presentan en el balance sheet en <strong>orden descendente de liquidez</strong>.</div>
<div class="contrast-row mt8"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-layer-group"></i> Current asset</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Cash</strong> es el activo más líquido, mientras que <strong>inventories</strong> suele ser el current asset menos líquido.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-layer-group"></i> Current liability</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;"><strong>Accrued payroll</strong> (a pagarse en pocos días) es más líquido que <strong>short-term debt</strong> que recién vence, por ejemplo, en 6 meses.</div> </div> </div>
<div class="card-body mt10">Para un corporate issuer, liquidez es la <strong>disponibilidad de cash</strong> y otros activos líquidos para cumplir sus obligaciones de corto plazo — en definitiva, la <strong>capacidad de cumplir sus pasivos de corto plazo</strong>. La <strong>solvencia de largo plazo</strong> depende de que la compañía genere suficiente cash de su negocio para servir sus pasivos. Los analistas evalúan la gestión de liquidez principalmente revisando el <strong>statement of cash flows</strong>.</div> <div class="card-body mt8">El inventario es <strong>menos líquido</strong> que accounts receivable: puede necesitar procesamiento antes de venderse, y una vez vendido se convierte en receivable, que todavía hay que cobrar para volverse cash.</div> </div>

<div class="card" id="c4-b1b"> <div class="card-title"><i class="fa-solid fa-money-bill-transfer c-accent"></i> Calculando el cash flow: CFO y Free Cash Flow</div> <div class="card-body mb6">Ya que la gestión de liquidez se evalúa principalmente mirando el <strong>statement of cash flows</strong>, conviene repasar cómo se arma el <strong>cash flow from operations (CFO)</strong>:</div> <div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-arrow-down"></i> Cash in</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.7;">Cash received from customers · interest and dividends received on financial investments</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-arrow-up"></i> Cash out</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.7;">Cash paid to employees and suppliers · taxes paid to governments · interest paid to lenders</div> </div> </div>
<div class="card-body mt10 mb6">A partir del CFO se calcula el <strong>free cash flow (FCF)</strong>: lo que queda <strong>discrecional</strong> después de reinvertir lo necesario para sostener el negocio — el remanente que, en principio, podría llegar a los shareholders.</div> <div class="fbox">Free&nbsp;cash&nbsp;flow&nbsp;=&nbsp;CFO&nbsp;−&nbsp;Investments&nbsp;in&nbsp;long-term&nbsp;assets</div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-lightbulb"></i> <span><strong>Ojo con qué número restar:</strong> el FCF <strong>no</strong> resta el cash flow from investing (CFI) tal como aparece en el statement of cash flows — el CFI ya es un <strong>neto</strong> de todas las entradas y salidas de la sección de investing (por ejemplo, puede incluir la venta de algún activo). Lo que se resta del CFO es específicamente el <strong>cash out</strong> de "investments in long-term assets" — la inversión en sí, no el CFI completo. Tampoco se incluye el lado de <strong>financing</strong> (ej. fondos levantados con una emisión de deuda): el FCF busca aislar cuánto cash sobra <strong>antes</strong> de esas decisiones de financiamiento.</span> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: Free cash flow de Lucor Corporation</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>A partir del siguiente statement of cash flows, el free cash flow de Lucor Corporation para este período es el más cercano a: (A) 200 (B) 600 (C) 700</em></div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label">Net income</span><span class="ex-val">1,000</span></div> <div class="ex-row"><span class="ex-label">Cash flow from operations (CFO)</span><span class="ex-val">1,400</span></div> <div class="ex-row"><span class="ex-label">Cash flow from investing (CFI)</span><span class="ex-val">(700)</span></div> <div class="ex-row"><span class="ex-label" style="padding-left:12px;">↳ Investment in long-term assets</span><span class="ex-val">(800)</span></div> <div class="ex-row"><span class="ex-label">Cash flow from financing (CFF)</span><span class="ex-val">500</span></div> <div class="ex-row"><span class="ex-label" style="padding-left:12px;">↳ Funds from debt issue</span><span class="ex-val">600</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Total net cash flow</span><span class="ex-val fw400">1,200</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Free cash flow = CFO − investment in long-term assets = 1,400 − 800 = <strong>600</strong> (respuesta B). Se usa la inversión en activos de largo plazo (800), <strong>no</strong> el CFI neto (−700) ni los fondos de la emisión de deuda (600).</span> </div> </div> </div>

<div class="card bt-blue" id="c4-b2"> <div class="card-title"><i class="fa-solid fa-layer-group c-blue"></i> Fuentes de liquidez: primarias y secundarias</div> <div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-star"></i> Primarias</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li>Cash y marketable securities en caja</li> <li>Bank borrowings</li> <li>Cash generado por el propio negocio</li> </ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-life-ring"></i> Secundarias</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li>Suspender dividendos</li> <li>Reducir/postergar capex</li> <li>Vender activos</li> <li>Emitir equity adicional</li> <li>Reestructurar deuda extendiendo su maturity</li> <li>Acogerse a bankruptcy protection (suspende la obligación de servir los pasivos)</li> </ul> </div> </div> <div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Recurrir a fuentes <strong>secundarias</strong> envía señales negativas al mercado, y en general son <strong>más costosas</strong> que las fuentes primarias.</span> </div> </div>

<div class="card bt-purple" id="c4-b3"> <div class="card-title"><i class="fa-solid fa-calculator c-purple"></i> Ejemplo: costo de liquidez de Drake Corporation</div> <div class="card-body mb6">El <strong>costo de liquidez</strong> es el descuento sobre el fair market value al que se vende un activo por la necesidad de liquidez <strong>inmediata</strong>, en vez de esperar el tiempo normal de venta.</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: proceeds netos y costo de liquidez</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Drake Corporation necesita liquidez inmediata para cubrir su payroll. Calculá los proceeds netos totales y el costo de liquidez en dólares y en porcentaje.</em></div> <div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:12px;"> <thead> <tr style="background:var(--bg);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Fuente</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Fair value ($000s)</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Liquidation cost</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Net proceeds</th> </tr> </thead> <tbody> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Cash y marketable securities</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$100</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">0%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$100</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Inventory y receivables</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$200</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">15%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$170</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Empty warehouse</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$300</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">30%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$210</td></tr> <tr><td style="padding:6px 8px;font-weight:700;">Total</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;">$600</td><td style="padding:6px 8px;"></td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;">$480</td></tr> </tbody> </table> </div> <div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Costo de liquidez = $600 − $480 = <strong>$120,000</strong>, o 120 / 600 = <strong>20%</strong>.</span> </div> </div> </div>

<div class="card" id="c4-b4"> <div class="card-title"><i class="fa-solid fa-arrows-left-right-to-line c-accent"></i> Drags y pulls sobre la liquidez</div> <div class="card-body mb6">Un aumento del CCC reduce la liquidez del issuer, y puede originarse en un drag o en un pull:</div> <div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-arrow-down-long"></i> Drag on liquidity</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Los cash inflows <strong>se atrasan</strong> — exceso de inventario o inventario obsoleto (↑ DOH), cobros lentos o receivables incobrables (↑ DSO).</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-arrow-right-long"></i> Pull on liquidity</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Los cash outflows <strong>se aceleran</strong> — los proveedores reducen líneas de crédito o exigen pagos más rápidos (↓ DPO).</div> </div> </div> </div>
