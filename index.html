<script>
// ─────────────────────────────────────────────
// DATA STRUCTURE
// ─────────────────────────────────────────────
const curriculum = [
  {
    id: 'corp',
    label: 'Corporate Issuers',
    icon: 'fa-building',
    modules: [
      { id: 'c1', label: 'Module 20.1: Features of Corporate Issuers', short: 'Features of Corporate Issuers' },
      { id: 'c2', label: 'Module 21.1: Stakeholders and ESG Factors', short: 'Stakeholders and ESG Factors' },
      { id: 'c3', label: 'Module 22.1: Corporate Governance', short: 'Corporate Governance' },
      { id: 'c4', label: 'Module 23.1: Liquidity Measures and Management', short: 'Liquidity Measures and Management' },
      { id: 'c5', label: 'Module 24.1: Capital Investments and Project Measures', short: 'Capital Investments and Project Measures' },
      { id: 'c6', label: 'Module 24.2: Capital Allocation Principles and Real Options', short: 'Capital Allocation Principles and Real Options' },
      { id: 'c7', label: 'Module 25.1: Weighted-Average Cost of Capital', short: 'Weighted-Average Cost of Capital' },
      { id: 'c8', label: 'Module 25.2: Capital Structure Theories', short: 'Capital Structure Theories' },
      { id: 'c9', label: 'Module 26.1: Business Model Features and Types', short: 'Business Model Features and Types' },
    ]
  },
];

// ─────────────────────────────────────────────
// BUILD SIDEBAR
// ─────────────────────────────────────────────
const navTree = document.getElementById('navTree');

curriculum.forEach(section => {
  const sec = document.createElement('div');
  sec.className = 'nav-section';

  const btn = document.createElement('button');
  btn.className = 'nav-section-btn';
  btn.innerHTML = `<i class="fa-solid ${section.icon}" style="font-size:11px;width:14px;text-align:center"></i>${section.label}<i class="fa-solid fa-chevron-right chevron"></i>`;
  btn.onclick = () => {
    btn.classList.toggle('open');
    modList.classList.toggle('open');
  };

  const modList = document.createElement('div');
  modList.className = 'nav-module';

  section.modules.forEach(mod => {
    const mb = document.createElement('button');
    mb.className = 'nav-module-btn';
    mb.dataset.id = mod.id;
    mb.dataset.section = section.label;
    mb.dataset.label = mod.label;
    mb.innerHTML = `<span class="mod-dot"></span>${mod.label}`;
    mb.onclick = () => navigate(mod.id, section.label, mod.label, mb);
    modList.appendChild(mb);
  });

  sec.appendChild(btn);
  sec.appendChild(modList);
  navTree.appendChild(sec);
});

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function navigate(id, sectionLabel, modLabel, btn) {
  document.querySelectorAll('.nav-module-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('breadcrumb').innerHTML =
    `<span>CFA Level I</span> <i class="fa-solid fa-chevron-right" style="font-size:9px"></i> <span>${sectionLabel}</span> <i class="fa-solid fa-chevron-right" style="font-size:9px"></i> <span class="current">${btn.querySelector('.mod-dot').nextSibling.textContent.trim().split(':')[0]}</span>`;

  const pages = { c1: pageC1, c2: pageC2, c3: pageC3, c4: pageC4, c5: pageC5, c6: pageC6, c7: pageC7, c8: pageC8, c9: pageC9 };
  const fn = pages[id] || pageComingSoon;
  document.getElementById('content').innerHTML = fn();
  initCalcs();
  document.getElementById('main').scrollTop = 0;
  closeSidebar();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

// Home
function showHome() {
  document.getElementById('breadcrumb').innerHTML = `<span class="current">CFA Level I — Study Notes</span>`;
  document.getElementById('content').innerHTML = pageHome();
  closeSidebar();
}

// ─────────────────────────────────────────────
// PAGES
// ─────────────────────────────────────────────
function pageHome() {
  const mods = curriculum[0].modules;
  return `
  <div class="home-hero">
    <div class="home-hero-eyebrow">CFA Level I · Corporate Issuers</div>
    <div class="home-hero-title">Elegí un módulo para empezar</div>
    <div class="home-hero-sub">9 módulos — Readings 20, 21, 22, 23, 24, 25 y 26 (el 24 tiene dos: 24.1 y 24.2, y el 25 también: 25.1 y 25.2). Podés saltar entre ellos o usar ⌘K para buscar un concepto puntual.</div>
  </div>
  <div class="home-grid">
    ${mods.map((m,i) => {
      const num = m.label.split(':')[0].replace('Module ', '');
      return `
    <div class="home-card module-theme module-c${i+1}" onclick="openModule('${m.id}')">
      <div class="home-card-num">${num}</div>
      <div class="home-card-title">${m.short}</div>
      <div class="home-card-sub">Reading ${num.split('.')[0]}</div>
      <div class="home-card-cta">Estudiar <i class="fa-solid fa-arrow-right"></i></div>
    </div>`;
    }).join('')}
  </div>`;
}
function openModule(id) {
  const btn = document.querySelector(`.nav-module-btn[data-id="${id}"]`);
  if (btn) {
    const modList = btn.closest('.nav-module');
    if (modList) modList.classList.add('open');
    const secBtn = modList?.previousElementSibling;
    if (secBtn) secBtn.classList.add('open');
    btn.click();
  }
}

function openSection(id) {
  const sectionBtns = navTree.querySelectorAll('.nav-section-btn');
  sectionBtns.forEach((sb, i) => {
    if (curriculum[i].id === id) {
      const modList = sb.nextElementSibling;
      const isOpen = sb.classList.contains('open');
      if (isOpen) {
        sb.classList.remove('open');
        modList.classList.remove('open');
      } else {
        sb.classList.add('open');
        modList.classList.add('open');
        const sidebarEl = document.getElementById('sidebar');
        const backdropEl = document.getElementById('sidebarBackdrop');
        if (sidebarEl) sidebarEl.classList.add('open');
        if (backdropEl) backdropEl.classList.add('open');
        sb.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  });
}

function pageComingSoon() {
  return `<div class="page-title">Próximamente</div><div class="page-sub">Este módulo todavía no está armado.</div>`;
}

function pageC1() { return `<div class="module-theme module-c1"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 20.a, 20.b, 20.c</div> <div class="page-title">Module 20.1: Features of Corporate Issuers</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 20: Features of Corporate Issuers</div>

<div class="card bt-accent" id="c1-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">Este módulo compara las <strong>4 formas organizacionales</strong> de un negocio (sole proprietorship, general partnership, limited partnership, corporation) según 5 características clave: separación legal, quién opera, liability, tratamiento impositivo, y acceso a capital. Después entra en el detalle de la <strong>corporation</strong> — la forma dominante entre las firmas grandes — con sus <strong>key features</strong> (articles of incorporation, shares, board of directors) y la <strong>double taxation</strong> de dividendos. Cierra comparando <strong>public vs. private</strong> corporations, y los <strong>3 caminos</strong> para que una empresa privada se vuelva pública (IPO, direct listing, SPAC).</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-building" style="margin-right:6px;color:var(--accent)"></i>LOS 20.a — Formas organizacionales de un negocio</div>

<div class="card bt-blue" id="c1-a1"> <div class="card-title"><i class="fa-solid fa-list-check c-blue"></i> 5 características clave para comparar</div> <div class="card-body mb6">Las formas organizacionales son cómo se estructura legal y organizativamente un negocio. Para compararlas usamos 5 características:</div> <ul style="margin:0;padding-left:20px;font-size:13px;line-height:1.8;color:var(--text);"> <li>¿Es el negocio una <strong>entidad legal separada</strong> de sus dueños?</li> <li>¿Los dueños <strong>operan</strong> el negocio, o hay una relación distinta entre dueños y operadores?</li> <li>¿La liability de los dueños por deudas y acciones del negocio es <strong>limitada o ilimitada</strong>?</li> <li>¿Cuál es el <strong>tax treatment</strong> de las ganancias o pérdidas del negocio?</li> <li>¿Qué tan fácil es el <strong>acceso a capital adicional</strong> para financiar expansión y distribuir riesgo?</li> </ul> <div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>Vamos a comparar estas 5 características entre <strong>4 tipos</strong> de estructura de negocio: sole proprietorship, general partnership, limited partnership, y corporation.</span> </div> </div>

<div class="card bt-blue" id="c1-a2"> <div class="card-title"><i class="fa-solid fa-people-group c-blue"></i> Sole proprietorship, general partnership y limited partnership</div> <div class="card-body mb6">Una <strong>partnership</strong> es un negocio con <strong>múltiples dueños</strong>; existen tres variantes según cómo se reparten operación y liability entre ellos: <strong>general partnership</strong>, <strong>limited partnership</strong>, y <strong>limited liability partnership (LLP)</strong>. La sole proprietorship, en cambio, tiene un solo dueño. Ninguna de las tres es una entidad legal separada de sus dueños.</div>

<div style="border-top:1px solid var(--border-light);margin-top:10px;padding-top:10px;"> <div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:4px;"><i class="fa-solid fa-user" style="color:var(--text-sec);width:16px;"></i> Sole proprietorship</div> <div style="font-size:13px;color:var(--text-sec);line-height:1.6;">Negocio poseído y operado por <strong>un individuo</strong>, que es una extensión legal del dueño. El dueño tiene <strong>unlimited liability</strong> y recibe todos los profits/losses, que se gravan como su <strong>ingreso personal</strong>. Al depender del financiamiento del propio dueño, suele ser de <strong>escala pequeña</strong>.</div> </div>

<div style="border-top:1px solid var(--border-light);margin-top:10px;padding-top:10px;"> <div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:4px;"><i class="fa-solid fa-people-arrows" style="color:var(--text-sec);width:16px;"></i> General partnership</div> <div style="font-size:13px;color:var(--text-sec);line-height:1.6;">Dos o más individuos (<strong>general partners</strong>) <strong>poseen y operan</strong> el negocio juntos, y son <strong>liable</strong> (unlimited liability) por los reclamos contra la partnership. El <strong>partnership agreement</strong> — escrito, verbal, o incluso incidental a través de las acciones de los partners — especifica responsabilidades y el reparto de profits/losses, que se gravan como <strong>ingreso personal</strong> de cada partner.</div> </div>

<div style="border-top:1px solid var(--border-light);margin-top:10px;padding-top:10px;"> <div style="font-weight:700;font-size:13px;color:var(--text);margin-bottom:4px;"><i class="fa-solid fa-user-shield" style="color:var(--text-sec);width:16px;"></i> Limited partnership</div> <div style="font-size:13px;color:var(--text-sec);line-height:1.6;margin-bottom:6px;">Coexisten siempre <strong>dos niveles</strong> de partners: al menos un <strong>general partner</strong> (opera el negocio, unlimited liability, porción mayor de los profits por administrar) y uno o más <strong>limited partners</strong> (limited liability limitada al monto invertido, claims proporcionales a su inversión, típicamente sin voto para nombrar/remover general partners). El reparto de profits entre ambos se define en el partnership agreement, y se gravan como <strong>ingreso personal</strong> de cada partner.</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;background:var(--bg);border-radius:6px;padding:8px 10px;"><strong style="color:var(--text);">LLP (limited liability partnership):</strong> variante permitida en algunas jurisdicciones donde <strong>no</strong> hay general partner — todos son limited partners. En EE.UU. solo está permitida para proveedores de <strong>servicios profesionales</strong> (ej. abogacía, contabilidad), con restricciones sobre número de partners y equity investment.</div> </div>
</div>

<div class="card bt-accent" id="c1-a5"> <div class="card-title"><i class="fa-solid fa-building c-accent"></i> Corporation (limited company)</div> <div class="card-body">Lo que distingue a una corporation de las demás estructuras: es una <strong>entidad legal separada</strong> de sus dueños y managers. Todos los shareholders tienen <strong>limited liability</strong> — un dueño puede perder toda su inversión si la compañía quiebra y el valor de sus shares cae a cero, pero <strong>más allá</strong> de esa inversión inicial, los shareholders no son responsables por reclamos contra la corporation.</div> <div class="card-body mt8">Una corporation <strong>puede, pero no está obligada</strong>, a distribuir sus profits a sus dueños. La mayoría de las firmas grandes son corporations porque esta estructura les da el <strong>mayor acceso a capital</strong>, tanto <strong>debt</strong> (capital prestado) como <strong>equity</strong> (capital de propiedad).</div> <div class="alert alert-blue mt10"> <i class="fa-solid fa-users-gear"></i> <span><strong>Separación de dueños y managers:</strong> un inversor que compra shares de una corporation <strong>no influye directamente</strong> en las operaciones diarias de la compañía. En cambio, los dueños designan un <strong>board of directors</strong>, responsable de contratar a los senior managers que operan la compañía. El board y los managers que contrata son responsables de actuar en <strong>interés de los shareholders</strong>.</span> </div> <div class="alert alert-amber mt10"> <i class="fa-solid fa-money-bill-wave"></i> <span>Dependiendo del país, los profits de una corporation pueden estar sujetos a <strong>double taxation</strong> si el gobierno grava a las compañías sobre sus earnings, y además grava los <strong>dividendos</strong> (distribuciones de earnings a los dueños) como ingreso personal — ver el ejemplo numérico en la próxima card.</span> </div> </div>

<div class="card" id="c1-a6"> <div class="card-title"><i class="fa-solid fa-table c-accent"></i> Tabla comparativa de las 4 formas organizacionales</div> <div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:11.5px;"> <thead> <tr style="background:var(--bg);"> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Característica</th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Sole proprietorship</th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">General partnership</th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Limited partnership</th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Corporation</th> </tr> </thead> <tbody> <tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);">Entidad legal separada</td> <td style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--border-light);color:var(--red);font-weight:700;">✕ No</td> <td style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--border-light);color:var(--red);font-weight:700;">✕ No</td> <td style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--border-light);color:var(--red);font-weight:700;">✕ No</td> <td style="padding:7px 8px;text-align:center;border-bottom:1px solid var(--border-light);color:var(--green);font-weight:700;">✓ Sí</td> </tr> <tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);">¿Quién opera?</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">El dueño</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">Los partners</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">Solo los general partners</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">Managers contratados por el board</td> </tr> <tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);">Liability</td> <td style="padding:7px 8px;color:var(--red);font-weight:700;border-bottom:1px solid var(--border-light);">Unlimited</td> <td style="padding:7px 8px;color:var(--red);font-weight:700;border-bottom:1px solid var(--border-light);">Unlimited</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">Unlimited (general) / Limited (limited)</td> <td style="padding:7px 8px;color:var(--green);font-weight:700;border-bottom:1px solid var(--border-light);">Limited (todos)</td> </tr> <tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);">Tax treatment</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">Ingreso personal del dueño</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">Ingreso personal de cada partner</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);">Ingreso personal de cada partner</td> <td style="padding:7px 8px;color:var(--amber);font-weight:700;border-bottom:1px solid var(--border-light);">Posible double taxation</td> </tr> <tr> <td style="padding:7px 8px;font-weight:600;">Acceso a capital</td> <td style="padding:7px 8px;color:var(--text-sec);">Limitado a la capacidad del dueño</td> <td style="padding:7px 8px;color:var(--text-sec);">Limitado a los partners</td> <td style="padding:7px 8px;color:var(--text-sec);">Algo mayor (varios limited partners)</td> <td style="padding:7px 8px;color:var(--green);font-weight:700;">El mayor — debt y equity</td> </tr> </tbody> </table> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-file-signature" style="margin-right:6px;color:var(--accent)"></i>LOS 20.b — Key features de la corporation</div>

<div class="card bt-blue" id="c1-b1"> <div class="card-title"><i class="fa-solid fa-file-contract c-blue"></i> Articles of incorporation y derechos de una entidad legal</div> <div class="card-body">La identidad legal de una corporation es separada de la de sus dueños, y se forma mediante la presentación de los <strong>articles of incorporation</strong> ante un regulatory body. Como entidad legal, una corporation tiene muchos de los derechos y responsabilidades de un individuo, como el derecho a <strong>contratar empleados, celebrar contratos, y pedir/prestar dinero</strong>.</div> <div class="card-body mt8">Una corporation emite <strong>shares</strong> a sus dueños (shareholders), lo que le permite recaudar grandes cantidades de capital. Los shareholders tienen <strong>voting rights</strong> que les permiten elegir al board of directors. Las shares son fácilmente <strong>transferibles</strong> si se transan en un exchange. El board of directors puede distribuir una porción de las earnings de la compañía a los shareholders como <strong>dividendos</strong>.</div> </div>

<div class="card bt-purple" id="c1-b2"> <div class="card-title"><i class="fa-solid fa-calculator c-purple"></i> Ejemplo: double taxation de dividendos</div> <div class="card-body mb6">ABC Corporation tiene pretax earnings de $10 millones y una corporate tax rate del 25%. Los shareholders son gravados al 20% sobre su dividend income. Calculá el effective tax rate si: (a) el 100% de los profits se pagan como dividendos, y (b) el 40% de los profits se pagan como dividendos.</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver desarrollo y respuesta</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:12px;"> <thead> <tr style="background:var(--purple-light);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:#4F46E5;"></th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#4F46E5;">a) 100% payout</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#4F46E5;">b) 40% payout</th> </tr> </thead> <tbody> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Earnings before tax</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$10,000,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$10,000,000</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">(−) Corporate income tax @ 25%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">2,500,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">2,500,000</td></tr> <tr><td style="padding:6px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">(=) After-tax income</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">7,500,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">7,500,000</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Dividends</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">7,500,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">3,000,000</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Tax on dividends @ 20%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">1,500,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">600,000</td></tr> <tr><td style="padding:6px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Total tax paid</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">4,000,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">3,100,000</td></tr> <tr><td style="padding:6px 8px;font-weight:700;color:var(--purple);">Effective tax rate</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--purple);">40%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--purple);">31%</td></tr> </tbody> </table> </div> <div class="alert alert-purple mt10"> <i class="fa-solid fa-lightbulb"></i> <span>La <strong>desventaja</strong> de la double taxation del corporate income es <strong>menor</strong> para los inversores en compañías que pagan una <strong>fracción menor</strong> de sus profits en dividendos y reinvierten el resto — como muestra este ejemplo, el effective tax rate baja de 40% a 31% cuando el payout ratio baja de 100% a 40%.</span> </div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-scale-balanced" style="margin-right:6px;color:var(--accent)"></i>LOS 20.c — Public vs. Private Corporations</div>

<div class="card bt-accent" id="c1-c0"> <div class="card-title"><i class="fa-solid fa-circle-info c-accent"></i> "Company" (limited company): ya separada del dueño desde el arranque</div> <div class="card-body">A diferencia de una sole proprietorship o una partnership — donde el negocio es una <strong>extensión</strong> legal del dueño/partners —, cualquier <strong>limited company</strong> (sea privada o pública) ya nace como una <strong>entidad legal completamente separada</strong> de la persona que la posee. Esa separación no es exclusiva de la versión "pública": está presente desde el momento en que la estructura elegida es una company, privada o pública.</div> <div class="alert alert-blue mt10"> <i class="fa-solid fa-language"></i> <span><strong>Equivalencia de terminología:</strong> lo que el curriculum llama <strong>private limited company</strong> es lo que en Estados Unidos se conoce como <strong>LLC (limited liability company)</strong> — todos sus dueños tienen limited liability, con la misma separación entre owners y managers que en cualquier corporation.</span> </div> </div>

<div class="card" style="border-top:3px solid var(--teal)" id="c1-c1"> <div class="card-title"><i class="fa-solid fa-chart-line c-teal"></i> Public limited companies y free float</div> <div class="card-body">La mayoría de las public limited companies son <strong>listed companies</strong> — sus shares están listadas en un exchange, permitiendo a los inversores transarlas. Un <strong>stock exchange</strong> es un mercado abierto y basado en reglas, que provee transparencia de precio y volumen. Los shareholders de una compañía pueden ser individuos, otras corporaciones, entidades sin fines de lucro, o el gobierno.</div> <div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span>Las shares que se transan activamente (es decir, <strong>no</strong> en manos de insiders, strategic investors, o sponsors) se llaman el <strong>free float</strong> de la compañía — típicamente expresado como % del total de shares outstanding.</span> </div> <div class="card-body mt8">Las public companies están sujetas a <strong>compliance y reporting requirements</strong>: por ejemplo, deben presentar reportes financieros trimestrales o anuales ante un regulatory body, y divulgar cualquier <strong>cambio material</strong> en el negocio o la propiedad de la compañía.</div> <div class="alert" style="background:var(--teal-light);color:#57554F;margin-top:10px;"> <i class="fa-solid fa-users"></i> <span><strong>Sin restricción sobre los shareholders:</strong> en una public limited company <strong>no</strong> hay límite sobre <strong>quién</strong> puede ser shareholder, ni sobre <strong>cuántos</strong> shareholders puede tener la compañía. Esa apertura es justamente lo que hace posible venderle shares al público en general.</span> </div> </div>

<div class="card" style="border-top:3px solid var(--amber)" id="c1-c2"> <div class="card-title"><i class="fa-solid fa-lock" style="color:var(--amber)"></i> Private limited companies</div> <div class="card-body">Las shares de las private limited companies <strong>no</strong> se transan en un exchange. Como resultado, su valor <strong>no es fácilmente observable</strong>, y la transferencia entre inversores es difícil. Típicamente, los inversores en una private limited company tienen que esperar a que la compañía <strong>salga a la bolsa</strong> o sea <strong>vendida</strong> para salir de su inversión.</div> <div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Las private companies tienen <strong>menos requisitos regulatorios</strong> y típicamente divulgan <strong>menos información</strong> que las públicas. También, al tener menos inversores, pueden adoptar una visión de <strong>más largo plazo</strong> del negocio.</span> </div> <div class="card-body mt8">Las private companies pueden recaudar equity capital a través de <strong>private placements</strong> de securities — típicamente restringidos a <strong>accredited investors</strong>, como corporaciones e institutional investors, o individuos de alto patrimonio neto.</div> <div class="alert alert-red mt10"> <i class="fa-solid fa-user-lock"></i> <span><strong>Restricción sobre quién puede ser shareholder:</strong> a diferencia de la public limited company, en una private limited company <strong>sí</strong> existe una restricción sobre <strong>quién</strong> puede convertirse en shareholder (típicamente, solo accredited investors) — y, en consecuencia, también una restricción práctica sobre <strong>cuántos</strong> shareholders puede tener.</span> </div> </div>

<div class="card bt-purple" id="c1-c1b"> <div class="card-title"><i class="fa-solid fa-list-check c-purple"></i> Trampa de examen: "public" no es lo mismo que "listed"</div> <div class="card-body">Una public limited company <strong>no necesariamente</strong> está listada en un exchange — puede optar por no listarse. Pero es la <strong>única</strong> de las dos estructuras que <strong>podría</strong> estar listada: una private limited company nunca puede estarlo, mientras exista como tal.</div> <div class="ex-table mt8"> <div class="ex-row"><span class="ex-label">Public limited company</span><span class="ex-val">Puede estar listada o no — pero es la <strong>única</strong> que tiene esa opción disponible</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Private limited company</span><span class="ex-val fw400">Nunca está listada — no es una opción disponible para esta estructura</span></div> </div> </div>

<div class="card bt-purple" id="c1-c3"> <div class="card-title"><i class="fa-solid fa-arrow-up-right-from-square c-purple"></i> Ir a la bolsa: 4 caminos para volverse pública</div> <div class="card-body mb6">Las private companies pueden volverse públicas ("go public") de <strong>4 formas</strong>:</div> <div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Initial Public Offering (IPO)</div> Una compañía se vuelve pública emitiendo shares en una IPO. Para hacer una IPO, la compañía debe cumplir requisitos específicos del exchange, y típicamente contrata a un <strong>investment bank</strong> para <strong>underwrite</strong> la emisión. Una vez listadas las shares, los dueños pueden vender y los nuevos dueños comprar, sin negociar directamente con la compañía. </div> </div> <div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Direct listing</div> Un stock exchange acuerda listar las shares <strong>existentes</strong> de una private company. A diferencia de una IPO, un direct listing <strong>no recauda capital nuevo</strong> para la compañía — pero tiene la ventaja de poder hacerse <strong>más rápido</strong> y sin involucrar a un underwriter. </div> </div> <div class="reason-box" style="background:var(--amber-light);"> <span class="reason-num" style="color:var(--amber);">3</span> <div class="reason-body" style="color:#8A5A12;"> <div class="reason-title">Acquisition by a public corporation</div> Una public corporation adquiere a la private company (por ejemplo, comprando todas sus shares outstanding). Como la compañía adquirida pasa a formar parte de una entidad que ya cotiza en bolsa, ese negocio termina siendo, en los hechos, público — sin haber pasado por una IPO ni un direct listing propios. </div> </div> <div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">4</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Special Purpose Acquisition Company (SPAC)</div> Un SPAC es una compañía que se crea con el <strong>único propósito de recaudar capital</strong> — al momento de su propia IPO <strong>todavía no tiene ningún negocio operativo</strong>. Junta fondos de inversores y los deposita en un <strong>trust</strong>, con el mandato de usarlos para adquirir una private company (el <strong>target</strong>) dentro de un plazo específico. Una vez identificado y comprado el target, esa compañía pasa a estar controlada por el SPAC — y como el SPAC ya cotiza en bolsa, el negocio adquirido queda, en los hechos, <strong>listed</strong> sin haber hecho su propia IPO. </div> </div> </div> <div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>El riesgo particular de invertir en un SPAC:</strong> al momento de poner la plata, el inversor <strong>no sabe todavía</strong> ni cuándo se va a usar ese capital ni en qué compañía específica — el target puede no estar identificado. La decisión de invertir se basa enteramente en la <strong>confianza</strong> en que el equipo que arma y gestiona el SPAC (los sponsors) va a encontrar y negociar una buena adquisición dentro del plazo pactado. Por eso a los SPAC también se los conoce como <strong>"blank check" companies</strong>.</span> </div>

<div class="card" style="border-top:3px solid var(--red)" id="c1-c4"> <div class="card-title"><i class="fa-solid fa-arrow-turn-down c-red"></i> Going private</div> <div class="card-body">A veces puede convenir volver <strong>privada</strong> una public company con bajo desempeño, para reestructurarla y liberar su valor potencial. En ese caso, un acquirer compra <strong>todas</strong> las shares outstanding de una public company, y la compañía es <strong>delisted</strong> del exchange.</div> <div class="alert alert-red mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Los beneficios de going private incluyen una <strong>menor carga regulatoria</strong> y los ahorros de costos asociados a ella.</span> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 20.1</div> <div class="card bt-accent" id="c1-formulas"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Sole proprietorship</span><span class="ex-val">1 dueño; unlimited liability; ingreso personal; escala limitada</span></div> <div class="ex-row"><span class="ex-label">General partnership</span><span class="ex-val">2+ partners; todos unlimited liability; ingreso personal</span></div> <div class="ex-row"><span class="ex-label">Limited partnership</span><span class="ex-val">General partners (unlimited liability, operan) + limited partners (limited liability, claims proporcionales)</span></div> <div class="ex-row"><span class="ex-label">LLP</span><span class="ex-val">Todos los partners son limited; en EE.UU. solo para servicios profesionales</span></div> <div class="ex-row"><span class="ex-label">Corporation</span><span class="ex-val">Entidad legal separada; limited liability para todos los shareholders; mayor acceso a capital</span></div> <div class="ex-row"><span class="ex-label">Double taxation</span><span class="ex-val">Corporate tax + tax sobre dividendos personales; menor con menor payout ratio</span></div> <div class="ex-row"><span class="ex-label">Free float</span><span class="ex-val">% de shares que se transan activamente (excluye insiders/strategic investors/sponsors)</span></div> <div class="ex-row"><span class="ex-label">Accredited investors</span><span class="ex-val">Compradores permitidos en private placements (institucionales, alto patrimonio)</span></div> <div class="ex-row"><span class="ex-label">IPO / Direct listing / Acquisition / SPAC</span><span class="ex-val">4 caminos para ir a la bolsa — solo la IPO recauda capital nuevo directamente al listar</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Going private</span><span class="ex-val fw400">Acquirer compra todas las shares; delisting; menor carga regulatoria</span></div> </div> </div></div>`;}


function pageC2() { return `<div class="module-theme module-c2"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 21.a, 21.b, 21.c</div> <div class="page-title">Module 21.1: Stakeholders and ESG Factors</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 21: Stakeholders and ESG Factors</div>

<div class="card bt-accent" id="c2-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">Este módulo arranca comparando los <strong>claims financieros</strong> de lenders vs. shareholders — quién tiene prioridad, quién tiene upside ilimitado, y cómo el <strong>leverage</strong> amplifica el ROE (para bien y para mal). Después mapea el universo completo de <strong>stakeholders</strong> de una corporation (shareholders, lenders, board, managers, empleados, suppliers, customers, gobierno) y sus intereses particulares. Cierra con los <strong>factores ESG</strong> (environmental, social, governance) que los inversores evalúan, y por qué el <strong>riesgo ESG</strong> no impacta igual a equity holders que a debt holders.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-scale-unbalanced" style="margin-right:6px;color:var(--accent)"></i>LOS 21.a — Claims financieros: lenders vs. shareholders</div>

<div class="card" id="c2-a1"> <div class="card-title"><i class="fa-solid fa-gavel c-accent"></i> Claims de lenders y equity holders — y cómo cambia el riesgo según la perspectiva</div> <div class="card-body mb6">Los <strong>lenders</strong> (debtholders) tienen un claim <strong>legal y contractual</strong> sobre los pagos de interés y principal. Los <strong>equity holders</strong> tienen un claim <strong>residual</strong> sobre los net assets — lo que queda después de pagar todos los demás claims. Por eso los lenders tienen <strong>mayor prioridad</strong>, y la deuda es una forma <strong>más barata</strong> de capital. Pero un mismo instrumento no es igual de riesgoso para todos: hay que distinguir el riesgo para la <strong>empresa que emite</strong> (issuer/borrower) del riesgo para el <strong>inversor que compra</strong> (investor).</div>
<div id="c2-a1b" style="overflow-x:auto;margin-top:8px;"> <table class="tbl-std"> <thead> <tr style="background:var(--bg);"> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);"></th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Debt</th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Equity</th> </tr> </thead> <tbody>
<tr><td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);">Riesgo para el <strong>issuer</strong></td><td style="padding:7px 8px;color:var(--red);font-weight:700;border-bottom:1px solid var(--border-light);">Mayor — menor costo, pero obligación contractual de pagar principal e interés; sujeta a restricciones del lender (covenants)</td><td style="padding:7px 8px;color:var(--green);font-weight:700;border-bottom:1px solid var(--border-light);">Menor — sin obligación contractual de repagar ni de pagar dividendos</td></tr>
<tr><td style="padding:7px 8px;font-weight:600;">Riesgo para el <strong>investor</strong></td><td style="padding:7px 8px;color:var(--green);font-weight:700;">Menor — mayor prioridad de cobro (claim contractual)</td><td style="padding:7px 8px;color:var(--red);font-weight:700;">Mayor — menor prioridad de cobro y riesgo de dilution, a pesar del upside teóricamente ilimitado</td></tr>
</tbody> </table> </div>
<div class="alert alert-red mt10"> <i class="fa-solid fa-users-slash"></i> <span><strong>Dilution:</strong> la reducción de la participación fraccional (% de ownership) de un shareholder existente cuando la compañía emite <strong>nuevas shares</strong> de equity. Es un riesgo propio de los equity investors — no existe un equivalente para los debtholders.</span> </div> </div>

<div class="card bt-purple" id="c2-a2"> <div class="card-title"><i class="fa-solid fa-arrow-trend-up c-purple"></i> Upside y downside: la asimetría clave</div> <div class="card-body mb6">Tanto debtholders como equity holders pueden perder <strong>toda</strong> su inversión si la compañía falla, pero sus pérdidas nunca superan el monto invertido. La diferencia clave está en el <strong>upside</strong>:</div> <div class="contrast-row"> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-hand-holding-dollar"></i> Debtholders</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">El mejor resultado posible es recibir los pagos de <strong>interés y principal prometidos</strong> — no más, sin importar cuánto crezca la compañía. Solo tienen <strong>downside</strong> exposure.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-chart-line"></i> Equity holders</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;">Upside <strong>teóricamente ilimitado</strong> si la compañía crece y tiene éxito a lo largo del tiempo.</div> </div> </div> </div>

<div class="card" id="c2-a3"> <div class="card-title"><i class="fa-solid fa-chart-simple c-accent"></i> Valor de la firma = valor de deuda + valor de equity</div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label">Assets</span><span class="ex-val">Todo lo que la empresa posee o controla y que tiene valor.</span></div> <div class="ex-row bd-none"><span class="ex-label">Equity</span><span class="ex-val">La parte de esos assets que realmente pertenece a los accionistas, <strong>después de restar</strong> las deudas/pasivos (Equity = Assets − Debt).</span></div> </div> <div class="card-body mb10">El valor de una compañía es la suma del valor de su deuda y el valor de su equity. Cómo se reparte ese valor entre ambos depende de si el valor total de la firma (sus <strong>assets</strong>) supera o no el valor de la deuda:</div>
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:640px;display:block;margin:0 auto;">
  <text x="340" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">Valor de equity y deuda según el valor de la firma</text>
  <!-- axes -->
  <line x1="80" y1="240" x2="600" y2="240" stroke="var(--text-sec)" stroke-width="1.5"/>
  <line x1="80" y1="240" x2="80" y2="60" stroke="var(--text-sec)" stroke-width="1.5"/>
  <text x="65" y="244" text-anchor="end" font-size="10" fill="var(--text-sec)">0</text>
  <text x="340" y="278" text-anchor="middle" font-size="11" fill="var(--text-sec)">Valor de la firma (assets) →</text>
  <text x="35" y="150" text-anchor="middle" font-size="11" fill="var(--text-sec)" transform="rotate(-90 35 150)">Valor del claim →</text>
  <!-- D marker -->
  <line x1="340" y1="240" x2="340" y2="65" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="340" y="255" text-anchor="middle" font-size="10.5" fill="var(--text-sec)">D</text>
  <!-- debt value: rises 0→D then flat -->
  <path d="M 80 240 L 340 140 L 600 140" fill="none" stroke="var(--red)" stroke-width="2.5"/>
  <!-- equity value: 0 until D then rises -->
  <path d="M 80 240 L 340 240 L 600 60" fill="none" stroke="var(--green)" stroke-width="2.5"/>
  <!-- line labels, well separated -->
  <text x="415" y="122" text-anchor="middle" font-size="10.5" fill="var(--red)" font-weight="600">Deuda (constante en D)</text>
  <text x="600" y="75" text-anchor="end" font-size="10.5" fill="var(--green)" font-weight="600">Equity (crece con la firma)</text>
</svg>
<div class="card-body mt10">Si el valor de la firma es <strong>menor</strong> al valor de la deuda (D), el valor de la equity es <strong>cero</strong>, y el valor de la deuda cae por debajo del monto prometido (la deuda tiene <strong>downside exposure</strong>). Si el valor de la firma <strong>supera</strong> D, el valor de la deuda se mantiene constante (en el monto prometido) y todo el crecimiento adicional va al valor de la equity. Es decir: <strong>Equity = Assets − Debt</strong>, y como la deuda es fija, cualquier variación en los assets pasa <strong>entera</strong> al equity — el ejemplo numérico de la próxima card muestra cuánto se amplifica esa variación.</div> </div>

<div class="card bt-purple" id="c2-a3b"> <div class="card-title"><i class="fa-solid fa-calculator c-purple"></i> Ejemplo numérico: el leverage amplifica las variaciones del equity</div> <div class="card-body mb6">Una firma tiene $100 en assets, financiados con $50 de deuda (fija) y $50 de equity (= net assets). Si los assets suben o bajan 20%, ¿qué pasa con el valor del equity?</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver desarrollo y respuesta</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body">
<div style="overflow-x:auto;margin-top:8px;"> <table class="tbl-std"> <thead> <tr style="background:var(--purple-light);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:#4F46E5;"></th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#4F46E5;">Assets −20%</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#4F46E5;">Caso base</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#4F46E5;">Assets +20%</th> </tr> </thead> <tbody>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Assets</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">80</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">100</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">120</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">(−) Debt (fija)</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">50</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">50</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">50</td></tr>
<tr><td style="padding:6px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">(=) Equity (net assets)</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">30</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">50</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">70</td></tr>
<tr><td style="padding:6px 8px;font-weight:700;color:var(--purple);">Variación del equity</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--red);">−40%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);color:var(--text-sec);">—</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--green);">+40%</td></tr>
</tbody> </table> </div>
<div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Cómo sale el −40%</span><span class="ex-val">Equity pasa de $50 a $30 → cambio de −$20 → −$20 / $50 (equity original) = <strong>−40%</strong></span></div> <div class="ex-row bd-none"><span class="ex-label">Cómo sale el +40%</span><span class="ex-val">Equity pasa de $50 a $70 → cambio de +$20 → +$20 / $50 (equity original) = <strong>+40%</strong></span></div> </div>
<div class="alert alert-purple mt10"> <i class="fa-solid fa-bolt"></i> <span><strong>Atajo (opcional):</strong> como la deuda es <strong>fija</strong>, toda variación en $ de los assets pasa entera al equity. Por eso también se puede llegar al mismo −40%/+40% multiplicando directamente <strong>%ΔAssets × (Assets₀/Equity₀)</strong> = ±20% × (100/50) = ±20% × 2 = ±40%, sin tener que recalcular el equity entero — pero el resultado es idéntico al de la resta simple de arriba.</span> </div>
<div class="alert alert-red mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Este es exactamente el punto de <strong>quiebre</strong> del gráfico anterior: si los assets cayeran a <strong>$50</strong> (una baja del 50%), el equity valdría <strong>$0</strong> — todo el valor de la firma coincidiría con el valor de la deuda, y los equity holders perderían toda su inversión. Por debajo de ese nivel, la deuda empieza a valer menos de lo prometido.</span> </div>
</div> </div>

<div class="card" id="c2-a3c"> <div class="card-title"><i class="fa-solid fa-percent c-accent"></i> ROE y ROA: definiciones y fórmulas</div> <div class="card-body mb10">Antes de ver el ejemplo, conviene tener clara la diferencia entre estas dos métricas de rentabilidad — miden lo mismo (retorno sobre una base), pero cambia <strong>qué base</strong> se usa en el denominador.</div>
<div class="ex-table"> <div class="ex-row"><span class="ex-label">ROE<br><span style="font-weight:400;color:var(--text-sec);font-size:11px;">Return on Equity</span></span><span class="ex-val"><strong>Net income / Equity</strong> — el retorno que le queda a los <strong>accionistas</strong> sobre el capital que ellos pusieron. Sí depende de cómo se financia la firma (a mayor deuda, menor equity, y el interest expense ya está restado del net income).</span></div> <div class="ex-row bd-none"><span class="ex-label">ROA (operativo)<br><span style="font-weight:400;color:var(--text-sec);font-size:11px;">Return on Assets, pre-interés</span></span><span class="ex-val"><strong>(Revenues − Operating expenses) / Assets</strong> — el retorno que generan los <strong>activos</strong> por sí solos, <em>antes</em> de pagar intereses. No depende de cómo se financia la firma: es el mismo con 100% equity o con 50/50 deuda-equity, porque mide la performance operativa, no la estructura de capital.</span></div> </div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span><strong>Por qué usamos el ROA pre-interés (y no Net income/Assets) para comparar contra el costo de la deuda:</strong> si calcularas ROA con el net income (ya neto de intereses), el resultado te cambiaría según el financiamiento —y ya no serviría para decidir si conviene apalancarse, porque estarías mezclando el efecto que querés medir con el resultado. Por eso, para esta comparación, se usa el retorno <strong>operativo</strong> (antes de intereses) de los activos.</span> </div> </div>

<div class="card bt-purple" id="c2-a4"> <div class="card-title"><i class="fa-solid fa-calculator c-purple"></i> Ejemplo: impacto del leverage en el ROE</div> <div class="card-body mb6">Una compañía con revenues de $1,000 y operating expenses de $800 necesita invertir $1,000 en activos, financiados 100% con equity o 50/50 deuda-equity. La tasa de interés sobre la deuda es 10% (sin impuestos). Calculá el ROE en ambos escenarios.</div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span><strong>De dónde sale el Equity de la tabla:</strong> no se calcula a partir del net income — es un <strong>dato del planteo</strong>, la forma en que se financian los $1,000 de activos. En "100% Equity", los accionistas ponen los $1,000 completos. En "50% Deuda / 50% Equity", $500 vienen de deuda y $500 de equity. El net income es un número aparte que después se <strong>divide</strong> por ese Equity para obtener el ROE.</span> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver desarrollo y respuesta</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body">
<div style="overflow-x:auto;margin-top:8px;"> <table class="tbl-std"> <thead> <tr style="background:var(--purple-light);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:#4F46E5;"></th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#4F46E5;">100% Equity</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#4F46E5;">50% Deuda / 50% Equity</th> </tr> </thead> <tbody>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Revenues</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$1,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$1,000</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Cash operating expense</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$800</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$800</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Interest expense</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$0</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$50</td></tr>
<tr><td style="padding:6px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Net income</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">$200</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">$150</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Equity</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$1,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$500</td></tr>
<tr><td style="padding:6px 8px;font-weight:700;color:var(--purple);">ROE</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--purple);">20%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--purple);">30%</td></tr>
</tbody> </table> </div>
<div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Fórmula</span><span class="ex-val"><strong>ROE = Net income / Equity</strong></span></div> <div class="ex-row"><span class="ex-label">100% Equity</span><span class="ex-val">$200 / $1,000 = <strong>20%</strong></span></div> <div class="ex-row bd-none"><span class="ex-label">50% Deuda / 50% Equity</span><span class="ex-val">$150 / $500 = <strong>30%</strong></span></div> </div>
<div class="alert alert-purple mt10"> <i class="fa-solid fa-lightbulb"></i> <span>Aumentar el leverage (y por lo tanto el riesgo) puede <strong>aumentar el ROE</strong>, siempre que el <strong>return on assets</strong> (rendimiento operativo de los activos, <em>no</em> el ROE) supere el costo de la deuda. Acá: Return on assets = (Revenues − Operating expenses) / Assets = $200 / $1,000 = <strong>20%</strong>, que supera el <strong>10%</strong> de costo de la deuda — por eso el leverage sube el ROE de 20% a 30%. Los debt investors, en cambio, reciben solo su <strong>10% prometido</strong>, sin importar qué tan bien le vaya a la compañía.</span> </div>
</div> </div>

<div class="card" style="border-top:3px solid var(--red)" id="c2-a5"> <div class="card-title"><i class="fa-solid fa-arrow-trend-down c-red"></i> Ejemplo: impacto de una caída en revenues</div> <div class="card-body mb6">Continuando el ejemplo anterior: si los revenues caen 15% (sin cambios en cash operating expenses), el ROE cae a <strong>5%</strong> (100% equity) o a <strong>0%</strong> (50/50 deuda-equity).</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver desarrollo y respuesta</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body">
<div style="overflow-x:auto;margin-top:8px;"> <table class="tbl-std"> <thead> <tr style="background:var(--red-light);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:#AE5038;"></th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#AE5038;">100% Equity</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:#AE5038;">50% Deuda / 50% Equity</th> </tr> </thead> <tbody>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Revenues</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$850</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$850</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Cash operating expense</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$800</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$800</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Interest expense</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$0</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$50</td></tr>
<tr><td style="padding:6px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Net income</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">$50</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">$0</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Equity</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$1,000</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$500</td></tr>
<tr><td style="padding:6px 8px;font-weight:700;color:var(--red);">ROE</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--red);">5%</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--red);">0%</td></tr>
</tbody> </table> </div>
<div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Fórmula</span><span class="ex-val"><strong>ROE = Net income / Equity</strong></span></div> <div class="ex-row"><span class="ex-label">100% Equity</span><span class="ex-val">$50 / $1,000 = <strong>5%</strong></span></div> <div class="ex-row bd-none"><span class="ex-label">50% Deuda / 50% Equity</span><span class="ex-val">$0 / $500 = <strong>0%</strong></span></div> </div>
<div class="alert alert-amber mt10"> <i class="fa-solid fa-arrow-trend-down"></i> <span>Acá pasa lo <strong>opuesto</strong> al ejemplo anterior: Return on assets = $50 / $1,000 = <strong>5%</strong>, que es <strong>menor</strong> al 10% de costo de la deuda. Por eso el leverage esta vez <strong>perjudica</strong> el ROE en vez de ayudarlo (cae de 5% a 0%, en lugar de subir). Regla general: leverage sube el ROE solo cuando Return on assets > costo de la deuda; si es menor, el leverage lo empeora.</span> </div>
<div class="alert alert-red mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Si la caída en revenues hubiera sido <strong>mayor a 15%</strong>, los revenues no habrían alcanzado a cubrir los operating expenses, y los debt investors habrían recibido <strong>menos</strong> del 10% de interés prometido. La deuda solo tiene <strong>downside</strong> — nunca upside.</span> </div>
</div> </div>

<div class="card bt-blue" id="c2-a6"> <div class="card-title"><i class="fa-solid fa-people-arrows c-blue"></i> Conflicto de intereses entre debtholders y equity holders</div> <div class="card-body">Por la diferencia en sus perfiles de riesgo, los intereses de debtholders y equity holders pueden <strong>entrar en conflicto</strong>. Los debtholders priorizan la <strong>capacidad de repago</strong> de la compañía y les preocupa menos el crecimiento. Los equity holders pueden favorecer acciones que aumenten el potencial de crecimiento pero también el riesgo — como emitir <strong>nueva deuda</strong> (en vez de equity, lo cual evita diluir su ownership proporcional).</div> <div class="alert alert-blue mt10"> <i class="fa-solid fa-file-shield"></i> <span>Los debtholders existentes suelen limitar estas acciones mediante <strong>covenants</strong> contractuales — por ejemplo, un <strong>leverage máximo</strong> o un <strong>interest coverage ratio mínimo</strong> — ya que un mayor riesgo de default no aumenta su expected return (tema que se profundiza en Fixed Income).</span> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-users" style="margin-right:6px;color:var(--accent)"></i>LOS 21.b — Grupos de stakeholders y sus intereses</div>

<div class="card" id="c2-b1"> <div class="card-title"><i class="fa-solid fa-scale-balanced c-accent"></i> Shareholder theory vs. stakeholder theory</div> <div class="contrast-row"> <div class="contrast-box" style="background:var(--blue-light);"> <div class="contrast-label" style="color:var(--blue);"><i class="fa-solid fa-crosshairs"></i> Shareholder theory</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;">El foco de la corporate governance es <strong>maximizar el market value</strong> de la common equity. Se concentra en el conflicto entre <strong>managers y owners</strong>.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-diagram-project"></i> Stakeholder theory</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;">Foco <strong>más amplio</strong>: considera los conflictos entre <strong>varios grupos</strong> con interés en la actividad y el desempeño de la firma.</div> </div> </div> </div>

<div class="card bt-purple" id="c2-b2"> <div class="card-title"><i class="fa-solid fa-list-check c-purple"></i> Mapa de stakeholders de una corporation</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Shareholders</span><span class="ex-val">Claim residual sobre net assets; voting rights (eligen al board); interés en profitability y growth</span></div> <div class="ex-row"><span class="ex-label">Lenders (públicos)</span><span class="ex-val">Bondholders — capital de deuda pública; solo información pública; poca influencia sobre operaciones</span></div> <div class="ex-row"><span class="ex-label">Lenders (privados)</span><span class="ex-val">Bancos — loans, credit facilities, leases; acceso a info no pública; más amenables a cambios de covenants</span></div> <div class="ex-row"><span class="ex-label">Board of directors</span><span class="ex-val">Protege a shareholders; contrata/despide/compensa a senior managers; dirección estratégica; monitoreo</span></div> <div class="ex-row"><span class="ex-label">Senior managers</span><span class="ex-val">Compensación (salario + bonus + perks); interés en continued employment y maximizar su compensación</span></div> <div class="ex-row"><span class="ex-label">Otros empleados</span><span class="ex-val">Human capital; interés en pay, carrera, training, condiciones laborales; ESPP alinea intereses</span></div> <div class="ex-row"><span class="ex-label">Suppliers</span><span class="ex-val">Interés en relación continua, profitability del trade, y solvencia de la firma (son short-term creditors)</span></div> <div class="ex-row"><span class="ex-label">Customers</span><span class="ex-val">Buscan calidad a precio razonable y servicio post-venta; cada vez más atentos a ESG</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Gobierno / reguladores</span><span class="ex-val fw400">Tax revenue, crecimiento económico, empleo; interés en compliance regulatorio</span></div> </div> </div>

<div class="card" style="border-top:3px solid var(--teal)" id="c2-b3"> <div class="card-title"><i class="fa-solid fa-building-columns c-teal"></i> Board of directors: composición y estructura</div> <div class="card-body">Los board members incluyen <strong>inside directors</strong> (senior executives, founders) e <strong>independent directors</strong> (sin relación material con la compañía). Los inside directors pueden tener conflictos de interés con shareholders, mientras que los independent directors suelen proteger mejor sus intereses.</div> <div class="contrast-row mt8"> <div class="contrast-box" style="background:var(--teal-light);"> <div class="contrast-label" style="color:#57554F;"><i class="fa-solid fa-layer-group"></i> One-tier board</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;">Inside e independent directors sirven en <strong>un solo board</strong>. Los exchanges exigen que la mayoría sean independientes.</div> </div> <div class="contrast-box" style="background:var(--amber-light);"> <div class="contrast-label" style="color:var(--amber);"><i class="fa-solid fa-layer-group"></i> Two-tier board</div> <div style="font-size:12.5px;color:#8A5A12;line-height:1.6;">Común en Europa continental: un <strong>supervisory board</strong> supervisa a un <strong>management board</strong> compuesto por inside directors.</div> </div> </div> <div class="alert alert-amber mt10"> <i class="fa-solid fa-clock-rotate-left"></i> <span><strong>Staggered board:</strong> solo una fracción del board se elige cada año, lo que <strong>reduce el poder</strong> de los shareholders para reestructurar el board de golpe. Se justifica como forma de dar continuidad y una visión de más largo plazo.</span> </div> </div>

<div class="card bt-purple" id="c2-b3b"> <div class="card-title"><i class="fa-solid fa-triangle-exclamation c-purple"></i> Illustration: cuándo es más difícil para shareholders efectuar cambios</div> <div class="card-body mb6">Combinando los dos ejes anteriores (inside vs. independent directors, y staggered vs. non-staggered boards), a los shareholders les resulta <strong>más difícil</strong> efectuar cambios en el management de una compañía cuando se dan <strong>ambas</strong> condiciones a la vez:</div>
<div class="contrast-row"> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-user-tie"></i> Mayoría de inside directors</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">Senior executives y founders que <strong>trabajan en la empresa</strong>. Al tener intereses creados en el status quo (su propio cargo, su gestión), suelen ser <strong>más resistentes al cambio</strong>.</div> </div> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-hourglass-half"></i> Board staggered</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">Solo se puede votar out a <strong>una porción</strong> del board cada año, así que se necesitan <strong>varios años</strong> para efectuar un cambio significativo.</div> </div> </div>
<div class="alert alert-purple mt10"> <i class="fa-solid fa-user-check"></i> <span><strong>Independent directors, en cambio, no trabajan en la empresa</strong> — no son empleados actuales ni ex-empleados, y tampoco founders. Justamente por esa distancia, suelen mirar la gestión de la compañía con <strong>mayor escrutinio</strong> y tienden a estar más alineados con los intereses de los shareholders (a diferencia de los inside directors).</span> </div>
<div class="alert alert-red mt10"> <i class="fa-solid fa-circle-exclamation"></i> <span><strong>Trampa de examen:</strong> lo que dificulta el cambio es la <strong>mayoría de inside directors</strong> — no de independent directors. Los independent directors son, si acaso, un aliado de los shareholders para lograr cambios, no un obstáculo.</span> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-leaf" style="margin-right:6px;color:var(--accent)"></i>LOS 21.c — Factores ESG considerados por los inversores</div>

<div class="card bt-accent" id="c2-c1"> <div class="card-title"><i class="fa-solid fa-circle-question c-accent"></i> Por qué los inversores miran ESG</div> <div class="card-body mb6">Algunos inversores de deuda y equity que adoptan una perspectiva de stakeholder evalúan los factores <strong>ESG (environmental, social, governance)</strong> de las compañías, por tres razones principales:</div> <div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Presión regulatoria</div> Los gobiernos priorizan cada vez más el cambio climático y las políticas sociales a través de cambios regulatorios. </div> </div> <div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Impacto material en resultados</div> Pérdida de goodwill de clientes, multas, judgments, y mala corporate governance que permite a managers explotar a los shareholders para intereses personales. </div> </div> <div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">3</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Demanda de inversores jóvenes</div> Cada vez más inversores jóvenes gestionan su patrimonio considerando factores ESG. </div> </div> </div>

<div class="card" id="c2-c2"> <div class="card-title"><i class="fa-solid fa-cloud c-teal"></i> Negative externalities</div> <div class="card-body">Ocurren cuando una compañía (o sus inversores) <strong>no asume el costo total</strong> de sus acciones — por ejemplo, daño ambiental. La creciente regulación y conciencia de los stakeholders obliga a las compañías a reconocer estos costos, ya sea <strong>explícitamente</strong> en sus estados financieros o <strong>implícitamente</strong>.</div> </div>

<div class="card" id="c2-c3"> <div class="card-title"><i class="fa-solid fa-table-list c-accent"></i> Los tres pilares ESG</div>
<svg viewBox="0 0 600 170" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:600px;display:block;margin:0 auto;">
  <rect x="10" y="20" width="180" height="130" rx="8" fill="#EEF5F0"/>
  <text x="100" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#3F7A5C">Environmental</text>
  <text x="100" y="65" text-anchor="middle" font-size="10" fill="#3F7A5C">Cambio climático</text>
  <text x="100" y="82" text-anchor="middle" font-size="10" fill="#3F7A5C">Polución aire/agua</text>
  <text x="100" y="99" text-anchor="middle" font-size="10" fill="#3F7A5C">Deforestación</text>
  <text x="100" y="116" text-anchor="middle" font-size="10" fill="#3F7A5C">Eficiencia energética</text>
  <text x="100" y="133" text-anchor="middle" font-size="10" fill="#3F7A5C">Escasez de agua</text>
  <rect x="210" y="20" width="180" height="130" rx="8" fill="#F6F1E9"/>
  <text x="300" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#8A6D3F">Social</text>
  <text x="300" y="65" text-anchor="middle" font-size="10" fill="#8A6D3F">Privacidad del cliente</text>
  <text x="300" y="82" text-anchor="middle" font-size="10" fill="#8A6D3F">Satisfacción del cliente</text>
  <text x="300" y="99" text-anchor="middle" font-size="10" fill="#8A6D3F">Employee engagement</text>
  <text x="300" y="116" text-anchor="middle" font-size="10" fill="#8A6D3F">Diversidad e inclusión</text>
  <text x="300" y="133" text-anchor="middle" font-size="10" fill="#8A6D3F">Relaciones laborales</text>
  <rect x="410" y="20" width="180" height="130" rx="8" fill="#EFEEFC"/>

  <text x="500" y="116" text-anchor="middle" font-size="10" fill="#4F46E5">Soborno y corrupción</text>
  <text x="500" y="133" text-anchor="middle" font-size="10" fill="#4F46E5">Contribuciones políticas</text>
