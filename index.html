<div class="card bt-accent" id="c4-b5"> <div class="card-title"><i class="fa-solid fa-percent c-accent"></i> Ratios de liquidez</div> <div class="card-body mb6">El <strong>current ratio</strong> es la razón entre current assets y current liabilities. El objetivo general es un current ratio <strong>mayor a 1</strong>, de forma que todos los pasivos de corto plazo queden cubiertos.</div> <div class="fbox">Current&nbsp;ratio&nbsp;=&nbsp;Current&nbsp;assets&nbsp;/&nbsp;Current&nbsp;liabilities</div> <div class="card-body mt10 mb6">No todos los current assets son igual de líquidos. Como el <strong>inventario</strong> es el activo corriente menos líquido, el <strong>quick ratio</strong> (o <strong>"acid test"</strong>) lo excluye — es una métrica más estricta.</div> <div class="fbox">Quick&nbsp;ratio&nbsp;=&nbsp;(Cash&nbsp;and&nbsp;marketable&nbsp;securities&nbsp;+&nbsp;Accounts&nbsp;receivable)&nbsp;/&nbsp;Current&nbsp;liabilities</div> <div class="card-body mt10 mb6">Por último, el <strong>cash ratio</strong> excluye también accounts receivable — es la medida <strong>más estricta y conservadora</strong> de las tres. Un cash ratio mayor a 1 sugiere que la compañía podría cubrir todas sus obligaciones de corto plazo <strong>sin necesitar</strong> vender inventario ni cobrar receivables.</div> <div class="fbox">Cash&nbsp;ratio&nbsp;=&nbsp;Cash&nbsp;and&nbsp;marketable&nbsp;securities&nbsp;/&nbsp;Current&nbsp;liabilities</div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>Tiene más sentido mirar la liquidez con el ratio <strong>más conservador</strong> disponible (idealmente el quick ratio): mide la capacidad de cubrir obligaciones de corto plazo usando solo los activos <strong>más líquidos</strong> (cash, marketable securities, receivables), <strong>omitiendo</strong> el inventario — el activo corriente menos confiable para convertirse rápido en cash.</span> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: Drake Corporation, 20X1 vs. 20X2</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Calculá el current ratio, quick ratio y cash ratio de Drake Corporation para 20X1 y 20X2, y comentá la tendencia.</em></div> <div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:12px;"> <thead> <tr style="background:var(--bg);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);"></th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">20X1 ($000s)</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">20X2 ($000s)</th> </tr> </thead> <tbody> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Cash y marketable securities</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">98</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">54</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Accounts receivable</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">120</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">110</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Inventory</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">190</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">310</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Prepaid accounts</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">24</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">18</td></tr> <tr><td style="padding:6px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Accounts payable</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">85</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">100</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Accrued expenses</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">34</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">39</td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Short-term notes payable</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">98</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">145</td></tr> </tbody> </table> </div> <div class="fbox">Current ratio 20X1 = (98+120+190+24) / (85+34+98) = 432 / 217 = 1.99<br>Current ratio 20X2 = (54+110+310+18) / (100+39+145) = 492 / 284 = 1.73</div> <div class="fbox">Quick ratio 20X1 = (98+120) / 217 = 218 / 217 = 1.00<br>Quick ratio 20X2 = (54+110) / 284 = 164 / 284 = 0.58</div> <div class="fbox">Cash ratio 20X1 = 98 / 217 = 0.45<br>Cash ratio 20X2 = 54 / 284 = 0.19</div> <div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Current ratio</span><span class="ex-val">1.99 → <strong>1.73</strong></span></div> <div class="ex-row"><span class="ex-label">Quick ratio</span><span class="ex-val">1.00 → <strong>0.58</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Cash ratio</span><span class="ex-val fw400">0.45 → <strong>0.19</strong></span></div> </div> <div class="alert alert-red mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Los <strong>tres ratios caen</strong> de 20X1 a 20X2 — la liquidez de Drake se está <strong>deteriorando</strong>.</span> </div> </div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo integrador: Licht Vernieuwend NV — NWC y ratios en conflicto</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>A partir del siguiente balance sheet (€'m):</em></div> <div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:11.5px;"> <thead> <tr style="background:var(--bg);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Activos</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">20X2</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">20X1</th> <th style="padding:6px 8px;text-align:left;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Pasivos y equity</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">20X2</th> <th style="padding:6px 8px;text-align:right;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">20X1</th> </tr> </thead> <tbody> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Cash</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">40</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">45</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Accounts payable</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">130</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">140</td></tr> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Marketable securities</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">70</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">90</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Accrued expenses</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">30</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">15</td></tr> <tr><td style="padding:5px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Accounts receivable</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">85</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">90</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Short-term loan</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">60</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">70</td></tr> <tr><td style="padding:5px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Inventory</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">130</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">66</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Long-term debt</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">400</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">400</td></tr> <tr><td style="padding:5px 8px;font-weight:700;border-bottom:1px solid var(--border-light);">Prepaid accounts</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">10</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;border-bottom:1px solid var(--border-light);">15</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Equity</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">805</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">706</td></tr> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Net PP&E</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">1,000</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">950</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Intangibles</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">90</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">75</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:5px 8px;font-weight:700;">Total assets</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;">1,425</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;">1,331</td><td style="padding:5px 8px;font-weight:700;">Total L&E</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;">1,425</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-weight:700;">1,331</td></tr> </tbody> </table> </div>

<div class="card-body mt10 mb6"><strong>1. ¿Cuál es el cambio en el net working capital de 20X1 a 20X2, y cuál es el driver principal?</strong></div> <div class="card-body mb6" style="font-size:12px;">El <strong>short-term loan</strong> (70 → 60) queda <strong>afuera</strong> del cálculo: es financiamiento, no una cuenta operativa.</div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label">NWC 20X1</span><span class="ex-val">(90 + 66 + 15) − (140 + 15) = <strong>16</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">NWC 20X2</span><span class="ex-val fw400">(85 + 130 + 10) − (130 + 30) = <strong>65</strong></span></div> </div> <div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>El NWC sube <strong>€49m</strong> (de 16 a 65) — el driver principal es el <strong>aumento del inventario</strong>, que sube €64m (de 66 a 130).</span> </div>

<div class="card-body mt10 mb6"><strong>2. Con el current ratio y el quick ratio, ¿cómo cambió la liquidez?</strong></div> <div class="fbox">Current ratio 20X1 = (45+90+90+66+15) / (140+15+70) = 306 / 225 = 1.36<br>Current ratio 20X2 = (40+70+85+130+10) / (130+30+60) = 335 / 220 = 1.52</div> <div class="fbox">Quick ratio 20X1 = (45+90+90) / 225 = 225 / 225 = 1.00<br>Quick ratio 20X2 = (40+70+85) / 220 = 195 / 220 = 0.89</div> <div class="ex-table mb10"> <div class="ex-row"><span class="ex-label">Current ratio</span><span class="ex-val">1.36 → <strong>1.52</strong> (sube)</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Quick ratio</span><span class="ex-val fw400">1.00 → <strong>0.89</strong> (baja)</span></div> </div> <div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Los dos ratios dan <strong>señales contradictorias</strong>: según el current ratio, la liquidez <strong>mejoró</strong>; según el quick ratio, <strong>empeoró</strong>.</span> </div> <div class="alert alert-blue mt8"> <i class="fa-solid fa-lightbulb"></i> <span>Tiene más sentido confiar en el ratio <strong>más conservador</strong> (quick ratio): mide la capacidad de cubrir obligaciones usando solo los activos más líquidos, <strong>omitiendo</strong> el inventario. Como el aumento del current ratio está <strong>impulsado por el mismo inventario</strong> que infló el NWC (poco confiable como fuente rápida de cash), la lectura correcta es que la liquidez de la compañía <strong>se deterioró</strong>, no que mejoró.</span> </div>
</div>
</div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-sitemap" style="margin-right:6px;color:var(--accent)"></i>LOS 23.c — Objetivos y métodos de working capital management</div>

<div class="card bt-blue" id="c4-c1"> <div class="card-title"><i class="fa-solid fa-bullseye c-blue"></i> Objetivo del working capital management</div> <div class="card-body">El working capital management busca <strong>maximizar los profits</strong> de la firma, asegurando a la vez suficiente liquidez para mantener las operaciones y cumplir sus obligaciones. Sostener más activos de corto plazo da más colchón de liquidez, pero ofrecen menor retorno. Financiar el working capital con deuda de corto plazo es más barato que con long-term debt o equity — pero implica el riesgo de no poder renovarla (<strong>roll over</strong>) a un costo razonable. Para comparar enfoques entre compañías de distinto tamaño, se calculan los montos relativos de activos de largo vs. corto plazo como proporción de las ventas.</div>
<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: cómo un cambio de política de crédito afecta las necesidades de financiamiento</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Keown Corporation evalúa aumentar la línea de crédito que ofrece a clientes nuevos, porque su sales manager cree que eso va a aumentar las ventas. ¿Cuál sería el impacto esperado sobre las necesidades de financiamiento de corto plazo de Keown si hace este cambio? (A) Reduciría sus niveles de inventario (B) Probablemente cobraría más rápido, reduciendo sus receivables (C) Tendría una mayor necesidad de working capital</em></div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(C)</strong>.</span> </div> <div class="card-body mt8">Ampliar la línea de crédito significa dar <strong>más tiempo</strong> a los clientes para pagar — eso <strong>aumenta accounts receivable</strong> (↑ DSO), no lo reduce (descarta B), y no tiene relación directa con los niveles de inventario (descarta A). Más cash atado en receivables significa <strong>mayor necesidad de working capital</strong> para financiar esa espera.</div> </div>
</div>

<div class="card" id="c4-c2"> <div class="card-title"><i class="fa-solid fa-scale-balanced c-accent"></i> Tres enfoques de working capital management</div> <div class="card-body mb6">Los tres enfoques se distinguen por el balance entre current assets y long-term assets, y por qué tipo de deuda financian ese working capital:</div>
<div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:11.5px;"> <thead> <tr style="background:var(--bg);"> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);"></th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);"><i class="fa-solid fa-shield" style="margin-right:4px;"></i>Conservative</th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);"><i class="fa-solid fa-scale-unbalanced" style="margin-right:4px;"></i>Moderate</th> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);"><i class="fa-solid fa-bolt" style="margin-right:4px;"></i>Aggressive</th> </tr> </thead> <tbody>
<tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);vertical-align:top;">Current assets vs. long-term</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);vertical-align:top;"><strong style="color:var(--text);">Más grandes</strong> relativo a long-term assets — más inventario, más tiempo de pago a clientes (↑ receivables)</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);vertical-align:top;"><strong style="color:var(--text);">Medios</strong> — long-term debt financia los current assets <strong>permanentes</strong>; short-term debt financia los <strong>variable/seasonal</strong></td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);vertical-align:top;"><strong style="color:var(--text);">Más chicos</strong> relativo a long-term assets — menos inventario</td> </tr>
<tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);vertical-align:top;">Financiamiento</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);vertical-align:top;">Más <strong style="color:var(--text);">long-term debt y equity</strong></td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);vertical-align:top;">Balanceado entre largo y corto plazo</td> <td style="padding:7px 8px;color:var(--text-sec);border-bottom:1px solid var(--border-light);vertical-align:top;">Más <strong style="color:var(--text);">deuda de corto plazo</strong> (ej. overdraft, usado solo cuando hace falta)</td> </tr>
<tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);vertical-align:top;">Ventajas</td> <td style="padding:7px 8px;color:var(--green);border-bottom:1px solid var(--border-light);vertical-align:top;">Financiamiento estable con costos conocidos de antemano; mayor certeza de tener el working capital necesario; plazos de repago más largos; mayor resiliencia en mercados turbulentos</td> <td style="padding:7px 8px;color:var(--green);border-bottom:1px solid var(--border-light);vertical-align:top;">Menos costoso que conservative y menos riesgoso que aggressive; algo de flexibilidad de corto plazo</td> <td style="padding:7px 8px;color:var(--green);border-bottom:1px solid var(--border-light);vertical-align:top;">Generalmente menor costo de financiamiento; se pide prestado solo lo necesario; menor impacto en la flexibilidad operativa</td> </tr>
<tr> <td style="padding:7px 8px;font-weight:600;border-bottom:1px solid var(--border-light);vertical-align:top;">Desventajas</td> <td style="padding:7px 8px;color:var(--red);border-bottom:1px solid var(--border-light);vertical-align:top;">Mayor costo de deuda y equity; la deuda de largo plazo puede reducir la flexibilidad operativa</td> <td style="padding:7px 8px;color:var(--red);border-bottom:1px solid var(--border-light);vertical-align:top;">Menor certeza sobre el financiamiento de corto plazo y sus costos en mercados turbulentos</td> <td style="padding:7px 8px;color:var(--red);border-bottom:1px solid var(--border-light);vertical-align:top;">Menor certeza de costos por la fluctuación de tasas de corto plazo (riesgo de <strong style="color:var(--text);">rollover</strong>); menor flexibilidad financiera</td> </tr>
<tr> <td style="padding:7px 8px;font-weight:600;vertical-align:top;">¿Cuándo elegirlo?</td> <td style="padding:7px 8px;color:var(--text-sec);vertical-align:top;">Compañías start-up con menor acceso a financiamiento de corto plazo; tasas de interés estables o en alza</td> <td style="padding:7px 8px;color:var(--text-sec);vertical-align:top;">Necesidades base de cash pronosticables, con algo de incertidumbre en las variables; se busca menor costo manteniendo algo de flexibilidad</td> <td style="padding:7px 8px;color:var(--text-sec);vertical-align:top;">Ventas y necesidades de cash pronosticables con precisión; tasas estables o a la baja; inventario y receivables fáciles de convertir en cash</td> </tr>
</tbody> </table> </div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: clasificar 5 rasgos como conservative o aggressive</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Clasificá cada uno de los siguientes rasgos según el enfoque de working capital management al que corresponde:</em></div> <div style="overflow-x:auto;margin-top:8px;"> <table style="width:100%;border-collapse:collapse;font-size:12.5px;"> <thead> <tr style="background:var(--bg);"> <th style="padding:6px 8px;text-align:left;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);"></th> <th style="padding:6px 8px;text-align:center;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Conservative</th> <th style="padding:6px 8px;text-align:center;font-weight:700;color:var(--text-sec);border-bottom:1px solid var(--border);">Aggressive</th> </tr> </thead> <tbody> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Mayor nivel de inventario relativo a ventas</td><td style="padding:6px 8px;text-align:center;color:var(--accent);font-weight:700;border-bottom:1px solid var(--border-light);">✓</td><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Mayor dependencia de financiamiento de largo plazo</td><td style="padding:6px 8px;text-align:center;color:var(--accent);font-weight:700;border-bottom:1px solid var(--border-light);">✓</td><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Mayor nivel de cash disponible</td><td style="padding:6px 8px;text-align:center;color:var(--accent);font-weight:700;border-bottom:1px solid var(--border-light);">✓</td><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">Mayor nivel de marketable securities</td><td style="padding:6px 8px;text-align:center;color:var(--accent);font-weight:700;border-bottom:1px solid var(--border-light);">✓</td><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);"></td></tr> <tr><td style="padding:6px 8px;">Mayor dependencia de préstamos de corto plazo</td><td style="padding:6px 8px;text-align:center;"></td><td style="padding:6px 8px;text-align:center;color:var(--accent);font-weight:700;">✓</td></tr> </tbody> </table> </div> <div class="card-body mt8" style="font-size:12.5px;">Los primeros cuatro rasgos describen a una compañía que sostiene <strong>más</strong> activos líquidos y de largo plazo (conservative); el último describe a una que se financia con <strong>deuda de corto plazo</strong> (aggressive).</div> </div>
</div>

<div class="card" id="c4-c3"> <div class="card-title"><i class="fa-solid fa-list-check c-accent"></i> Factores que afectan el enfoque de financiamiento de corto plazo</div> <div class="card-body mb6">Las firmas deben mantener variedad de fuentes alternativas y evaluar el costo de cada una, asegurándolas con anticipación para cubrir picos en las necesidades de liquidez. El enfoque elegido depende de:</div> <ul style="margin:0;padding-left:20px;font-size:13px;line-height:1.8;color:var(--text);"> <li><strong>Tamaño de la compañía</strong> — las firmas más chicas tienen opciones limitadas</li> <li><strong>Creditworthiness</strong> — afecta la tasa de interés y las restricciones operativas impuestas</li> <li><strong>Sistemas legales</strong> — economías desarrolladas con protecciones bien definidas para lenders ofrecen más alternativas de financiamiento</li> <li><strong>Regulatory concerns</strong> — firmas en industrias reguladas (bancos, utilities) tienen restricciones sobre fuentes y montos</li> <li><strong>Underlying assets</strong> — los activos que sirven como colateral de los préstamos</li> </ul> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 23.1</div> <div class="card bt-accent" id="c4-formulas"> <div class="card-title"><i class="fa-solid fa-square-root-variable c-accent"></i> Fórmulas del capítulo</div>

<div class="subsection-label">Cash conversion cycle</div>
<div class="fbox">CCC = DOH + DSO − DPO</div>
<div class="card-body mt8" style="font-size:12px;">A menor CCC, mayor eficiencia de liquidez. ↓ inventario, ↓ DSO, ↑ DPO lo reducen — cada uno con su propio riesgo (ver Módulo 23.1).</div>

<div class="subsection-label mt10">Working capital: total vs. neto</div>
<div class="fbox">Total working capital = Current assets − Current liabilities</div>
<div class="fbox mt8">Net working capital (NWC) = Current operating assets − Current operating liabilities</div>
<div class="var-table"> <div class="var-row"><span class="var-name">Current assets</span><span class="var-desc">Cash, marketable securities, accounts receivable, inventory, prepaid expenses</span></div> <div class="var-row"><span class="var-name">Current liabilities</span><span class="var-desc">Accounts payable, accrued expenses, short-term debt (short-term loans, notes payable, current portion de long-term debt)</span></div> <div class="var-row"><span class="var-name">Current operating assets</span><span class="var-desc">Accounts receivable, inventory, prepaid expenses — <strong>excluye</strong> cash y marketable securities</span></div> <div class="var-row"><span class="var-name">Current operating liabilities</span><span class="var-desc">Accounts payable, accrued expenses — <strong>excluye</strong> short-term debt</span></div> </div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span><strong>Diferencia:</strong> el total working capital usa <strong>todas</strong> las cuentas current, incluyendo cash, marketable securities y deuda financiera de corto plazo. El NWC excluye esas cuentas <strong>financieras</strong> — solo mide lo <strong>operativo</strong>, por eso está ligado directamente al CCC. Una cuenta como el <strong>short-term debt</strong> entra al current/quick/cash ratio, pero nunca al NWC.</span> </div>

<div class="subsection-label mt10">Cash flow from operations (CFO) y Free cash flow</div>
<div class="fbox">CFO = Cash in − Cash out</div>
<div class="fbox mt8">Free cash flow = CFO − Investments in long-term assets</div>
<div class="var-table"> <div class="var-row"><span class="var-name">Cash in</span><span class="var-desc">Cash received from customers + interest and dividends received on financial investments</span></div> <div class="var-row"><span class="var-name">Cash out</span><span class="var-desc">Cash paid to employees and suppliers + taxes paid to governments + interest paid to lenders</span></div> <div class="var-row"><span class="var-name">Investments in LT assets</span><span class="var-desc">La inversión en sí — el <strong>cash out</strong> del rubro investing</span></div> </div>
<div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Ojo con qué número restar:</strong> el FCF <strong>no</strong> resta el CFI completo del statement of cash flows — el CFI es un <strong>neto</strong> (puede incluir, por ejemplo, la venta de un activo). Tampoco entra el lado de <strong>financing</strong>: el FCF busca aislar cuánto cash sobra <strong>antes</strong> de las decisiones de financiamiento.</span> </div>

<div class="subsection-label mt10">Liquidity ratios</div>
<div class="fbox">Current ratio = Current assets / Current liabilities</div>
<div class="fbox mt8">Quick ratio = (Cash and marketable securities + Accounts receivable) / Current liabilities</div>
<div class="fbox mt8">Cash ratio = Cash and marketable securities / Current liabilities</div>
<div class="var-table"> <div class="var-row"><span class="var-name">Current assets</span><span class="var-desc">Cash, marketable securities, accounts receivable, inventory, prepaid expenses (mismo total que en el total working capital)</span></div> <div class="var-row"><span class="var-name">Current liabilities</span><span class="var-desc">Accounts payable, accrued expenses, short-term debt — la misma base para los tres ratios</span></div> <div class="var-row"><span class="var-name">Cash and mkt. sec.</span><span class="var-desc">Cash + marketable securities — el numerador que comparten quick ratio y cash ratio</span></div> </div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span><strong>Diferencia:</strong> cada ratio es más <strong>estricto</strong> que el anterior. El current ratio incluye <strong>todo</strong> current asset (inventory y prepaid incluidos). El quick ratio ("acid test") excluye <strong>inventory y prepaid</strong> — los activos corrientes menos líquidos. El cash ratio va un paso más allá y excluye también <strong>accounts receivable</strong>, quedándose solo con lo más líquido.</span> </div>

<div class="subsection-label mt10">Costo de financiamiento con proveedores (trade credit)</div>
<div class="fbox">EAR supplier financing = (1 + a/(1−a))^(365/(c−b)) − 1</div>
<div class="card-body mt8" style="font-size:12px;">a = % de descuento por pronto pago · b = día límite para tomar el descuento · c = día límite de pago total. Se compara contra el costo explícito de la deuda bancaria de corto plazo.</div>
</div>

<div class="card bt-accent mt10" id="c4-glossary"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">Liquidez</span><span class="ex-val">Activo: cercanía al cash. Pasivo: cercanía al settlement</span></div> <div class="ex-row"><span class="ex-label">Fuentes primarias vs. secundarias</span><span class="ex-val">Cash/marketable securities/bank borrowings/cash del negocio vs. recortar dividendos, vender activos, emitir equity, reestructurar deuda, bankruptcy protection</span></div> <div class="ex-row"><span class="ex-label">Drag vs. pull on liquidity</span><span class="ex-val">Drag: cash inflows se atrasan (↑ DOH/DSO). Pull: cash outflows se aceleran (↓ DPO)</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Conservative / moderate / aggressive</span><span class="ex-val fw400">Más ↔ menos short-term assets, financiados con fuentes de largo ↔ corto plazo</span></div> </div> </div></div>`;}

function pageC5() { return `<div class="module-theme module-c5"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 24.a, 24.b</div> <div class="page-title">Module 24.1: Capital Investments and Project Measures</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 24: Capital Investments and Project Measures</div>

<div class="card bt-accent" id="c5-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">Este módulo cubre el <strong>capital allocation process</strong>: cómo una firma decide en qué proyectos de largo plazo invertir. Arranca clasificando los <strong>4 tipos de capital investments</strong> según su complejidad analítica (going concern, regulatory/compliance, expansion, other), sigue con los <strong>4 pasos administrativos</strong> del proceso, y desarrolla las <strong>3 métricas centrales</strong> para evaluar proyectos — <strong>NPV, IRR y ROIC</strong> — comparando sus decision rules, ventajas, desventajas, y cuándo usar cada una.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-layer-group" style="margin-right:6px;color:var(--accent)"></i>LOS 24.a — Tipos de capital investments</div>

<div class="card" id="c5-a1"> <div class="card-title"><i class="fa-solid fa-sitemap c-accent"></i> 4 tipos de capital investments</div> <div class="card-body mb6">Los proyectos de capital allocation se agrupan en 4 categorías según su propósito y la <strong>complejidad del análisis</strong> que requieren. Debajo de cada tipo van sus riesgos y particularidades:</div>
<div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Going concern projects</div> Necesarios para <strong>mantener el negocio</strong> o reducir costos — reemplazo o mantenimiento de activos existentes. En general, el tipo con el <strong>análisis más simple</strong> de los 4. <div style="margin-top:8px;"><strong>El riesgo es subinvertir.</strong> Se evalúan con un <strong>cost-benefit analysis</strong> directo: costo up-front vs. valor presente de los ahorros anuales. La depreciación anual funciona como un <strong>piso aproximado</strong> del capex necesario — si la firma gasta sistemáticamente <strong>menos</strong> que su depreciación, su base de activos se <strong>reduce en términos reales</strong>. La aproximación es más precisa cuanto más corta sea la vida útil del activo.</div> </div> </div>
<div class="reason-box" style="background:var(--green-light);margin-top:20px;"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Regulatory / compliance projects</div> Exigidos por una <strong>agencia de gobierno o una aseguradora</strong>, típicamente por temas de seguridad o ambientales — sin revenue directo asociado. </div> </div>
<div class="contrast-row"> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-file-invoice-dollar"></i> Costo de no cumplir</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">Multas, litigios, pérdida de la licencia para operar. Parte del costo a veces se traslada a los clientes vía precios.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-lightbulb"></i> Oportunidades</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;">Barrera de entrada para competidores, timing coordinado con reguladores, mayor certeza a futuro, y ventaja estratégica frente a la competencia.</div> </div> </div>
<div class="alert alert-red mt8" style="font-size:12.5px;"> <i class="fa-solid fa-landmark"></i> <span><strong>Caso real:</strong> Danske Bank (Dinamarca) no invirtió a tiempo en compliance — deficiencias de control permitieron que su sucursal en Estonia se usara para lavado de dinero (transacciones 2007–2015, destapado en 2017–18), posiblemente el mayor escándalo de la historia en Europa. Consecuencia: las penalidades por lavado de dinero en Dinamarca se multiplicaron <strong>8x</strong>.</span> </div>
<div class="reason-box" style="background:var(--amber-light);margin-top:20px;"> <span class="reason-num" style="color:var(--amber);">3</span> <div class="reason-body" style="color:#8A5A12;"> <div class="reason-title">Expansion projects</div> Hacen <strong>crecer el negocio</strong>: entrar a nuevos mercados o lanzar nuevos productos dentro del mismo mercado. Requieren forecasting detallado de demanda, revenues y expenses. </div> </div>
<div class="contrast-row"> <div class="contrast-box" style="background:var(--blue-light);"> <div class="contrast-label" style="color:var(--blue);"><i class="fa-solid fa-seedling"></i> Equity funding</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;">Más usado por compañías nuevas — más caro y riesgoso que la deuda.</div> </div> <div class="contrast-box" style="background:var(--teal-light);"> <div class="contrast-label" style="color:#57554F;"><i class="fa-solid fa-building-columns"></i> Debt funding</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;">Más usado por compañías establecidas — generalmente más barato.</div> </div> </div>
<div class="contrast-row mt8"> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-triangle-exclamation"></i> Riesgos</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">Sourcing de insumos, dificultades de producción, subestimar costos, gestionar múltiples líneas a la vez, mayor competencia.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-lightbulb"></i> Oportunidades</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;">Más competitividad, nuevos clientes y market share, mantenerse adelante de la competencia.</div> </div> </div>
<div class="reason-box" style="background:var(--purple-light);margin-top:20px;"> <span class="reason-num c-purple">4</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Other projects</div> Inversiones <strong>fuera de las líneas de negocio existentes</strong> de la firma, por uno de dos caminos: construir algo desde cero, o comprar una empresa ya existente en una industria nueva. </div> </div>
<div class="contrast-row"> <div class="contrast-box" style="background:var(--purple-light);"> <div class="contrast-label" style="color:var(--purple);"><i class="fa-solid fa-lightbulb"></i> Startup (desde cero)</div> <div style="font-size:12.5px;color:#4F46E5;line-height:1.6;">Explorar una nueva tecnología o idea de negocio construida internamente.</div> </div> <div class="contrast-box" style="background:var(--amber-light);"> <div class="contrast-label" style="color:var(--amber);"><i class="fa-solid fa-handshake"></i> Acquisition (no es desde cero)</div> <div style="font-size:12.5px;color:#8A5A12;line-height:1.6;">Comprar una empresa ya existente en una industria nueva — un expansionary project vía M&A.</div> </div> </div>
<div class="contrast-row mt8"> <div class="contrast-box" style="background:var(--red-light);"> <div class="contrast-label" style="color:var(--red);"><i class="fa-solid fa-triangle-exclamation"></i> Riesgos</div> <div style="font-size:12.5px;color:#AE5038;line-height:1.6;">Falta de conocimiento operando un negocio desconocido, y riesgo de <strong>overpay</strong> por el target.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-lightbulb"></i> Oportunidades</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;">Special situation con potencial único de crecimiento o innovación.</div> </div> </div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>La complejidad del análisis <strong>aumenta</strong> de los primeros dos tipos hacia los últimos dos: going concern y regulatory/compliance rara vez requieren un análisis detallado, mientras que expansion y other siempre lo requieren, por la mayor incertidumbre sobre los cash flows futuros.</span> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-diagram-project" style="margin-right:6px;color:var(--accent)"></i>LOS 24.b — Capital allocation process, NPV, IRR y ROIC</div>

<div class="card bt-blue" id="c5-b1"> <div class="card-title"><i class="fa-solid fa-circle-question c-blue"></i> Qué es el capital allocation process, y por qué importa</div> <div class="card-body mb6">El <strong>capital allocation process</strong> consiste en identificar y evaluar <strong>capital projects</strong> — proyectos cuyos cash flows a la firma se reciben a lo largo de <strong>más de un año</strong>. Cualquier decisión corporativa con impacto en earnings futuros puede analizarse con este framework: comprar una máquina nueva, expandirse a otra región geográfica, mudar las oficinas centrales, o reemplazar un camión de reparto, entre otras.</div>
<div class="card-body mb6">Por varias razones, el capital allocation puede ser la <strong>responsabilidad más importante</strong> de un financial manager:</div>
<div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Compromete a la firma a largo plazo</div> Suele implicar la compra de activos costosos de larga vida útil — las decisiones tomadas hoy pueden determinar el <strong>éxito futuro</strong> de la firma. </div> </div>
<div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Sus principios se aplican a otras decisiones</div> El mismo framework aplica a decisiones de <strong>working capital management</strong> y a <strong>fusiones y adquisiciones</strong> estratégicas. </div> </div>
<div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">3</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Es consistente con maximizar shareholder value</div> Tomar buenas decisiones de capital allocation está alineado con el objetivo primario del management: <strong>maximizar el valor</strong> para los shareholders. </div> </div>
</div>

<div class="card" id="c5-b2"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Los 4 pasos administrativos del proceso</div>
<div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Idea generation</div> El paso <strong>más importante</strong> del proceso: generar buenas ideas de proyectos. Pueden venir de senior management, divisiones funcionales, empleados, o fuentes externas a la compañía. </div> </div>
<div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Analizar las project proposals</div> Como la decisión de aceptar o rechazar un capital project se basa en sus <strong>expected future cash flows</strong>, hay que forecastear los cash flows de cada proyecto para determinar su rentabilidad esperada. </div> </div>
<div class="reason-box" style="background:var(--amber-light);"> <span class="reason-num" style="color:var(--amber);">3</span> <div class="reason-body" style="color:#8A5A12;"> <div class="reason-title">Armar el capital budget de la firma</div> Hay que <strong>priorizar</strong> los proyectos rentables según el timing de sus cash flows, los recursos disponibles, y el plan estratégico general — muchos proyectos atractivos individualmente <strong>no tienen sentido estratégico</strong>. </div> </div>
<div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">4</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Monitorear decisiones y hacer un post-audit</div> Es importante hacer seguimiento de todas las decisiones tomadas: comparar los resultados reales contra los proyectados, y que los project managers expliquen las diferencias. El post-audit sirve para identificar <strong>errores sistemáticos</strong> en el proceso de forecasting y mejorar las operaciones de la firma. </div> </div>
</div>

<div class="card bt-blue" id="c5-b3"> <div class="card-title"><i class="fa-solid fa-sack-dollar c-blue"></i> Net Present Value (NPV)</div> <div class="card-body">El <strong>NPV</strong> es la suma de los valores presentes de todos los <strong>expected incremental cash flows</strong> si se emprende un proyecto. La tasa de descuento usada es el <strong>cost of capital</strong> de la firma, ajustado por el nivel de riesgo del proyecto. Para un proyecto normal — un outflow inicial seguido de una serie de inflows después de impuestos — el NPV es el valor presente de los inflows esperados menos el costo inicial del proyecto.</div>
<div class="fbox">NPV = CF<sub>0</sub> + CF<sub>1</sub>/(1+k)<sup>1</sup> + CF<sub>2</sub>/(1+k)<sup>2</sup> + ... + CF<sub>n</sub>/(1+k)<sup>n</sup> = Σ CF<sub>t</sub>/(1+k)<sup>t</sup></div>
<div class="var-table"> <div class="var-row"><span class="var-name">CF₀</span><span class="var-desc">Initial investment outlay — un cash flow <strong>negativo</strong></span></div> <div class="var-row"><span class="var-name">CFₜ</span><span class="var-desc">After-tax cash flow en el momento t — puede ser positivo o negativo</span></div> <div class="var-row"><span class="var-name">k</span><span class="var-desc">Required rate of return para el proyecto</span></div> </div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>Un proyecto con <strong>NPV positivo</strong> se espera que <strong>aumente</strong> la riqueza de los shareholders; uno con NPV negativo se espera que la <strong>disminuya</strong>; y uno con NPV cero no tiene efecto esperado sobre la riqueza de los shareholders.</span> </div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span><strong>NPV decision rule</strong> (proyectos independientes): aceptar cualquier proyecto con NPV positivo; rechazar cualquiera con NPV negativo.</span> </div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: calcular el NPV de un proyecto</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Con los cash flows de la tabla, calculá el NPV del proyecto y determiná si debería aceptarse o rechazarse. El cost of capital es 9%.</em></div>
<div style="overflow-x:auto;margin-top:8px;"> <table class="tbl-std"> <thead> <tr style="background:var(--bg);"> <th style="text-align:left;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Year</th> <th style="text-align:right;padding:7px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Cash flow</th> </tr> </thead> <tbody>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">0</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">−$100</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">1</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$25</td></tr>
<tr><td style="padding:6px 8px;border-bottom:1px solid var(--border-light);">2</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--border-light);">$50</td></tr>
<tr><td style="padding:6px 8px;">3</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);">$75</td></tr>
</tbody> </table> </div>
<div class="fbox mt8">NPV = −100 + 25/1.09 + 50/1.09² + 75/1.09³ = <strong>22.93</strong></div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>El proyecto tiene NPV <strong>positivo</strong>, así que debería <strong>aceptarse</strong>.</span> </div>
<div class="card-body mt8" style="font-size:12.5px;">También podés calcular el NPV directo con las teclas CF de la calculadora (TI BA II Plus):</div>
<div style="overflow-x:auto;margin-top:8px;"> <table class="tbl-std"> <thead> <tr style="background:var(--bg);"> <th style="text-align:left;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Keystrokes</th> <th style="text-align:left;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Explicación</th> <th style="text-align:right;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">Display</th> </tr> </thead> <tbody>
<tr><td style="padding:5px 8px;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">[CF] [2nd] [CLR WORK]</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Borra los registros</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">CF0 = 0</td></tr>
<tr><td style="padding:5px 8px;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">100 [+/−] [ENTER]</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Outlay inicial</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">CF0 = −100</td></tr>
<tr><td style="padding:5px 8px;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">[↓] 25 [ENTER] [↓]</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Cash flow período 1, frecuencia 1</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">C01 = 25</td></tr>
<tr><td style="padding:5px 8px;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">[↓] 50 [ENTER] [↓]</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Cash flow período 2, frecuencia 1</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">C02 = 50</td></tr>
<tr><td style="padding:5px 8px;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">[↓] 75 [ENTER] [↓]</td><td style="padding:5px 8px;border-bottom:1px solid var(--border-light);">Cash flow período 3, frecuencia 1</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:11.5px;border-bottom:1px solid var(--border-light);">C03 = 75</td></tr>
<tr><td style="padding:5px 8px;font-family:var(--mono);font-size:11.5px;">[NPV] 9 [ENTER] [↓] [CPT]</td><td style="padding:5px 8px;">Discount rate 9%, calcular NPV</td><td style="padding:5px 8px;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:700;">NPV = 22.9335</td></tr>
</tbody> </table> </div>
</div> </div>

<div class="card bt-blue" id="c5-b4"> <div class="card-title"><i class="fa-solid fa-percent c-blue"></i> Internal Rate of Return (IRR)</div> <div class="card-body">Para un proyecto normal, el <strong>IRR</strong> es la tasa de descuento que hace que el valor presente de los expected incremental after-tax cash inflows sea <strong>igual</strong> al costo inicial del proyecto. De forma más general, el IRR es la tasa de descuento que iguala el valor presente de los cash inflows estimados con el valor presente de los cash outflows estimados de un proyecto (PV inflows = PV outflows). También es la tasa de descuento para la cual el NPV del proyecto es <strong>igual a cero</strong>.</div>
<div class="fbox">0 = NPV = CF<sub>0</sub> + CF<sub>1</sub>/(1+IRR)<sup>1</sup> + CF<sub>2</sub>/(1+IRR)<sup>2</sup> + ... + CF<sub>n</sub>/(1+IRR)<sup>n</sup></div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>De forma intuitiva, el IRR se puede leer como el <strong>% de retorno anual aproximado</strong> que la inversión le da a los inversores. Es el <strong>mismo concepto</strong> que aparece en otros topics del programa con otro nombre: el <strong>YTM</strong> en Fixed Income es un IRR, y también lo es el <strong>MWRR</strong> (money-weighted rate of return) en Quantitative Methods.</span> </div>
<div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>El IRR asume que cada cash inflow y outflow ocurre <strong>al final del período</strong>, y que <strong>todos los períodos están espaciados de forma uniforme</strong> — el mismo supuesto que rompe el caso de intervalos de tiempo desiguales que vimos más abajo.</span> </div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span><strong>IRR decision rule:</strong> si el IRR es mayor al required rate of return, aceptar el proyecto. Si es menor, rechazarlo.</span> </div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span>El required rate of return suele ser el cost of capital de la firma, pero un analista puede ajustarlo hacia arriba o abajo para reflejar diferencias entre el riesgo del proyecto y el riesgo promedio de todos los proyectos de la firma. Por eso, el <strong>IRR mínimo</strong> por encima del cual se acepta un proyecto se conoce como el <strong>hurdle rate</strong>.</span> </div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: calcular el IRR con los mismos cash flows</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Con los mismos cash flows del ejemplo de NPV (−100, 25, 50, 75), calculá el IRR y determiná si el proyecto debería aceptarse. El required rate of return es 9%.</em></div>
<div class="fbox">0 = −100 + 25/(1+IRR) + 50/(1+IRR)² + 75/(1+IRR)³</div>
<div class="card-body mt8" style="font-size:12.5px;">Con la calculadora (mismos cash flows ya cargados): <strong>[IRR] [CPT]</strong> → <strong>19.4377%</strong>.</div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>El proyecto debería <strong>aceptarse</strong>, porque su IRR (19.44%) es mayor al 9% required rate of return.</span> </div>
</div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: IRR con cash flows anuales parejos (Gerhardt Corporation)</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Gerhardt Corporation evalúa una inversión de capital de €50 millones hoy, que se espera devuelva after-tax cash flows de €16 millones por año durante los próximos 4 años, más otros €20 millones en el año 5. ¿Cuál es el IRR de la inversión? Asumiendo un hurdle rate de 10%, ¿debería hacerse la inversión?</em></div>
<div class="fbox">0 = −50 + 16/(1+IRR) + 16/(1+IRR)² + 16/(1+IRR)³ + 16/(1+IRR)⁴ + 20/(1+IRR)⁵</div>
<div class="card-body mt8" style="font-size:12.5px;">Con la calculadora (BA II Plus): <strong>[IRR] [CPT]</strong> → <strong>19.52%</strong>.</div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Como el IRR (19.52%) <strong>excede</strong> el hurdle rate de 10%, la inversión <strong>debería hacerse</strong>. En términos intuitivos, esta inversión le devuelve a la firma un <strong>retorno anual aproximado del 19%</strong> sobre el capital invertido.</span> </div>
</div> </div>

<div class="card" id="c5-b5"> <div class="card-title"><i class="fa-solid fa-arrows-left-right c-accent"></i> Cash flow pattern: conventional vs. unconventional</div>
<div class="contrast-row"> <div class="contrast-box" style="background:var(--blue-light);"> <div class="contrast-label" style="color:var(--blue);"><i class="fa-solid fa-arrow-right"></i> Conventional</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;">El signo de los cash flows cambia <strong>una sola vez</strong>: uno o más outflows seguidos de uno o más inflows.</div> </div> <div class="contrast-box" style="background:var(--amber-light);"> <div class="contrast-label" style="color:var(--amber);"><i class="fa-solid fa-shuffle"></i> Unconventional</div> <div style="font-size:12.5px;color:#8A5A12;line-height:1.6;">Hay <strong>más de un cambio de signo</strong> — por ejemplo, un outflow inicial, una serie de inflows, y un outflow final por costos de retiro del activo. También se considera unconventional cuando los <strong>intervalos de tiempo</strong> entre cash flows difieren entre sí.</div> </div> </div>
<div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Con múltiples cambios de signo, un proyecto puede tener <strong>múltiples IRR</strong> difíciles de interpretar. El software de planillas de cálculo es el más adecuado para calcular NPV e IRR con cash flows unconventional.</span> </div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: NPV con intervalos de tiempo desiguales (t = 1.5)</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Gerhardt Corporation evalúa una inversión de capital de €50 millones hoy, con el siguiente cash flow schedule estimado a lo largo de los próximos 5 años (montos en millones de euros). Asumiendo un required rate of return de 10%, ¿cuál es el NPV de la inversión?</em></div>
<div style="overflow-x:auto;margin-top:8px;"> <table class="tbl-std"> <thead> <tr style="background:var(--bg);"> <th style="text-align:left;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">t</th> <th style="text-align:right;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">0</th> <th style="text-align:right;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">1</th> <th style="text-align:right;padding:6px 8px;font-weight:700;color:var(--amber);border-bottom:1px solid var(--border);">1.5</th> <th style="text-align:right;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">2</th> <th style="text-align:right;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">3</th> <th style="text-align:right;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">4</th> <th style="text-align:right;padding:6px 8px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);">5</th> </tr> </thead> <tbody>
<tr><td style="padding:6px 8px;font-weight:600;">Cash flow</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);">−50</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);">10</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);font-weight:700;color:var(--amber);">−5</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);">13</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);">16</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);">19</td><td style="padding:6px 8px;text-align:right;font-family:var(--mono);">23</td></tr>
</tbody> </table> </div>
<div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>El intervalo entre t=1 y t=1.5 es de solo <strong>0.5 años</strong> — distinto al resto de los intervalos (1 año cada uno). Esto es exactamente el caso de <strong>unconventional cash flow</strong> por intervalos de tiempo desiguales: el CF/NPV worksheet estándar de la calculadora asume períodos <strong>enteros y consecutivos</strong>, así que no admite ingresar este cash flow directamente en t=1.5.</span> </div>
<div class="card-body mt10 mb6">Hay <strong>2 formas válidas</strong> de resolverlo:</div>
<div class="contrast-row"> <div class="contrast-box" style="background:var(--blue-light);"> <div class="contrast-label" style="color:var(--blue);"><i class="fa-solid fa-left-long"></i> Llevar el CF de t=1.5 a t=1</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;"><strong>Dividir</strong> el cash flow de t=1.5 por 1.10<sup>0.5</sup> para traerlo a t=1, y sumarlo algebraicamente al cash flow que ya está ahí. Con eso, quedan solo períodos enteros y se puede usar el CF/NPV worksheet normalmente.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-right-long"></i> Llevar el CF de t=1.5 a t=2</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;"><strong>Multiplicar</strong> el cash flow de t=1.5 por 1.10<sup>0.5</sup> para llevarlo a t=2, y sumarlo al cash flow que ya está en t=2. Mismo resultado final, distinto punto de conversión.</div> </div> </div>
<div class="card-body mt10 mb6">O, de forma más directa: calcular el NPV <strong>a mano</strong>, descontando cada cash flow por su propio exponente (incluido el 1.5), sin pasar por el CF/NPV worksheet:</div>
<div class="fbox" style="overflow-x:auto;">NPV = −50 + 10/1.10 + (−5)/(1.10)<sup>1.5</sup> + 13/(1.10)<sup>2</sup> + 16/(1.10)<sup>3</sup> + 19/(1.10)<sup>4</sup> + 23/(1.10)<sup>5</sup> = <strong>+4.78</strong></div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>NPV <strong>positivo</strong> (+4.78) → la inversión debería <strong>aceptarse</strong>.</span> </div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span>Las dos formas —trasladar el CF de t=1.5 hacia t=1 o hacia t=2, o descontar cada término a mano con su propio exponente— llegan al <strong>mismo NPV</strong>. La clave es notar que, apenas los intervalos entre cash flows dejan de ser iguales, el CF/NPV worksheet de la calculadora deja de ser una opción directa.</span> </div>
</div>

<div class="alert alert-red mt10"> <i class="fa-solid fa-graduation-cap"></i> <span><strong>Trampa de examen:</strong> la <strong>cantidad de cambios de signo</strong> en los cash flows de un proyecto es la cantidad de <strong>IRR distintos</strong> que matemáticamente pueden salir (un cambio de signo → 1 IRR; dos cambios de signo → hasta 2 IRR posibles; y así sucesivamente). Si en el examen te encontrás con un cash flow pattern que cambia de signo <strong>más de una vez</strong>, el IRR deja de ser una herramienta confiable — no calcules ni intentes interpretar "el" IRR. La respuesta correcta es <strong>abandonar el IRR y volver al NPV</strong>, que siempre da una única respuesta bien definida, sin importar cuántas veces cambie el signo de los cash flows.</span> </div> </div>

<div class="card" id="c5-b6"> <div class="card-title"><i class="fa-solid fa-scale-balanced c-accent"></i> NPV vs. IRR: ventajas y desventajas relativas</div>
<div class="contrast-row"> <div class="contrast-box" style="background:var(--blue-light);"> <div class="contrast-label" style="color:var(--blue);"><i class="fa-solid fa-sack-dollar"></i> NPV</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;"><strong>Ventaja clave:</strong> mide directamente el aumento esperado en el valor de la firma. En teoría, un proyecto con NPV positivo debería generar un aumento proporcional en el precio de la acción. Asume que los cash flows se reinvierten a la <strong>required rate of return</strong> del proyecto — el supuesto más realista.</div> </div> <div class="contrast-box" style="background:var(--green-light);"> <div class="contrast-label" style="color:var(--green);"><i class="fa-solid fa-percent"></i> IRR</div> <div style="font-size:12.5px;color:#3F7A5C;line-height:1.6;"><strong>Ventaja clave:</strong> mide la rentabilidad como un <strong>porcentaje</strong>, mostrando el retorno de cada dólar invertido — da información sobre el <strong>margen de seguridad</strong> que el NPV no da (cuánto puede caer el retorno real antes de que el proyecto se vuelva NPV-negativo).</div> </div> </div>
<div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Desventajas del IRR:</strong> (1) asume que los cash flows se reinvierten al <strong>propio IRR</strong> — menos realista que el supuesto del NPV; (2) con múltiples cambios de signo, un proyecto puede tener <strong>múltiples IRR</strong> difíciles de interpretar.</span> </div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span><strong>Cuando hay conflicto</strong> entre elegir el proyecto con mayor NPV o el de mayor IRR, la elección correcta es el de <strong>mayor NPV</strong>: mide el valor en <strong>términos absolutos</strong> ($) que el proyecto agrega a la firma, tiene en cuenta el <strong>tamaño</strong> de la inversión, y puede verse en el contexto del tamaño de la firma. El IRR, en cambio, solo mide una <strong>tasa de retorno</strong> — no considera ni el tamaño del proyecto ni el período durante el cual se gana ese retorno.</span> </div> </div>

<div class="card bt-blue" id="c5-b7"> <div class="card-title"><i class="fa-solid fa-chart-pie c-blue"></i> Return on Invested Capital (ROIC)</div> <div class="card-body mb6">Una forma de examinar si una compañía está creando valor para sus shareholders es comparar el retorno sobre su inversión en activos con su cost of capital.</div>
<div class="fbox mt10">ROIC = NOPAT / Average book value of total capital</div>
<div class="var-table"> <div class="var-row"><span class="var-name">NOPAT</span><span class="var-desc"><strong>Net operating profit after tax</strong> — la ganancia de las operaciones después de impuestos, <strong>antes de descontar los intereses</strong> de la deuda. Es el retorno que generó el negocio para <strong>todos</strong> los que financian la firma (deuda + equity).</span></div> </div>
<div class="alert alert-blue mt8"> <i class="fa-solid fa-circle-info"></i> <span>Por eso no se resta el interés: el denominador incluye <strong>deuda + equity</strong>, así que el numerador tiene que ser la ganancia disponible para <strong>ambos</strong>. Se obtiene aplicándole impuestos al operating profit (fórmula de abajo), o equivalentemente como <strong>Net income + after-tax interest expense</strong> — sumando de vuelta el interés después de impuestos.</span> </div>
<div class="card-body mt10 mb6">En la práctica, el NOPAT sale de <strong>(1 − TR) × Operating profit</strong> y el capital es <strong>Total LT liabilities + Equity</strong>:</div>
<div class="fbox">ROIC = [(1 − TR) × Operating profit] / Average BV of (Total LT liabilities + Equity)</div>
<div class="var-table"> <div class="var-row"><span class="var-name">TR</span><span class="var-desc">Tax rate — el factor (1 − TR) convierte el operating profit de <strong>pre-tax</strong> a <strong>after-tax</strong></span></div> <div class="var-row"><span class="var-name">Operating profit</span><span class="var-desc">Se aproxima con el <strong>EBIT</strong> (earnings before interest and taxes)</span></div> <div class="var-row"><span class="var-name">Total LT liabilities + Equity</span><span class="var-desc"><strong>Long-term debt</strong> + <strong>shareholders' funds</strong> (share capital + retained earnings/reserves)</span></div> <div class="var-row"><span class="var-name">Average</span><span class="var-desc">Promedio entre el book value de <strong>inicio</strong> y <strong>fin</strong> del período</span></div> </div>
<div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>El denominador solo incluye fuentes de <strong>funding/capital de largo plazo</strong> — <strong>no</strong> de corto plazo. Por eso no se incluyen partidas como accounts payable (pago a proveedores) o short-term debt; del lado del equity, lo que entra son los <strong>shareholders' funds</strong> (share capital + retained earnings), no el total del equity de corto plazo.</span> </div>
<div class="card-body mt10 mb6">La fórmula de ROIC también puede reescribirse descomponiéndola en dos drivers:</div>
<div class="fbox">ROIC = (NOPAT / Average Invested Capital) = (NOPAT / Sales) × (Sales / Average Invested Capital)</div>
<div class="var-table"> <div class="var-row"><span class="var-name">NOPAT/Sales</span><span class="var-desc"><strong>Operating margin after tax</strong></span></div> <div class="var-row"><span class="var-name">Sales/Capital</span><span class="var-desc"><strong>Capital turnover</strong> (o asset turnover)</span></div> </div>
<div class="alert alert-blue mt10"> <i class="fa-solid fa-circle-info"></i> <span>Una compañía puede aumentar su ROIC <strong>mejorando el operating margin</strong> o <strong>aumentando el capital turnover</strong>. Descomponer el ROIC en estos dos drivers permite ver <strong>cuál de las dos palancas</strong> le está yendo mejor (o peor) a la compañía. Los analistas comparan el ROIC contra el required rate of return de los inversores — una tasa <strong>blended</strong> de deuda y equity. Si el ROIC supera esa tasa, la firma está <strong>agregando valor</strong> en el tiempo.</span> </div>

<div class="contrast-row mt10"> <div class="contrast-box" style="background:var(--purple-light);"> <div class="contrast-label" style="color:var(--purple);"><i class="fa-solid fa-cube"></i> NPV / IRR</div> <div style="font-size:12.5px;color:#4F46E5;line-height:1.6;"><strong>Project-specific</strong> — evalúan un proyecto individual, pero no son observables directamente por inversores externos.</div> </div> <div class="contrast-box" style="background:var(--teal-light);"> <div class="contrast-label" style="color:#57554F;"><i class="fa-solid fa-building"></i> ROIC</div> <div style="font-size:12.5px;color:#57554F;line-height:1.6;"><strong>Firm-wide</strong> — se basa en accounting data disponible para inversores externos. Es más relevante para ellos, porque típicamente no pueden invertir en proyectos individuales de la firma.</div> </div> </div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: calcular el ROIC de una compañía</span><span class="example-badge">Click para expandir</span></button>
<div class="example-body"> <div class="card-body mb6"><em>Una compañía reportó after-tax operating profit de 24,395 en 20X2. La información de sus activos y financiamiento se detalla abajo. Calculá el ROIC para 20X2. Si el required rate of return de los inversores es 10%, ¿debería considerarse una inversión en la compañía?</em></div>

<div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Aunque la compañía es <strong>profitable</strong> (after-tax operating profit positivo), su ROIC (8.73%) está <strong>por debajo</strong> del required rate of return (10%) — el inversor <strong>no debería</strong> considerar una inversión en la compañía en base a los resultados de 20X2.</span> </div>
</div> </div>

<div class="card" id="c5-b7b"> <div class="card-title"><i class="fa-solid fa-thumbs-up c-accent"></i> Beneficios del ROIC</div>
<div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Data</div> No requiere información interna de la firma para calcularse — a diferencia del NPV o el IRR de un proyecto específico, que sí la necesitan. </div> </div>
<div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Capital</div> Considera explícitamente el capital necesario para generar el retorno. Al descomponerse en <strong>profit margin</strong> y <strong>asset turnover</strong>, permite ver cuál de las dos palancas le está yendo mejor (o peor) a la compañía. </div> </div>
<div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">3</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Comparación con el WACC</div> El ROIC mira tanto a la inversión de deuda como de equity, por lo que debe compararse contra el <strong>WACC</strong> (weighted average cost of capital) — la tasa blended de ambas fuentes. <strong>ROIC &gt; WACC</strong> es deseable; <strong>ROIC &lt; WACC</strong> requiere mejoras operativas (por ejemplo, mejorar el profit margin o el turnover).
<div style="margin-top:8px;">Es la misma lógica de comparar un retorno contra su costo, pero mirando a la <strong>empresa o al negocio en operación</strong>:</div>
<div class="ex-table mt8"> <div class="ex-row"><span class="ex-label">ROIC</span><span class="ex-val">Return generated on invested capital: lo que <strong>rinde</strong> el capital invertido.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">WACC</span><span class="ex-val fw400">Cost of that invested capital: lo que <strong>cuesta</strong> ese capital.</span></div> </div>
<div class="fbox">ROIC &gt; WACC</div>
<div style="margin-top:8px;">Significa que la empresa está generando <strong>más</strong> con el capital de lo que ese capital <strong>cuesta</strong>.</div> </div> </div>
</div>

<div class="card" id="c5-b7c"> <div class="card-title"><i class="fa-solid fa-triangle-exclamation c-accent"></i> Limitaciones del ROIC</div>
<div class="reason-box" style="background:var(--blue-light);"> <span class="reason-num c-blue">1</span> <div class="reason-body" style="color:#57554F;"> <div class="reason-title">Es una accounting-based measure (accruals)</div> Los <strong>accruals</strong> rompen el vínculo directo entre el cash y el momento en que se reconocen revenues y expenses: un expense se registra en el período al que económicamente pertenece, aunque el efectivo <strong>todavía no se haya pagado</strong> (o se sepa que va a pagarse pronto) — es decir, cada partida se ubica donde <strong>creemos que corresponde</strong>, no cuando el cash efectivamente entra o sale. Esto puede generar diferencias significativas entre el <strong>operating profit</strong> y el <strong>operating cash flow</strong>, y también entre compañías que aplican criterios de accrual distintos — por lo que el ROIC puede <strong>no ser comparable</strong> entre firmas. </div> </div>
<div class="reason-box" style="background:var(--green-light);"> <span class="reason-num c-green">2</span> <div class="reason-body" style="color:#3F7A5C;"> <div class="reason-title">Es historical</div> El ROIC solo mira hacia <strong>atrás</strong> y puede estar sujeto a una <strong>volatilidad anual alta</strong>. </div> </div>
<div class="reason-box" style="background:var(--purple-light);margin-bottom:0;"> <span class="reason-num c-purple">3</span> <div class="reason-body" style="color:#4F46E5;"> <div class="reason-title">Está highly aggregated</div> Al mirar a <strong>toda la compañía</strong> de una vez, el ROIC puede <strong>esconder</strong> segmentos de negocio rentables o no rentables — no se ven las <strong>partes individuales</strong> del negocio. </div> </div>
</div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 24.1</div> <div class="card bt-accent" id="c5-formulas"> <div class="card-title"><i class="fa-solid fa-square-root-variable c-accent"></i> Fórmulas del capítulo</div>

<div class="subsection-label">Net Present Value</div>
<div class="fbox">NPV = CF₀ + Σ CFₜ/(1+k)ᵗ , t = 1...n</div>
<div class="card-body mt8" style="font-size:12px;">Aceptar si NPV &gt; 0 (proyectos independientes). k = required rate of return / cost of capital ajustado por riesgo.</div>

<div class="subsection-label mt10">Internal Rate of Return</div>
<div class="fbox">0 = CF₀ + Σ CFₜ/(1+IRR)ᵗ</div>
<div class="card-body mt8" style="font-size:12px;">Aceptar si IRR &gt; required rate of return (hurdle rate).</div>

<div class="subsection-label mt10">Return on Invested Capital</div>
<div class="fbox">ROIC = NOPAT / Average book value of total capital = (NOPAT/Sales) × (Sales/Avg. Invested Capital)</div>
<div class="card-body mt8" style="font-size:12px;">NOPAT = Net income + After-tax interest expense. Comparar contra el required rate of return blended de deuda y equity.</div>
</div>
