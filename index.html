<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F7F8">
<title>CFA Level I — Corporate Issuers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
<script>
  // Fallback: si el navegador no soporta bien el preload swap, forzar el stylesheet igual tras 2s
  setTimeout(function() {
    if (!document.querySelector('link[rel="stylesheet"][href*="font-awesome"]')) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css';
      document.head.appendChild(l);
    }
  }, 2000);
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --border: #E8E6E3;
    --border-light: #F1EFEC;
    --text: #2B2A27;
    --text-sec: #6F6D68;
    --text-ter: #A6A39C;

    /* Un solo acento de marca */
    --accent: #4F46E5;
    --accent-light: #EFEEFC;
    --accent-mid: #C9C6F5;

    /* Solo 3 colores semánticos, usados con moderación */
    --green: #3F7A5C;
    --green-light: #EEF5F0;
    --amber: #A16A0A;
    --amber-light: #FBF3E6;
    --red: #AE5038;
    --red-light: #FBEEEA;

    /* Blue / purple / teal ya no son colores propios: se resuelven
       al mismo neutro que el resto del texto, para que ningún card
       "compita" por atención sin motivo semántico. */
    --blue: var(--text-sec);
    --blue-light: var(--border-light);
    --purple: var(--text-sec);
    --purple-light: var(--border-light);
    --teal: var(--text-sec);
    --teal-light: var(--border-light);

    --mono: 'SF Mono', 'Fira Code', ui-monospace, 'Cascadia Code', monospace;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 10px 28px rgba(0,0,0,.08);
  }

  html { background: var(--bg); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; font-size: 15px; -webkit-font-smoothing: antialiased; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 264px; min-width: 264px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden; transition: width .25s ease;
  }
  .sidebar-header {
    padding: 22px 18px 14px;
    border-bottom: 1px solid var(--border-light);
  }
  .sidebar-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .logo-badge {
    background: var(--accent); color: white; font-size: 10px; font-weight: 700;
    padding: 3px 7px; border-radius: 5px; letter-spacing: .04em;
  }
  .logo-text { font-size: 13px; font-weight: 600; color: var(--text); }
  .sidebar-sub { font-size: 12px; color: var(--text-ter); margin-top: 2px; }

  /* ── SEARCH ── */
  .search-wrap { padding: 12px 14px; border-bottom: 1px solid var(--border-light); }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 7px 10px;
    transition: border-color .15s;
  }
  .search-box:focus-within { border-color: var(--accent); background: var(--surface); }
  .search-box i { color: var(--text-ter); font-size: 12px; }
  .search-box input {
    border: none; background: transparent; font-family: var(--sans);
    font-size: 12.5px; color: var(--text); outline: none; width: 100%;
  }
  .search-box input::placeholder { color: var(--text-ter); }
  .search-clear { background: none; border: none; cursor: pointer; color: var(--text-ter); font-size: 11px; padding: 0; display: none; }
  .search-clear:hover { color: var(--text); }

  /* ── SEARCH OVERLAY ── */
  #searchOverlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(43,42,39,.32); backdrop-filter: blur(2px);
    align-items: flex-start; justify-content: center; padding-top: 60px;
  }
  #searchOverlay.open { display: flex; }
  #searchModal {
    background: var(--surface); border-radius: var(--radius); width: 580px; max-width: 92vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden; max-height: 72vh; display: flex; flex-direction: column;
    border: 1px solid var(--border-light);
  }
  .search-modal-header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    border-bottom: 1px solid var(--border-light);
  }
  .search-modal-header i { color: var(--accent); font-size: 14px; }
  #searchInput {
    flex: 1; border: none; outline: none; font-family: var(--sans);
    font-size: 14px; color: var(--text); background: transparent;
  }
  #searchInput::placeholder { color: var(--text-ter); }
  .search-modal-close { background: none; border: none; cursor: pointer; color: var(--text-ter); font-size: 13px; padding: 4px; }
  .search-modal-close:hover { color: var(--text); }
  #searchResults { overflow-y: auto; padding: 8px 0; }
  #searchResults::-webkit-scrollbar { width: 4px; }
  #searchResults::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .search-result-item {
    padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border-light);
    transition: background .1s;
  }
  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--bg); }
  .sri-module { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .sri-text { font-size: 13px; color: var(--text); line-height: 1.5; }
  .sri-text mark { background: #F4E7B8; color: var(--text); border-radius: 2px; padding: 0 2px; }
  .search-jump-highlight {
    animation: searchJumpPulse 2.6s ease-out;
    position: relative;
    z-index: 1;
  }
  @keyframes searchJumpPulse {
    0%   { box-shadow: 0 0 0 4px var(--accent-mid); background-color: var(--accent-light); border-radius: var(--radius); }
    12%  { box-shadow: 0 0 0 4px var(--accent-mid); background-color: var(--accent-light); border-radius: var(--radius); }
    70%  { box-shadow: 0 0 0 4px var(--accent-mid); background-color: var(--accent-light); border-radius: var(--radius); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); background-color: transparent; border-radius: var(--radius); }
  }
  .search-empty { padding: 32px 16px; text-align: center; font-size: 13px; color: var(--text-ter); }
  .search-count { padding: 6px 16px; font-size: 11px; color: var(--text-ter); border-bottom: 1px solid var(--border-light); }

  .nav-tree { flex: 1; overflow-y: auto; padding: 10px 0 16px; }
  .nav-tree::-webkit-scrollbar { width: 4px; }
  .nav-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .nav-section { margin-bottom: 2px; }
  .nav-section-btn {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 8px 18px; background: none; border: none; cursor: pointer;
    font-family: var(--sans); font-size: 11.5px; font-weight: 600;
    color: var(--text-sec); text-transform: uppercase; letter-spacing: .07em;
    transition: color .15s;
  }
  .nav-section-btn:hover { color: var(--text); }
  .nav-section-btn .chevron { margin-left: auto; font-size: 10px; transition: transform .2s; color: var(--text-ter); }
  .nav-section-btn.open .chevron { transform: rotate(90deg); }

  .nav-module { display: none; }
  .nav-module.open { display: block; }

  .nav-module-btn {
    width: 100%; display: flex; align-items: center; gap: 9px;
    padding: 7px 18px 7px 30px; background: none; border: none; cursor: pointer;
    font-family: var(--sans); font-size: 13px; color: var(--text-sec);
    transition: color .15s, background .15s; text-align: left; line-height: 1.4;
    border-radius: var(--radius-sm);
  }
  .nav-module-btn:hover { color: var(--text); background: var(--bg); }
  .nav-module-btn.active { color: var(--accent); background: var(--accent-light); font-weight: 600; }
  .nav-module-btn .mod-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--border);
    min-width: 5px; transition: background .15s;
  }
  .nav-module-btn.active .mod-dot { background: var(--accent); }

  /* ── MAIN ── */
  #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .topbar {
    position: sticky; top: 0; z-index: 10; background: rgba(250,250,249,.9);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    padding: 14px 40px; display: flex; align-items: center; gap: 12px;
  }
  .breadcrumb { font-size: 12.5px; color: var(--text-ter); display: flex; align-items: center; gap: 6px; }
  .breadcrumb span { color: var(--text-sec); }
  .breadcrumb .current { color: var(--text); font-weight: 500; }

  .content { padding: 40px; max-width: 820px; }

  /* ── CARDS & COMPONENTS ── */
  .page-title { font-size: 24px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 6px; }
  .page-sub { font-size: 13.5px; color: var(--text-sec); margin-bottom: 32px; }
  .los-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-light); color: var(--accent);
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
    margin-bottom: 18px;
  }

  .section-label {
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); margin: 40px 0 18px; padding-left: 12px;
    border-left: 2px solid var(--accent);
    display: flex; align-items: center; gap: 8px; line-height: 1.3;
  }

  .subsection-label {
    font-size: 13px; font-weight: 650; letter-spacing: .01em;
    color: var(--text); margin: 26px 0 12px; padding: 0 0 6px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; line-height: 1.3;
  }
  .subsection-label i { color: var(--text-ter); font-size: 12px; }
  .subsection-label:first-of-type { margin-top: 8px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 24px; margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 14.5px; font-weight: 650; margin-bottom: 8px; color: var(--text);
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  }
  .card-title i { color: var(--text-ter); font-size: 13px; }
  .card-body { font-size: 13.5px; color: var(--text-sec); line-height: 1.72; }
  .card-body strong { color: var(--text); font-weight: 600; }

  .tag {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: 20px; letter-spacing: .03em;
    background: var(--border-light); color: var(--text-sec);
  }
  .tag-purple, .tag-green, .tag-amber, .tag-red, .tag-blue, .tag-teal, .tag-accent {
    background: var(--accent-light); color: var(--accent);
  }

  .fbox {
    background: var(--bg); border: 1px solid var(--border-light);
    border-radius: var(--radius-sm); padding: 12px 15px; margin-top: 10px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.9; color: var(--text);
  }
  .frac { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; margin: 2px 5px; line-height: 1.3; }
  .frac-num { padding: 0 4px 3px; border-bottom: 1.3px solid currentColor; text-align: center; white-space: nowrap; }
  .frac-den { padding: 3px 4px 0; text-align: center; white-space: nowrap; }
  .sqrt { display: inline-flex; align-items: flex-start; }
  .sqrt-radical { font-size: 1.2em; line-height: 1; margin-right: 2px; position: relative; top: -1px; }
  .sqrt-content { border-top: 1.3px solid currentColor; padding: 1px 3px 0; white-space: nowrap; }
  .fbox-eq { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; margin-bottom: 12px; align-items: start; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 12px; align-items: start; }

  /* Todas las "cajas" de nota (alert, reason-box, interp-box, highlight-box)
     comparten una sola gramática visual: fondo tenue, radio consistente,
     sin bordes gruesos de color salvo cuando el color tiene un significado real. */
  .alert {
    border-radius: var(--radius-sm); padding: 11px 14px; margin-top: 10px;
    font-size: 13px; line-height: 1.65; display: flex; gap: 9px; align-items: flex-start;
    background: var(--bg); color: var(--text-sec);
  }
  .alert i { margin-top: 2px; font-size: 12px; color: var(--text-ter); }
  .alert strong { color: var(--text); }
  .example-block { margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); }
  .example-toggle { width: 100%; display: flex; align-items: center; gap: 9px; padding: 11px 14px; background: transparent; border: none; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text); text-align: left; font-family: inherit; }
  .example-toggle:hover { background: var(--border-light); }
  .example-toggle .example-chevron { transition: transform .2s ease; font-size: 10px; color: var(--text-sec); flex-shrink: 0; }
  .example-toggle.open .example-chevron { transform: rotate(90deg); }
  .example-toggle .example-badge { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--text-sec); background: var(--border-light); padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
  .example-toggle.open .example-badge { display: none; }
  .example-body { display: none; padding: 15px 16px 17px; border-top: 1px solid var(--border); background: var(--card-bg, #fff); }
  .example-body.example-open { display: block; }
  .alert-red    { background: var(--red-light);    color: var(--red); }
  .alert-blue   { background: var(--bg);           color: var(--text-sec); }
  .alert-green  { background: var(--green-light);  color: var(--green); }
  .alert-purple { background: var(--bg);           color: var(--text-sec); }
  .alert-amber  { background: var(--amber-light);  color: var(--amber); }

  .ex-table { width: 100%; margin-top: 10px; display: grid; grid-template-columns: minmax(90px, 40%) 1fr; column-gap: 18px; align-items: stretch; font-size: 13.5px; }
  .ex-row { display: contents; }
  .ex-row > .ex-label { padding: 7px 0; border-bottom: 1px solid var(--border-light); color: var(--text-sec); font-weight: 600; }
  .ex-row > .ex-val { padding: 7px 0; border-bottom: 1px solid var(--border-light); }
  .ex-row:last-child > .ex-label, .ex-row:last-child > .ex-val { border-bottom: none; font-weight: 600; color: var(--text); }
  .ex-label { color: var(--text-sec); }
  .ex-val { font-family: var(--sans); color: var(--text-sec); line-height: 1.6; }

  .reason-box {
    border-radius: var(--radius-sm); padding: 13px 15px; margin-top: 8px;
    display: flex; gap: 13px; align-items: flex-start;
    background: var(--bg) !important;
  }
  .reason-num { font-size: 18px; font-weight: 700; line-height: 1; min-width: 22px; color: var(--accent) !important; }
  .reason-body { font-size: 13.5px; line-height: 1.65; color: var(--text-sec) !important; }
  .reason-title { font-weight: 650; margin-bottom: 3px; color: var(--text); }

  .stack { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .stack-row {
    border-radius: var(--radius-sm); padding: 9px 13px; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg);
  }

  .var-table { margin-top: 10px; }
  .var-row { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border-light); }
  .var-row:last-child { border-bottom: none; }
  .var-name { font-family: var(--mono); font-weight: 700; font-size: 13px; min-width: 40px; color: var(--text); padding-top: 1px; }
  .var-desc { font-size: 13.5px; color: var(--text-sec); line-height: 1.6; }
  .var-desc strong { color: var(--text); }

  .premium-row { display: flex; gap: 9px; margin: 7px 0; align-items: flex-start; }
  .premium-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; margin-top: 1px; background: var(--accent-light); color: var(--accent); }
  .premium-desc { font-size: 13.5px; color: var(--text-sec); line-height: 1.6; }
  .premium-desc strong { color: var(--text); }

  /* ── CONTRAST BOXES ── */
  .contrast-row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .contrast-box { flex: 1; min-width: 200px; border-radius: var(--radius-sm); padding: 13px 15px; background: var(--bg) !important; }
  .contrast-label { font-size: 11.5px; font-weight: 650; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; color: var(--text) !important; }

  /* ── SLIDER CALC ── */
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .slider-row label { font-size: 12px; color: var(--text-sec); min-width: 140px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider-row span { font-size: 12px; font-weight: 600; min-width: 55px; text-align: right; color: var(--text); }
  .calc-results { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-light); }

  /* ── HOME ── */
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; margin-top: 24px; }
  .home-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; cursor: pointer; transition: box-shadow .15s, border-color .15s, transform .15s;
    box-shadow: var(--shadow);
  }
  .home-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent-mid); transform: translateY(-1px); }
  .home-card-icon { font-size: 20px; margin-bottom: 12px; }
  .home-card-title { font-size: 14.5px; font-weight: 650; margin-bottom: 4px; }
  .home-card-sub { font-size: 12.5px; color: var(--text-sec); }
  .home-card-count { font-size: 11.5px; color: var(--text-ter); margin-top: 10px; }

  .progress-bar-wrap { background: var(--border-light); border-radius: 4px; height: 4px; margin-top: 8px; }
  .progress-bar { background: var(--accent); height: 4px; border-radius: 4px; }

  /* ── INTERP BOX ── */
  .interp-box { border-radius: var(--radius-sm); padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 7px; background: var(--bg); }
  .interp-num { font-size: 14px; font-weight: 700; line-height: 1.6; min-width: 20px; color: var(--accent); }
  .interp-body { font-size: 13.5px; line-height: 1.6; color: var(--text-sec); }
  .interp-title { font-weight: 650; margin-bottom: 2px; color: var(--text); }

  hr.div { border: none; border-top: 1px solid var(--border-light); margin: 8px 0 0; }

  .highlight-box {
    border-radius: var(--radius-sm); padding: 11px 14px; margin-top: 10px;
    font-size: 12.5px; line-height: 1.7; background: var(--bg); color: var(--text-sec);
  }

  /* Tablas: números alineados sin cambiar de tipografía */
  table td, table th { font-variant-numeric: tabular-nums; }

  /* ── MOBILE / RESPONSIVE ── */
  .menu-toggle {
    display: none; background: none; border: none; cursor: pointer;
    font-size: 16px; color: var(--text); padding: 4px 6px; margin-right: 2px;
  }
  #sidebarBackdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4);
    z-index: 150;
  }
  @media (max-width: 860px) {
    body { overflow: hidden; }
    .menu-toggle { display: inline-flex; align-items: center; }
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; z-index: 200;
      transform: translateX(-100%); transition: transform .25s ease;
      width: 82vw; min-width: 82vw; max-width: 320px; box-shadow: 2px 0 24px rgba(0,0,0,.15);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebarBackdrop.open { display: block; }
    #main { width: 100%; min-width: 0; }
    .content { padding: 20px; max-width: 100%; }
    .topbar { padding: 10px 16px; }
    .breadcrumb { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-title { font-size: 20px; }
    .grid2, .grid3, .home-grid { grid-template-columns: 1fr !important; }
    table { font-size: 11.5px; }
    [style*="overflow-x:auto"] { -webkit-overflow-scrolling: touch; position: relative; }
    [style*="overflow-x:auto"]::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 22px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.95));
      pointer-events: none;
    }
