<div class="card bt-accent mt10" id="c5-glossary"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">4 tipos de capital investments</span><span class="ex-val">Going concern, regulatory/compliance, expansion, other — de menor a mayor complejidad de análisis</span></div> <div class="ex-row"><span class="ex-label">Match funding approach</span><span class="ex-val">Financiar un proyecto con fuentes de capital cuya duración calza con la vida del proyecto</span></div> <div class="ex-row"><span class="ex-label">4 pasos del capital allocation</span><span class="ex-val">Idea generation → analizar proposals → armar el capital budget → monitorear y post-audit</span></div> <div class="ex-row"><span class="ex-label">NPV</span><span class="ex-val">Valor presente de los cash flows incrementales; aceptar si NPV &gt; 0</span></div> <div class="ex-row"><span class="ex-label">IRR</span><span class="ex-val">Tasa que hace NPV = 0; aceptar si IRR &gt; required rate of return (hurdle rate)</span></div> <div class="ex-row"><span class="ex-label">Conventional vs. unconventional cash flows</span><span class="ex-val">Un solo cambio de signo vs. múltiples cambios de signo (o intervalos de tiempo desiguales) → posibles múltiples IRR</span></div> <div class="ex-row"><span class="ex-label">NPV vs. IRR: supuesto de reinversión</span><span class="ex-val">NPV reinvierte al required rate of return (más realista); IRR reinvierte al propio IRR</span></div> <div class="ex-row"><span class="ex-label">ROIC</span><span class="ex-val">NOPAT / average book value of total capital; firm-wide, no project-specific</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">3 concerns de ROIC</span><span class="ex-val fw400">No comparable entre firmas, backward-looking/volátil, puede esconder proyectos malos dentro del promedio</span></div> </div> </div></div>`;}

function pageC6() { return `<div class="module-theme module-c6"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 24.c, 24.d</div> <div class="page-title">Module 24.2: Capital Allocation Principles and Real Options</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 24: Capital Investments and Project Measures</div>

<div class="card bt-accent" id="c6-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">El Module 24.1 explicó <strong>cómo medir</strong> un proyecto (NPV, IRR, ROIC). Este módulo cubre lo que va <strong>alrededor</strong>: los <strong>3 principios</strong> del capital allocation, los <strong>errores comunes</strong> de los managers (cognitive errors y behavioral biases) y las <strong>real options</strong>, con sus <strong>5 tipos</strong> y cómo valuarlas.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-list-check" style="margin-right:6px;color:var(--accent)"></i>LOS 24.c — Principios de capital allocation y errores comunes</div>

<div class="card" id="c6-a1"> <div class="card-title"><i class="fa-solid fa-list-check c-accent"></i> Los 3 principios del capital allocation</div>

<div class="reason-box"> <span class="reason-num">1</span> <div class="reason-body"> <div class="reason-title">After-tax cash flows, no accounting income</div> Para decidir si un proyecto crea valor, no mires la utilidad contable: mirá los <strong>cash flows reales que quedan después de impuestos</strong>. El accounting income usa <strong>accruals</strong> (registra ingresos y costos cuando ocurren, no cuando la plata entra o sale), así que no muestra <strong>cuándo</strong> se mueve el cash. Además, lo que vale es lo que la firma <strong>se queda</strong> tras los impuestos, y eso incluye los <strong>ahorros fiscales</strong> de depreciation y amortization (deducciones no monetarias que igual reducen el impuesto a pagar). </div> </div>

<div class="reason-box" id="c6-a1-inc"> <span class="reason-num">2</span> <div class="reason-body"> <div class="reason-title">Solo incremental cash flows</div> Cuentan solo los cash flows que <strong>cambian si se hace el proyecto</strong>. Qué entra y qué no:
<div class="ex-table mt8"> <div class="ex-row"><span class="ex-label">Sunk cost (se excluye)</span><span class="ex-val">Costo que <strong>no se evita</strong> aunque no se haga el proyecto (ej. fee de market research ya pagado).</span></div> <div class="ex-row"><span class="ex-label">Cannibalization (se incluye, negativo)</span><span class="ex-val">El proyecto <strong>reemplaza ventas</strong> de un producto existente (ej. versión diet de una gaseosa).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Positive externality (se incluye, positivo)</span><span class="ex-val fw400">El proyecto tiene un efecto <strong>positivo</strong> en las ventas de otras líneas de la firma.</span></div> </div> </div> </div>

<div class="reason-box"> <span class="reason-num">3</span> <div class="reason-body"> <div class="reason-title">El timing importa</div> Se aplica el <strong>time value of money</strong>: un cash flow que llega antes vale más que uno que llega después. </div> </div> </div>

<div class="card" id="c6-a2"> <div class="card-title"><i class="fa-solid fa-triangle-exclamation c-accent"></i> Errores comunes al evaluar proyectos</div>

<div id="c6-a2-cog" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:8px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Cognitive errors (errores de cálculo)</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Poor forecasting</span><span class="ex-val">Hacer malas estimaciones de los cash flows futuros. Ej.: subestimar costos, repartir mal los <strong>overhead costs</strong> o no anticipar que un <strong>competidor</strong> va a reaccionar bajando precios.</span></div> <div class="ex-row"><span class="ex-label">Ignorar el costo de fondos internos</span><span class="ex-val">Pensar que usar <strong>retained earnings</strong> es &quot;gratis&quot; porque la plata ya está dentro de la empresa. No lo es: esos fondos pertenecen económicamente a los accionistas y podrían haberse repartido como dividendos. Por eso tienen un <strong>opportunity cost</strong>: el <strong>cost of equity</strong>. <strong>Señal de alerta:</strong> firmas reacias a pagar dividendos pueden estar usando retained earnings en proyectos malos.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Inflación mal tratada</span><span class="ex-val fw400">Mezclar cash flows reales con una discount rate nominal, o viceversa. Tienen que ser consistentes: <strong>Real CF → real discount rate</strong> y <strong>Nominal CF → nominal discount rate</strong>.</span></div> </div>

<div id="c6-a2-beh" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Behavioral biases (errores de juicio)</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Pet projects</span><span class="ex-val">Proyectos &quot;favoritos&quot; de algún gerente senior. Como tienen respaldo personal, pueden recibir proyecciones <strong>demasiado optimistas</strong> o menos cuestionamiento del que corresponde.</span></div> <div class="ex-row"><span class="ex-label">Inertia en el capital budget</span><span class="ex-val">Usar el presupuesto de inversión del año anterior como referencia automática (<strong>anchoring</strong>). El error es no ajustar el monto según las oportunidades actuales de <strong>NPV positivo</strong>. <strong>Señal para el analista:</strong> budgets estáticos o crecientes con retornos en caída.</span></div> <div class="ex-row"><span class="ex-label">Decidir por EPS o ROE</span><span class="ex-val">Rechazar proyectos con <strong>NPV positivo</strong> porque podrían reducir temporalmente el EPS o el ROE, especialmente si la compensación del management depende de esas métricas.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">No generar ideas alternativas</span><span class="ex-val fw400">Aceptar la primera opción que parece suficientemente buena, en vez de comparar otras alternativas que podrían crear más valor.</span></div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-code-branch" style="margin-right:6px;color:var(--accent)"></i>LOS 24.d — Real options en capital investments</div>

<div class="card" id="c6-b1"> <div class="card-title"><i class="fa-solid fa-sitemap c-accent"></i> Real options: qué son y tipos</div> <div class="card-body">Son <strong>acciones futuras</strong> que una firma puede tomar <strong>porque invirtió hoy</strong>: cursos de acción alternativos que solo surgen por haber hecho el proyecto (ej. expandirse a otros mercados si le va muy bien). Como las opciones financieras, dan <strong>derecho, no obligación</strong>, y <strong>nunca valen menos que cero</strong>: si no conviene, no se ejercen. Su valor puede <strong>aumentar el NPV</strong>.</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Timing options</span><span class="ex-val"><strong>Demorar</strong> la inversión para tener <strong>mejor información</strong>: se invierte <strong>por etapas</strong> (más caro, pero se responde al mercado, ej. a un competidor).</span></div> <div class="ex-row"><span class="ex-label">Abandonment options</span><span class="ex-val"><strong>Abandonar</strong> si el PV de salir supera el PV de continuar.</span></div> <div class="ex-row"><span class="ex-label">Expansion (growth) options</span><span class="ex-val"><strong>Invertir más</strong> en proyectos futuros si crean valor.</span></div> <div class="ex-row"><span class="ex-label">Flexibility options</span><span class="ex-val">Opciones sobre <strong>aspectos operativos</strong>, de dos formas:<br><strong>Price-setting:</strong> cambiar el precio (ej. subirlo si la demanda es alta, sin aumentar la producción).<br><strong>Production-flexibility:</strong> ajustar cómo se produce: overtime, otros materiales, otra variedad de producto (ej. automotriz que invierte más al inicio para producir distintos tipos de motor).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Fundamental options</span><span class="ex-val fw400">El <strong>proyecto en sí</strong> es la opción: su payoff depende del precio de un <strong>underlying asset</strong> fuera del control de la firma (ej. commodities). Ej.: una mina de cobre, que se abre con cobre caro y se cierra con cobre barato.</span></div> </div> </div>

<div class="card" id="c6-b2"> <div class="card-title"><i class="fa-solid fa-calculator c-accent"></i> Cómo valuar real options</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-eye-slash"></i> Ignorar las opciones</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Si el NPV <strong>sin</strong> opciones ya es <strong>positivo</strong>, se emprende: es el <strong>retorno mínimo</strong>.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-plus"></i> Incluirlas en el NPV</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Sumar el <strong>valor de la opción</strong> al NPV, restando su <strong>costo</strong>.</div> </div> </div>

<div class="fbox">NPV (con real options) = NPV (sin opciones) − Costo de la opción + Valor de la opción</div>

<div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Un NPV <strong>negativo</strong> sin opciones puede volverse <strong>positivo</strong> al incluirlas (ver ejemplo).</span> </div>

<div id="c6-b2-tools" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Decision trees y option pricing models</div>

<div class="card-body mt10">Se usan con <strong>decisiones futuras secuenciales</strong> y resultados alternativos; el NPV sale de las <strong>probabilidades</strong> y el <strong>timing esperado</strong> de cada resultado.</div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: Gerhardt Corporation, outlay de €500 millones</span><span class="example-badge">Click para expandir</span></button>

<div class="example-body" id="c6-b2-ex"> <div class="card-body mb6"><em>Gerhardt evalúa un outlay de €500m. En t = 1: 60% de éxito (retorno €750m) y 40% de falla (retorno 0). Si falla, en t = 2: 30% de producto alternativo (€600m), 30% de venta a otra firma (€400m) y 40% de abandono (0). Calculá el NPV sin y con real options, con una tasa de 10%.</em></div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">1) NPV sin opciones</span><span class="ex-val">−500 + (0.6 × 750 + 0.4 × 0) / 1.10 = <strong>−€90.91m</strong> → no se emprendería</span></div> <div class="ex-row"><span class="ex-label">2) Valor de la real option</span><span class="ex-val">[(0.4 × 0.3 × 600) + (0.4 × 0.3 × 400) + (0.4 × 0.4 × 0)] / 1.10<sup>2</sup> = <strong>+€99.17m</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">NPV con real options</span><span class="ex-val fw400">−90.91 + 99.17 = <strong>+€8.26m</strong></span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>NPV con real options = <strong>+€8.26m &gt; 0</strong> → <strong>conviene emprender</strong>. Sin la opción se habría rechazado.</span> </div> <div class="card-body mt8"><strong>Probabilidades:</strong> el 0.4 es llegar a t = 2 (falla en t = 1); el 0.3, 0.3 y 0.4 son las probabilidades de cada alternativa en t = 2. Se descuentan dos períodos (1.10<sup>2</sup>). No hay costo de la opción para restar.</div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 24.2</div> <div class="card bt-accent" id="c6-glossary"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">3 principios</span><span class="ex-val">After-tax cash flows, solo incrementales, timing (time value of money)</span></div> <div class="ex-row"><span class="ex-label">Sunk cost, cannibalization, externality</span><span class="ex-val">Sunk cost: no se evita, se excluye. Cannibalization: reemplaza ventas existentes (negativo). Positive externality: efecto positivo en otras líneas</span></div> <div class="ex-row"><span class="ex-label">Cognitive errors</span><span class="ex-val">Poor forecasting, costo de fondos internos ignorado (= cost of equity), inflación mal tratada</span></div> <div class="ex-row"><span class="ex-label">Behavioral biases</span><span class="ex-val">Pet projects, inertia en el budget, decidir por EPS/ROE, no generar ideas alternativas</span></div> <div class="ex-row"><span class="ex-label">Real options</span><span class="ex-val">Acciones futuras que habilita invertir hoy; derecho, no obligación; valor nunca negativo</span></div> <div class="ex-row"><span class="ex-label">5 tipos</span><span class="ex-val">Timing, abandonment, expansion, flexibility (price-setting, production-flexibility), fundamental (el proyecto es la opción)</span></div> <div class="ex-row"><span class="ex-label">NPV con real options</span><span class="ex-val">NPV sin opciones − costo + valor de la opción (decision trees u option pricing models). Si el NPV sin opciones ya es positivo, se emprende</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Ejemplo Gerhardt</span><span class="ex-val fw400">−€90.91m + €99.17m = +€8.26m → se emprende</span></div> </div> </div></div>`;}

function pageC7() { return `<div class="module-theme module-c7"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 25.a, 25.b</div> <div class="page-title">Module 25.1: Weighted-Average Cost of Capital</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 25: Capital Structure</div>

<div class="card bt-accent" id="c7-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">Este módulo abre el tema de <strong>capital structure</strong>: cómo se financia una firma con deuda y equity, y cuánto le cuesta. La <strong>LOS 25.a</strong> enseña a calcular el <strong>WACC</strong> — la tasa <strong>blended</strong> de deuda y equity, con la deuda ajustada por impuestos — y qué <strong>pesos</strong> usar (target o market value). La <strong>LOS 25.b</strong> explica <strong>qué factores</strong> determinan cuánta deuda puede sostener una firma: los <strong>internos</strong> (características del negocio, ciclo de vida, deuda existente, tasa impositiva) y los <strong>externos</strong> (mercado, regulación, normas de la industria), más los <strong>factores top-down</strong> (macro) que mueven el benchmark rate y los credit spreads.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-calculator" style="margin-right:6px;color:var(--accent)"></i>LOS 25.a — Cálculo e interpretación del WACC</div>

<div class="card" id="c7-a1"> <div class="card-title"><i class="fa-solid fa-calculator c-accent"></i> WACC: qué es y cómo se calcula</div> <div class="card-body">El <strong>weighted-average cost of capital (WACC)</strong> combina el costo de la deuda y el costo del equity en una sola tasa <strong>blended</strong>. El <strong>cost of capital</strong> de cada fuente es el <strong>required rate of return</strong> que exigen quienes la financian: los shareholders (equity) y los lenders, o sea bancos y bondholders (deuda). El WACC es el <strong>promedio ponderado del costo de todas las fuentes de financiamiento</strong>.</div>

<div class="fbox">WACC = [weight of debt × pretax cost of debt × (1 − tax rate)] + (weight of equity × cost of equity)<br>Forma general: WACC = Σ (r<sub>i</sub> × w<sub>i</sub>), con r<sub>d</sub> ya after-tax: r<sub>d</sub> × (1 − t)</div>

<div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span>Cada fuente aporta su <strong>r × w</strong>. Con deuda y equity son dos términos; si la firma tiene otra fuente, como <strong>preferred shares</strong>, se suma un término más.</span> </div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Weight of debt / weight of equity</span><span class="ex-val">Proporción de cada fuente en el financiamiento total de la firma. Entre las dos suman <strong>100%</strong>.</span></div> <div class="ex-row"><span class="ex-label">Pretax cost of debt</span><span class="ex-val">Tasa que paga la firma por su deuda, <strong>antes</strong> del efecto impositivo.</span></div> <div class="ex-row"><span class="ex-label">(1 − tax rate)</span><span class="ex-val">Ajuste que lleva el costo de la deuda a su valor <strong>after-tax</strong>. Se aplica <strong>solo a la deuda</strong>, no al equity.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Cost of equity</span><span class="ex-val fw400">Retorno que exigen los shareholders por invertir en la firma.</span></div> </div>

<div class="alert mt10"> <i class="fa-solid fa-link"></i> <span><strong>Cómo se usa:</strong> es el <strong>cost of capital</strong> que se usa en los cálculos de <strong>NPV</strong> (para descontar los cash flows, ajustado por el riesgo del proyecto) y de <strong>IRR</strong> (como hurdle rate), Module 24.1. También es la vara contra la que se compara el ROIC: <strong>ROIC &gt; WACC</strong> significa que la firma genera más con su capital de lo que ese capital cuesta.</span> </div> </div>

<div class="card" id="c7-a2"> <div class="card-title"><i class="fa-solid fa-scale-balanced c-accent"></i> Dos ideas detrás de la fórmula</div>

<div class="reason-box"> <span class="reason-num">1</span> <div class="reason-body"> <div class="reason-title">El costo de la deuda es menor que el del equity</div> Cada fuente tiene un riesgo distinto para quien la financia (ya visto en Module 21.1), y eso fija el retorno que exige:
<div class="ex-table mt8"> <div class="ex-row"><span class="ex-label">Deuda (r<sub>d</sub>)</span><span class="ex-val">Menos riesgosa para el lender: es un claim <strong>fijo y prioritario</strong>, y muchas veces está <strong>garantizada con collateral</strong>. Por eso el <strong>r<sub>d</sub> es menor</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Equity (r<sub>e</sub>)</span><span class="ex-val fw400">Más riesgoso para el inversor: es un claim <strong>residual y permanente</strong>. Por eso el <strong>r<sub>e</sub> es mayor</strong>.</span></div> </div>
<div style="margin-top:8px;">Para estimar el r<sub>d</sub>, el punto de partida son las tasas de endeudamiento <strong>existentes o recientes</strong> de <strong>peer companies</strong>.</div> </div> </div>

<div class="reason-box"> <span class="reason-num">2</span> <div class="reason-body"> <div class="reason-title">Por qué el costo de la deuda va after-tax</div> En la mayoría de las jurisdicciones el <strong>gasto por interés</strong> es <strong>deducible</strong> de impuestos, así que el costo efectivo de la deuda para la firma es <strong>menor</strong> que la tasa que paga. Por eso el pretax cost of debt se multiplica por <strong>(1 − tax rate)</strong>. </div> </div> </div>

<div class="card" id="c7-a3"> <div class="card-title"><i class="fa-solid fa-percent c-accent"></i> Pesos del WACC: target weights vs. market value weights</div> <div class="card-body">Los pesos de deuda y equity pueden ser de dos tipos:</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-bullseye"></i> Target weights</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">La estructura de capital <strong>objetivo</strong> de la firma. Los analistas suelen estimarla a partir de los <strong>book values</strong> de deuda y equity.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-chart-line"></i> Market value weights</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Reflejan las <strong>condiciones actuales del mercado</strong>, por eso son los apropiados para estimar el <strong>costo de oportunidad actual</strong> del capital.</div> </div> </div>

<div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>En los cálculos, los weights usualmente son market value</strong>, no los números del balance sheet (book value). Los book values que da el enunciado suelen ser un distractor.</span> </div>

<div id="c7-a3-mv" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Cómo se calculan los market value weights</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Market value del equity</span><span class="ex-val"><strong>Precio por acción × cantidad de shares</strong>. Si el precio cambia, cambia el peso.</span></div> <div class="ex-row"><span class="ex-label">Market value de la deuda</span><span class="ex-val">El <strong>market value de los bonds</strong>, no el monto contable del balance sheet.</span></div> <div class="ex-row"><span class="ex-label">Total capital</span><span class="ex-val">Suma de los market values de todas las fuentes.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Weight de cada fuente</span><span class="ex-val fw400">Market value de la fuente / total capital.</span></div> </div> </div>

<div class="card" id="c7-a4"> <div class="card-title"><i class="fa-solid fa-calculator c-accent"></i> Ejemplo: WACC de ABC, Inc.</div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: 50% deuda, 50% equity, tasa impositiva de 30%</span><span class="example-badge">Click para expandir</span></button>

<div class="example-body" id="c7-a4-ex"> <div class="card-body mb6"><em>La estructura de capital de ABC, Inc. es 50% deuda y 50% equity. Su cost of debt es 8%, su cost of equity es 11% y su tasa impositiva corporativa es 30%. Calculá el WACC de ABC.</em></div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">1) Costo de la deuda after-tax</span><span class="ex-val">8% × (1 − 0.30) = <strong>5.6%</strong></span></div> <div class="ex-row"><span class="ex-label">2) Aporte de cada fuente</span><span class="ex-val">Deuda: 0.50 × 5.6% = <strong>2.8%</strong><br>Equity: 0.50 × 11% = <strong>5.5%</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">WACC</span><span class="ex-val fw400">2.8% + 5.5% = <strong>8.3%</strong></span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>WACC = [0.50 × 0.08 × (1 − 0.30)] + (0.50 × 0.11) = 0.083, o <strong>8.3%</strong>. Es lo que, en promedio, le cuesta a ABC financiar sus activos.</span> </div> <div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Trampa frecuente:</strong> si te olvidás del (1 − tax rate) usás el 8% pretax y el resultado sale 0.50 × 8% + 0.50 × 11% = <strong>9.5%</strong>, que <strong>sobreestima</strong> el WACC.</span> </div> </div> </div>

<div class="card" id="c7-a5"> <div class="card-title"><i class="fa-solid fa-percent c-accent"></i> Ejemplo: qué pasa con el WACC si sube la tasa impositiva</div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver pregunta, opciones y respuesta</span><span class="example-badge">Click para expandir</span></button>

<div class="example-body" id="c7-a5-ex"> <div class="card-body mb6"><em>XYZ Corporation tiene una estructura de capital de 30% deuda y 70% equity, y el gasto por interés es deducible de impuestos. Los inversores en deuda exigen un retorno before-tax de 6% y los inversores en equity, 12%. Si la marginal corporate tax rate sube de 20% a 25%, el cambio en el WACC es <strong>closest to</strong>:</em></div> <div class="ex-table"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">−0.09%</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">0.09%</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">0.30%</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(A)</strong>.</span> </div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">WACC con t = 20%</span><span class="ex-val">(0.30 × 6%)(1 − 0.20) + (0.70 × 12%) = 1.44% + 8.40% = <strong>9.84%</strong></span></div> <div class="ex-row"><span class="ex-label">WACC con t = 25%</span><span class="ex-val">(0.30 × 6%)(1 − 0.25) + (0.70 × 12%) = 1.35% + 8.40% = <strong>9.75%</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Cambio</span><span class="ex-val fw400">9.75% − 9.84% = <strong>−0.09%</strong></span></div> </div> <div class="card-body mt8">Solo se mueve el <strong>componente de deuda</strong>: el costo after-tax pasa de 6% × 0.80 = 4.8% a 6% × 0.75 = 4.5%. El costo del equity no cambia.</div> <div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span>Sube la tasa y <strong>baja</strong> el WACC por el <strong>beneficio fiscal</strong> del interés deducible: cada peso de interés ahorra más impuesto. Ojo: la firma igual va a pagar <strong>más impuestos</strong> en total. Lo único que baja es el costo after-tax de la deuda.</span> </div> </div> </div>

<div class="card" id="c7-a6"> <div class="card-title"><i class="fa-solid fa-chart-line c-accent"></i> Ejemplo: WACC con market value weights cuando sube el precio de la acción</div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: bonds de $400,000 y 40,000 shares que suben a $25</span><span class="example-badge">Click para expandir</span></button>

<div class="example-body" id="c7-a6-ex"> <div class="card-body mb6"><em>El balance sheet de una compañía muestra $400,000 en bonds y $600,000 en common shares (40,000 shares); total liabilities y equity: $1,000,000. El precio actual de la acción es $20, el retorno before-tax requerido de la deuda es 5% y el retorno requerido del equity es 10%. Calculá el WACC si el precio sube a $25 y la tasa impositiva relevante es 20%.</em></div>

<div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Distractores:</strong> los $600,000 del balance (book value) y el precio viejo de $20 <strong>no se usan</strong>. Hay que recalcular el market value del equity con el precio nuevo y sacar los pesos de ahí.</span> </div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">1) Market value del equity</span><span class="ex-val">$25 × 40,000 shares = <strong>$1,000,000</strong></span></div> <div class="ex-row"><span class="ex-label">2) Market value de la deuda</span><span class="ex-val"><strong>$400,000</strong> (el enunciado no da otro valor para los bonds)</span></div> <div class="ex-row"><span class="ex-label">3) Total capital</span><span class="ex-val">$400,000 + $1,000,000 = <strong>$1,400,000</strong></span></div> <div class="ex-row"><span class="ex-label">4) Market value weights</span><span class="ex-val">Deuda: 400,000 / 1,400,000 = <strong>0.29</strong><br>Equity: 1,000,000 / 1,400,000 = <strong>0.71</strong></span></div> <div class="ex-row bd-none"><span class="ex-label fw400">5) WACC</span><span class="ex-val fw400">(0.29)(5%)(1 − 0.20) + (0.71)(10%) = 1.16% + 7.10% = <strong>8.26%</strong></span></div> </div>

<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>WACC = <strong>8.26%</strong>. Con los pesos sin redondear (0.2857 y 0.7143) da 8.29%: la diferencia es solo redondeo.</span> </div>

<div class="card-body mt8"><strong>Qué habría pasado con los distractores:</strong> con los book value weights (0.4 y 0.6) el WACC daría 7.60%, y con el precio viejo de $20 (equity de $800,000) daría 8.00%. La suba del precio aumenta el peso del equity, que es la fuente <strong>más cara</strong>, y por eso el WACC sube.</div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-sliders" style="margin-right:6px;color:var(--accent)"></i>LOS 25.b — Factores que afectan la estructura de capital y el WACC</div>

<div class="card" id="c7-b1"> <div class="card-title"><i class="fa-solid fa-bullseye c-accent"></i> Objetivo de la firma y tipos de factores</div> <div class="card-body">Una firma típicamente apunta a la estructura de capital que <strong>minimiza su WACC</strong>, y al mismo tiempo tiene en cuenta la <strong>naturaleza de sus activos</strong> (de larga vida o de corto plazo) para elegir la <strong>duración</strong> de sus fuentes de financiamiento (si es posible, que calcen con la <strong>liquidez</strong> o el <strong>horizonte de tiempo</strong> de la inversión de capital).</div>

<div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span><strong>Servir la deuda</strong> significa tener capacidad para <strong>pagar las obligaciones que genera la deuda en las fechas correspondientes</strong>: los <strong>intereses</strong> y la devolución del <strong>principal</strong>. Cuanto mayor esa capacidad, más deuda puede sostener la firma en su estructura de capital.</span> </div>

<div class="card-body mt10">Los factores que afectan la estructura de capital son, en el fondo, los que determinan esa <strong>capacidad para servir (pagar) la deuda</strong>, y pueden ser de dos tipos:</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-building"></i> Factores internos</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li>Características del negocio o de la industria</li> <li>Etapa del ciclo de vida de la firma</li> <li>Nivel de deuda existente</li> <li>Tasa impositiva corporativa</li> </ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-globe"></i> Factores externos</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li>Condiciones de mercado y del ciclo económico</li> <li>Regulación</li> <li>Normas de la industria</li> </ul> </div> </div> </div>

<div class="card" id="c7-b2"> <div class="card-title"><i class="fa-solid fa-list-check c-accent"></i> Características de la firma que influyen en su proporción de deuda</div> <div class="card-body">Cinco características de la firma determinan cuánta deuda puede sostener, es decir, qué tan bien puede <strong>servirla</strong> (pagar intereses y principal a tiempo):</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Crecimiento y estabilidad de los revenues</span><span class="ex-val">Revenues que <strong>crecen</strong> o son <strong>estables y significativos</strong> sugieren que la firma va a poder seguir <strong>pagando su deuda</strong>.</span></div> <div class="ex-row"><span class="ex-label">Crecimiento y predictibilidad del cash flow</span><span class="ex-val">Un cash flow <strong>creciente</strong> aumenta la capacidad de <strong>pagar la deuda</strong>; uno <strong>significativo y estable</strong> indica que esa capacidad va a continuar.</span></div> <div class="ex-row"><span class="ex-label">Cantidad de business risk</span><span class="ex-val">Más business risk (<strong>operational risk</strong> y <strong>demand risk</strong>) significa mayor variabilidad de earnings y cash flows, y por lo tanto <strong>menor</strong> capacidad de <strong>pagar la deuda</strong>.</span></div> <div class="ex-row"><span class="ex-label">Cantidad y liquidez de los activos</span><span class="ex-val">Los activos se pueden dar en <strong>collateral</strong>, lo que hace la deuda más atractiva. Cuanto más <strong>líquidos</strong> (más fáciles de convertir en cash, con valor más estable), más fácil es darlos en garantía.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Costo y disponibilidad del financiamiento con deuda</span><span class="ex-val fw400">La deuda resulta más atractiva cuando es <strong>más barata</strong> y los inversores están <strong>más dispuestos a prestarle</strong> a la firma. La lectura lo lista entre las características de la firma, pero lo fija en buena parte el mercado, por eso se solapa con los factores externos.</span></div> </div> </div>

<div class="card" id="c7-b3"> <div class="card-title"><i class="fa-solid fa-scale-balanced c-accent"></i> Quién soporta más deuda (other things equal)</div> <div class="card-body">En general, cuanto más <strong>estables, predecibles y recurrentes</strong> son los revenues y cash flows de una firma, <strong>mayor proporción de deuda</strong> puede tener en su estructura de capital. Con eso en mente, y manteniendo todo lo demás constante:</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Ciclicidad de la industria</span><span class="ex-val">Las firmas de industrias <strong>noncyclical</strong> soportan más deuda que las de industrias <strong>cyclical</strong>.</span></div> <div class="ex-row"><span class="ex-label">Costos fijos (operating leverage)</span><span class="ex-val">Las firmas con <strong>bajos costos fijos operativos</strong> como proporción del costo total (low operating leverage) soportan más deuda que las de <strong>altos costos fijos</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Modelo de ingresos</span><span class="ex-val fw400">Las firmas con modelo de <strong>suscripción</strong> soportan más deuda que las de modelo <strong>pay-per-use</strong>.</span></div> </div> </div>

<div class="card" id="c7-b4"> <div class="card-title"><i class="fa-solid fa-cubes c-accent"></i> Tipo de activos: collateral y acceso a deuda</div> <div class="card-body">Los activos con los que la firma genera ingresos también afectan su capacidad de <strong>emitir deuda y pagarla</strong>, sobre todo por su valor como <strong>collateral</strong>.</div>

<div id="c7-b4-tang" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Tangibles vs. intangibles</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-industry"></i> Activos tangibles</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Los creditors los ven como <strong>mejor collateral</strong>, sobre todo si además son líquidos o fungibles.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-lightbulb"></i> Activos intangibles</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Los creditors los ven como <strong>peor collateral</strong>.</div> </div> </div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Líquido</span><span class="ex-val">Se puede vender por cash, si hace falta, <strong>sin perder valor significativo</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Fungible</span><span class="ex-val fw400">Se puede <strong>sustituir fácilmente</strong> por activos similares.</span></div> </div>

<div id="c7-b4-own" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Dueño de los activos vs. usar activos de terceros</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-key"></i> Es dueña de sus activos</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Tiene <strong>más collateral</strong> para ofrecer: mejora su acceso a deuda y <strong>reduce su costo de endeudamiento</strong>.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-store"></i> Usa activos de terceros</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Ej.: un <strong>franchise model</strong>. Tiene menos collateral para ofrecer.</div> </div> </div> </div>

<div class="card" id="c7-b4b"> <div class="card-title"><i class="fa-solid fa-warehouse c-accent"></i> Necesidad de financiamiento: capital-intensive vs. capital-light</div> <div class="card-body">El tipo de negocio define cuánto financiamiento externo necesita la firma y, con eso, qué pasa con su WACC:</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-industry"></i> Capital-intensive</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;margin-bottom:6px;">Ej.: bancos, public utilities.</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li>Piden prestado para comprar activos, o los <strong>alquilan (lease)</strong>, para tratar de <strong>reducir el cost of capital</strong></li> <li>Usan el activo como <strong>collateral</strong> (si tiene valor para el lender) para <strong>bajar el costo de la deuda</strong></li> <li>El gobierno puede exigir un <strong>mínimo de equity</strong> en su capital structure, lo que <strong>sube el WACC</strong></li> </ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-feather"></i> Capital-light</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;margin-bottom:6px;">Ej.: tecnología, servicios.</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"> <li><strong>Pocas necesidades de capital</strong> y/o <strong>cash conversion cycle corto</strong> (Module 23.1): poco o nada de financiamiento externo, lo que <strong>baja el WACC</strong></li> <li>Puede cambiar con planes de <strong>expansión</strong> y <strong>subir el WACC</strong></li> </ul> </div> </div>

<div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span>El mínimo de equity es un ejemplo de <strong>regulación</strong> (factor externo): obliga a usar más equity, la fuente <strong>más cara</strong>, y por eso sube el WACC.</span> </div> </div>

<div class="card" id="c7-b5"> <div class="card-title"><i class="fa-solid fa-gauge-high c-accent"></i> Deuda existente y volatilidad: medir la capacidad de endeudamiento</div> <div class="card-body">Además del tipo de activos, cuentan dos condiciones propias del emisor: su <strong>nivel de deuda existente</strong> y la <strong>volatilidad</strong> de sus revenues y earnings. <strong>Mucha deuda</strong> o <strong>alta volatilidad</strong> de earnings indican una <strong>menor</strong> capacidad de emitir más deuda. Se analiza con dos familias de ratios:</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Leverage ratios</span><span class="ex-val">Cuánta deuda tiene la firma. Ej.: <strong>debt-to-equity</strong> o <strong>debt-to-operating profit</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Coverage ratios</span><span class="ex-val fw400">Cuántas veces la firma puede pagar sus intereses con sus profits. Ej.: <strong>interest coverage</strong>. Si es <strong>alto</strong>, hay mucho profit relativo al interés: <strong>bajo riesgo</strong>.</span></div> </div>

<div class="fbox">Interest coverage = EBIT (operating income) / Interest expense</div>

<div class="alert mt10"> <i class="fa-solid fa-link"></i> <span>Son los mismos ratios que los debtholders usan como <strong>covenants</strong> (leverage máximo, interest coverage mínimo — ver Module 21.1).</span> </div> </div>

<div class="card" id="c7-b5b"> <div class="card-title"><i class="fa-solid fa-magnifying-glass-chart c-accent"></i> Factores específicos del emisor y su efecto en el costo de capital</div> <div class="card-body">Los factores propios del emisor cambian el <strong>riesgo que perciben los inversores</strong>, y con él el costo de la <strong>deuda y del equity</strong>: a <strong>más riesgo, mayor costo de capital</strong>. Son cuatro:</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Sales risk</span><span class="ex-val">Ventas <strong>predecibles y con crecimiento</strong> atraen a los inversores: <strong>menor</strong> costo de capital.</span></div> <div class="ex-row"><span class="ex-label">Profitability risk (operating leverage)</span><span class="ex-val">Muchos <strong>costos fijos</strong> (ej. rent) significan <strong>más riesgo</strong>: mayor costo de capital.</span></div> <div class="ex-row"><span class="ex-label">Financial leverage e interest coverage</span><span class="ex-val">Más deuda significa más pagos fijos, y por lo tanto <strong>más riesgo</strong>. El interest coverage mide qué tan bien se cubren esos pagos.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Collateral / tipo de activos</span><span class="ex-val fw400">Buenos activos para dar en garantía: <strong>menor</strong> costo de la deuda.</span></div> </div>

<div id="c7-b5b-lev" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Operating leverage vs. financial leverage</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-gears"></i> Operating leverage</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Qué tan <strong>fijos</strong> son los costos de la firma (ej. rent). <strong>Alto</strong> = utilidades <strong>más volátiles</strong>: muy buenas en las buenas épocas y muy malas en las malas. Ej.: en el COVID, las firmas con más costos fijos fueron las más golpeadas.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-hand-holding-dollar"></i> Financial leverage</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Cuánta <strong>deuda</strong> usa la firma respecto de su capital. <strong>Alto</strong> = más pagos fijos de <strong>intereses y principal</strong>: más riesgo y más volatilidad en los retornos.</div> </div> </div>

<div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span>No se confunden: el operating leverage viene de los <strong>costos fijos operativos</strong> y el financial leverage viene de la <strong>deuda</strong>. El interest coverage mira cuánto endeudamiento hay y qué tan bien la firma cubre el costo de esa deuda.</span> </div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver pregunta, opciones y respuesta</span><span class="example-badge">Click para expandir</span></button>

<div class="example-body" id="c7-b5b-ex"> <div class="card-body mb6"><em>El costo de la deuda y del equity probablemente es <strong>mayor</strong> para una firma con:</em></div> <div class="ex-table"> <div class="ex-row"><span class="ex-label fw400">A</span><span class="ex-val fw400">Stable revenue growth</span></div> <div class="ex-row"><span class="ex-label fw400">B</span><span class="ex-val fw400">High operating leverage</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">C</span><span class="ex-val fw400">High interest coverage</span></div> </div> <div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span>Respuesta correcta: <strong>(B)</strong>.</span> </div> <div class="card-body mt8"><strong>B:</strong> un operating leverage alto significa muchos costos fijos y utilidades más volátiles, así que los inversores perciben <strong>más riesgo</strong> y exigen más retorno. <strong>A</strong> es lo contrario: ventas estables y con crecimiento bajan el riesgo, y con él el costo de capital. <strong>C</strong> también baja el riesgo: un interest coverage alto significa que los profits cubren los intereses con holgura.</div> </div> </div>

<div class="card" id="c7-b5c"> <div class="card-title"><i class="fa-solid fa-table c-accent"></i> Ejemplos numéricos: operating leverage y financial leverage</div> <div class="card-body">Cada ejemplo aísla un solo efecto. En el primero, las dos firmas son 100% equity y cambia solo la <strong>estructura de costos</strong>. En el segundo, las dos tienen el mismo operating income y cambia solo la <strong>estructura de financiamiento</strong>.</div>

<div style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Operating leverage: costos fijos altos vs. bajos</div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: dos firmas 100% equity con el mismo profit de 30</span><span class="example-badge">Click para expandir</span></button>

<div class="example-body" id="c7-b5c-op"> <div class="card-body mb6"><em>Dos firmas financiadas 100% con equity. Cada una tiene revenue de 100 y gastos de 70, o sea un profit de 30 y un ROE de 30% (equity de 100, sin impuestos). <strong>Firm FC+</strong> tiene costos fijos de 50 y costos variables del 20% de las ventas (20). <strong>Firm FC−</strong> tiene costos fijos de 20 y costos variables del 50% de las ventas (50). (1) Calculá el ROE de cada firma si las ventas suben o bajan 25%. (2) ¿A cuál firma le prestarían los inversores con un menor costo de deuda?</em></div>
<div style="overflow-x:auto;margin-top:10px;"> <table class="tbl-std"> <thead> <tr> <th class="th7" style="text-align:left;">Firm FC+ (costos fijos altos)</th> <th class="th7" style="text-align:right;">Base case</th> <th class="th7" style="text-align:right;">Ventas −25%</th> <th class="th7" style="text-align:right;">Ventas +25%</th> </tr> </thead> <tbody>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Revenue</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">75</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">125</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Variable costs (20% de las ventas)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(20)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(15)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(25)</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Contribution</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">80</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">60</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Fixed costs</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(50)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(50)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(50)</td></tr>
<tr><td class="td-strong">Profit</td><td class="td-strong" style="text-align:right;">30</td><td class="td-strong" style="text-align:right;">10</td><td class="td-strong" style="text-align:right;">50</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Total equity</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td></tr>
<tr><td class="td-strong">ROE</td><td class="td-strong" style="text-align:right;">30%</td><td class="td-strong c-red" style="text-align:right;">10%</td><td class="td-strong c-green" style="text-align:right;">50%</td></tr>
</tbody> </table> </div>
<div style="overflow-x:auto;margin-top:10px;"> <table class="tbl-std"> <thead> <tr> <th class="th7" style="text-align:left;">Firm FC− (costos fijos bajos)</th> <th class="th7" style="text-align:right;">Base case</th> <th class="th7" style="text-align:right;">Ventas −25%</th> <th class="th7" style="text-align:right;">Ventas +25%</th> </tr> </thead> <tbody>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Revenue</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">75</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">125</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Variable costs (50% de las ventas)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(50)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(37.5)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(62.5)</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Contribution</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">50</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">37.5</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">62.5</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Fixed costs</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(20)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(20)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(20)</td></tr>
<tr><td class="td-strong">Profit</td><td class="td-strong" style="text-align:right;">30</td><td class="td-strong" style="text-align:right;">17.5</td><td class="td-strong" style="text-align:right;">42.5</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Total equity</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">100</td></tr>
<tr><td class="td-strong">ROE</td><td class="td-strong" style="text-align:right;">30%</td><td class="td-strong c-red" style="text-align:right;">17.5%</td><td class="td-strong c-green" style="text-align:right;">42.5%</td></tr>
</tbody> </table> </div>
<div class="card-body mt10">Contribution = revenue − variable costs. Los variable costs son un % fijo de las ventas, pero los <strong>fixed costs se quedan iguales</strong> aunque las ventas suban o bajen.</div>
<div class="ex-table mt8"> <div class="ex-row"><span class="ex-label">Firm FC+ (costos fijos altos)</span><span class="ex-val">ROE: 10% · 30% · 50% (rango de <strong>40 puntos</strong>). Con ventas −25%, el profit cae de 30 a 10 (<strong>−67%</strong>).</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Firm FC− (costos fijos bajos)</span><span class="ex-val fw400">ROE: 17.5% · 30% · 42.5% (rango de <strong>25 puntos</strong>). Con ventas −25%, el profit cae de 30 a 17.5 (<strong>−42%</strong>).</span></div> </div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span><strong>Respuesta (2): Firm FC−.</strong> Tiene menos costos fijos y un ROE <strong>más estable</strong>, así que probablemente los inversores le presten con un <strong>menor costo de deuda</strong>.</span> </div> </div>

<div style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Financial leverage: poca deuda vs. mucha deuda</div>

<button class="example-toggle" onclick="toggleExample(this)"><i class="fa-solid fa-chevron-right example-chevron"></i><span>Ver ejemplo: Firm A (20 de deuda) vs. Firm B (60 de deuda)</span><span class="example-badge">Click para expandir</span></button>

<div class="example-body" id="c7-b5c-fin"> <div class="card-body mb6"><em>Dos firmas con assets de 100. <strong>Firm A</strong> se financia con 80 de equity y 20 de deuda; <strong>Firm B</strong>, con 40 de equity y 60 de deuda. Cada una tiene revenue de 100 y gastos no financieros de 70 (operating income de 30). El interest expense es 2 en A y 9 en B; ignorá los impuestos. (1) Calculá el interest coverage y el ROE de cada firma, y qué pasa si el operating income sube o baja 25%. (2) ¿Cuál probablemente tiene el menor cost of capital?</em></div>
<div style="overflow-x:auto;margin-top:10px;"> <table class="tbl-std"> <thead> <tr> <th class="th7" style="text-align:left;">Firm A (80 equity, 20 deuda)</th> <th class="th7" style="text-align:right;">Base case</th> <th class="th7" style="text-align:right;">Op. income −25%</th> <th class="th7" style="text-align:right;">Op. income +25%</th> </tr> </thead> <tbody>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Operating income</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">30</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">22.5</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">37.5</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Interest expense</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(2)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(2)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(2)</td></tr>
<tr><td class="td-strong">Profit</td><td class="td-strong" style="text-align:right;">28</td><td class="td-strong" style="text-align:right;">20.5</td><td class="td-strong" style="text-align:right;">35.5</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Interest coverage</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">15</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">11.25</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">18.75</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Total equity</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">80</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">80</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">80</td></tr>
<tr><td class="td-strong">ROE</td><td class="td-strong" style="text-align:right;">35%</td><td class="td-strong c-red" style="text-align:right;">26%</td><td class="td-strong c-green" style="text-align:right;">44%</td></tr>
</tbody> </table> </div>
<div style="overflow-x:auto;margin-top:10px;"> <table class="tbl-std"> <thead> <tr> <th class="th7" style="text-align:left;">Firm B (40 equity, 60 deuda)</th> <th class="th7" style="text-align:right;">Base case</th> <th class="th7" style="text-align:right;">Op. income −25%</th> <th class="th7" style="text-align:right;">Op. income +25%</th> </tr> </thead> <tbody>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Operating income</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">30</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">22.5</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">37.5</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Interest expense</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(9)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(9)</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">(9)</td></tr>
<tr><td class="td-strong">Profit</td><td class="td-strong" style="text-align:right;">21</td><td class="td-strong" style="text-align:right;">13.5</td><td class="td-strong" style="text-align:right;">28.5</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Interest coverage</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">3.3</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">2.5</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">4.2</td></tr>
<tr><td style="padding:7px 10px;border-bottom:1px solid var(--border-light);">Total equity</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">40</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">40</td><td style="padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-light);">40</td></tr>
<tr><td class="td-strong">ROE</td><td class="td-strong" style="text-align:right;">53%</td><td class="td-strong c-red" style="text-align:right;">34%</td><td class="td-strong c-green" style="text-align:right;">71%</td></tr>
</tbody> </table> </div>
<div class="fbox">Interest coverage = Operating income / Interest expense<br>ROE = Profit / Total equity</div>
<div class="ex-table mt10"> <div class="ex-row"><span class="ex-label">Firm A</span><span class="ex-val">Coverage 15 (11.25 a 18.75). ROE 35% (26% a 44%): rango de <strong>18 puntos</strong>. Costo implícito de la deuda: 2 / 20 = <strong>10%</strong>.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Firm B</span><span class="ex-val fw400">Coverage 3.3 (2.5 a 4.2). ROE 53% (34% a 71%): rango de <strong>37 puntos</strong>. Costo implícito de la deuda: 9 / 60 = <strong>15%</strong>.</span></div> </div>
<div class="alert alert-green mt8"> <i class="fa-solid fa-check"></i> <span><strong>Respuesta (2): Firm A.</strong> Tiene mayor interest coverage, lo que da más confianza a los debt providers, y un ROE más estable. Es la que probablemente tiene el <strong>menor cost of capital</strong>.</span> </div>
<div class="alert alert-amber mt8"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Un ROE más alto no es mejor:</strong> el de B es mayor porque usa <strong>menos equity</strong> (40% del financiamiento vs. 80%), y a cambio es <strong>mucho más variable</strong>: los shareholders asumen más riesgo. Sin deuda el ROE sería 30%; la deuda lo sube (35% en A, 53% en B), pero también <strong>amplía la volatilidad</strong>. En resumen: más deuda significa una firma <strong>más riesgosa y más volátil</strong>, con un ROE mayor (mismo mecanismo que en Module 21.1).</span> </div> </div> </div>

<div class="card" id="c7-b6"> <div class="card-title"><i class="fa-solid fa-seedling c-accent"></i> Ciclo de vida de la firma: start-up, growth y mature</div> <div class="card-body mb6">Los factores anteriores se ven en cómo cambia el <strong>debt-to-equity</strong> según la etapa de vida de la firma: a medida que baja el business risk y se estabilizan los cash flows, consigue más deuda y a menor costo.</div>

<div class="reason-box"> <span class="reason-num">1</span> <div class="reason-body"> <div class="reason-title">Start-up</div> Las ventas recién empiezan; el operating earnings y el cash flow son <strong>bajos o negativos</strong> y el <strong>business risk es alto</strong>. La deuda sería muy riesgosa y exigiría tasas altas. Además hay pocos activos (receivables y fixed assets), así que no sirven como collateral. Por eso se financian <strong>casi exclusivamente con equity</strong>. Excepciones:
<div class="ex-table mt8"> <div class="ex-row"><span class="ex-label">Convertible debt</span><span class="ex-val">Posible en firmas de <strong>alto crecimiento</strong> con stock price en fuerte alza: usa una fuente de capital <strong>más barata</strong> y <strong>evita la dilución inmediata</strong> de los shareholders existentes.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Leasing</span><span class="ex-val fw400">Otra fuente de financiamiento con deuda disponible en esta etapa.</span></div> </div> </div> </div>

<div class="reason-box"> <span class="reason-num">2</span> <div class="reason-body"> <div class="reason-title">Growth</div> Revenue y cash flow <strong>suben</strong> y el business risk baja algo. El costo de la deuda se reduce un poco y su uso es <strong>conservador</strong>. Los inversores pueden estar dispuestos a prestar, muchas veces con préstamos <strong>garantizados</strong> (secured) por fixed assets o receivables. </div> </div>

<div class="reason-box"> <span class="reason-num">3</span> <div class="reason-body"> <div class="reason-title">Mature</div> El crecimiento del revenue se desacelera y el business risk es <strong>mucho menor</strong>. El cash flow es <strong>significativo y relativamente estable</strong>. La deuda, <strong>incluso unsecured</strong>, está ampliamente disponible y a <strong>bajo costo</strong>. </div> </div> </div>

<div class="card" id="c7-b7"> <div class="card-title"><i class="fa-solid fa-earth-americas c-accent"></i> Factores top-down: mercado financiero e industria</div> <div class="card-body">El costo de capital también depende de <strong>factores top-down</strong>: variables macroeconómicas que afectan dos cosas.</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Qué afectan</span><span class="ex-val">El <strong>benchmark interest rate</strong> (ej. la tasa del US Treasury) y los <strong>credit spreads</strong> que pagan los emisores corporativos sobre esa tasa.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Qué los mueve</span><span class="ex-val fw400"><strong>Inflación</strong>, <strong>real GDP growth</strong>, <strong>política monetaria</strong> y <strong>tipos de cambio</strong>.</span></div> </div>

<div id="c7-b7-fin" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Condiciones del mercado financiero</div>

<div class="card-body mt10">El costo de la deuda es el benchmark rate (r<sub>f</sub>) más un <strong>spread</strong>:</div>

<div class="fbox">r<sub>d</sub> = r<sub>f</sub> + spread</div>

<div class="ex-table"> <div class="ex-row"><span class="ex-label">Spread</span><span class="ex-val">Cubre los <strong>riesgos específicos del emisor</strong> (ej. credit risk, liquidity risk) y <strong>aumenta cuanto más riesgoso</strong> es el emisor.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Qué sube el costo de la deuda</span><span class="ex-val fw400">Que <strong>suban las tasas de interés</strong> (sube r<sub>f</sub>), o que haya <strong>recesión</strong> o mayor <strong>default risk</strong> (sube el spread).</span></div> </div>

<div class="alert alert-amber mt10"> <i class="fa-solid fa-triangle-exclamation"></i> <span><strong>Downturns:</strong> en las caídas del ciclo económico los debt investors exigen <strong>mayores yield spreads</strong> sobre los bonos benchmark para compensar el mayor riesgo de default. Se nota sobre todo en firmas de industrias <strong>cyclical</strong>.</span> </div>

<div class="alert alert-green mt8"> <i class="fa-solid fa-thumbs-up"></i> <span><strong>Acciones en alza:</strong> con el mercado &quot;caliente&quot; y los precios subiendo, puede ser buen momento para <strong>emitir equity</strong>. Con un nivel de dividendos <strong>fijo</strong>, un precio más alto significa que levantar ese equity <strong>cuesta menos</strong>: higher stock prices → lower cost of equity. (En el ejemplo de market value weights el r<sub>e</sub> se dejó fijo: ahí el precio solo movía el peso.)</span> </div>

<div id="c7-b7-ind" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Condiciones de la industria</div>

<div class="card-body mt10">Influye la <strong>naturaleza de los productos o servicios</strong> que vende la firma: un mismo factor puede ser malo para una industria y bueno para otra. Ejemplo con un <strong>precio bajo del petróleo</strong>:</div>

<div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-oil-well"></i> Productores de petróleo</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Les hace <strong>mal</strong>: <strong>sube</strong> su costo de capital. Cuando el precio del petróleo sube, en cambio, los spreads de sus emisores tienden a <strong>estrecharse</strong>.</div> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-plane"></i> Aerolíneas</div> <div style="font-size:12.5px;color:var(--text-sec);line-height:1.6;">Les hace <strong>bien</strong>: <strong>baja</strong> su costo de capital.</div> </div> </div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-square-root-variable" style="margin-right:6px;color:var(--accent)"></i>Resumen — Module 25.1</div> <div class="card bt-accent" id="c7-glossary"> <div class="card-title"><i class="fa-solid fa-list-ol c-accent"></i> Glosario</div> <div class="ex-table"> <div class="ex-row"><span class="ex-label">WACC</span><span class="ex-val">Tasa blended: costo de <strong>todas</strong> las fuentes de financiamiento (r × w de cada una); la deuda va after-tax</span></div> <div class="ex-row"><span class="ex-label">Fórmula</span><span class="ex-val">Σ (r<sub>i</sub> × w<sub>i</sub>) = [weight of debt × pretax cost of debt × (1 − tax rate)] + (weight of equity × cost of equity). Otra fuente (ej. preferred shares) suma un término más</span></div> <div class="ex-row"><span class="ex-label">Deuda vs. equity</span><span class="ex-val">Cost of debt &lt; cost of equity: deuda = claim fijo y prioritario (a veces con collateral); equity = claim residual y permanente. r<sub>d</sub> se estima desde tasas de peer companies. El ajuste (1 − t) es porque el interés es deducible (solo aplica a la deuda)</span></div> <div class="ex-row"><span class="ex-label">Pesos</span><span class="ex-val">En los cálculos se usan <strong>market value weights</strong>: equity = precio × shares, deuda = market value de los bonds. Los book values del balance suelen ser distractor. Target weights: estructura objetivo, estimada con book values</span></div> <div class="ex-row"><span class="ex-label">Ejemplo ABC</span><span class="ex-val">[0.50 × 0.08 × 0.70] + (0.50 × 0.11) = 8.3% (sin el ajuste por impuestos daría 9.5%)</span></div> <div class="ex-row"><span class="ex-label">Sube el tax rate</span><span class="ex-val">Baja el costo after-tax de la deuda y baja el WACC (la firma igual paga más impuestos). Ej. XYZ: 9.84% → 9.75% (−0.09%)</span></div> <div class="ex-row"><span class="ex-label">Ejemplo market value</span><span class="ex-val">Precio sube a $25: equity $1,000,000 + deuda $400,000 = $1,400,000; pesos 0.29 y 0.71; WACC = 8.26%</span></div> <div class="ex-row"><span class="ex-label">Servir la deuda</span><span class="ex-val">Tener capacidad para pagar las obligaciones de la deuda (intereses y principal) en las fechas correspondientes. Los factores de esta LOS determinan esa capacidad</span></div> <div class="ex-row"><span class="ex-label">Factores internos y externos</span><span class="ex-val">Internos: negocio o industria, ciclo de vida, deuda existente, tasa impositiva. Externos: mercado y ciclo económico, regulación, normas de la industria</span></div> <div class="ex-row"><span class="ex-label">5 características de la firma</span><span class="ex-val">Revenues, cash flow, business risk, cantidad y liquidez de activos, costo y disponibilidad de deuda</span></div> <div class="ex-row"><span class="ex-label">Soportan más deuda</span><span class="ex-val">Noncyclical (vs. cyclical), low operating leverage (vs. high), suscripción (vs. pay-per-use), activos tangibles, líquidos y fungibles, dueñas de sus activos (vs. franchise)</span></div> <div class="ex-row"><span class="ex-label">Ratios de capacidad de deuda</span><span class="ex-val">Leverage (debt-to-equity, debt-to-operating profit) y coverage (interest coverage = EBIT / interest expense)</span></div> <div class="ex-row"><span class="ex-label">Factores del emisor (costo de capital)</span><span class="ex-val">Sales risk (ventas predecibles y crecientes: menor costo), operating leverage (costos fijos altos: utilidades volátiles, mayor costo), financial leverage e interest coverage (más deuda: más riesgo; coverage alto: bajo riesgo), collateral (menor costo de la deuda). Operating leverage viene de costos fijos; financial leverage, de la deuda</span></div> <div class="ex-row"><span class="ex-label">Ejemplos de leverage</span><span class="ex-val">Operating leverage: mismo profit (30), pero con costos fijos altos el ROE va de 10% a 50% (ventas ±25%) y con costos fijos bajos de 17.5% a 42.5%. Financial leverage: Firm B (60 de deuda) tiene ROE mayor (53% vs. 35%) pero más variable y coverage menor (3.3 vs. 15). La deuda sube el riesgo y el ROE</span></div> <div class="ex-row"><span class="ex-label">Ciclo de vida</span><span class="ex-val">Start-up: casi solo equity (excepciones: convertible debt, leasing). Growth: deuda conservadora, secured. Mature: deuda barata, incluso unsecured</span></div> <div class="ex-row"><span class="ex-label">Capital-intensive vs. capital-light</span><span class="ex-val">Intensive (bancos, utilities): lease o deuda con collateral para bajar el costo; un mínimo de equity regulado sube el WACC. Light (tecnología, servicios): poco financiamiento externo, baja el WACC; la expansión puede subirlo</span></div> <div class="ex-row"><span class="ex-label">Factores top-down</span><span class="ex-val">Inflación, real GDP growth, política monetaria y tipos de cambio afectan el benchmark rate y los credit spreads. r<sub>d</sub> = r<sub>f</sub> + spread (el spread cubre riesgos del emisor y sube con el riesgo); suba de tasas, recesión o default risk suben el costo de la deuda</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Mercado e industria</span><span class="ex-val fw400">Acciones en alza: baja el cost of equity y conviene emitir equity. Petróleo bajo: sube el costo de capital de los productores y baja el de las aerolíneas</span></div> </div> </div></div>`;}

function pageC8() { return `<div class="module-theme module-c8"><div class="los-badge"><i class="fa-solid fa-bookmark"></i> LOS 25.c, 25.d</div> <div class="page-title">Module 25.2: Capital Structure Theories</div> <div class="page-sub">Corporate Issuers · Schweser Notes Book 1 · Reading 25: Capital Structure</div>

<div class="card bt-accent" id="c8-overview"> <div class="card-title"><i class="fa-solid fa-map c-accent"></i> Mapa del módulo — qué necesitás retener</div> <div class="card-body">Por qué una firma elige su mezcla de deuda y equity. <strong>LOS 25.c (MM):</strong> sin impuestos la estructura de capital es <strong>irrelevante</strong>; con impuestos, el <strong>tax shield</strong> empuja a 100% deuda, pero los <strong>costos de financial distress</strong> lo frenan. <strong>LOS 25.d:</strong> la <strong>static tradeoff</strong> encuentra el punto <strong>óptimo</strong>; después vienen el <strong>target</strong> (y qué pesos usar en el WACC), <strong>asymmetric information</strong>, <strong>agency costs</strong> y la <strong>pecking order theory</strong>.</div> </div>

<hr class="div"> <div class="section-label"><i class="fa-solid fa-scale-balanced" style="margin-right:6px;color:var(--accent)"></i>LOS 25.c — Proposiciones de Modigliani–Miller</div>

<div class="card" id="c8-a-mapa"> <div class="card-title"><i class="fa-solid fa-table-cells-large c-accent"></i> MM de un vistazo: 2 proposiciones × 2 versiones</div> <div class="card-body mb6"><strong>MM I</strong> habla del <strong>valor</strong> de la firma y <strong>MM II</strong> del <strong>costo de capital</strong>. Cada una tiene una versión sin impuestos y otra con impuestos:</div><div class="contrast-row"> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-equals"></i> Sin impuestos</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li><strong>MM I (valor):</strong> irrelevante, V<sub>L</sub> = V<sub>U</sub></li><li><strong>MM II (costo):</strong> r<sub>e</sub> sube con el D/E y el <strong>WACC no cambia</strong></li></ul> </div> <div class="contrast-box"> <div class="contrast-label"><i class="fa-solid fa-landmark"></i> Con impuestos</div> <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--text-sec);line-height:1.7;"><li><strong>MM I (valor):</strong> sube con la deuda, V<sub>L</sub> = V<sub>U</sub> + t × debt; máximo con 100% deuda</li><li><strong>MM II (costo):</strong> r<sub>e</sub> sube más lento y el <strong>WACC baja</strong></li></ul> </div> </div><div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span>La Masterclass junta los dos resultados con impuestos en una sola lámina (&quot;MM Proposition II with taxes&quot;).</span> </div> </div>

<div class="subsection-label" id="c8-a-sub1"><i class="fa-solid fa-equals"></i> 1. MM I sin impuestos: el valor no depende de la estructura de capital</div>

<div class="card" id="c8-a1"> <div class="card-title"><i class="fa-solid fa-chart-pie c-accent"></i> MM I (sin impuestos): la estructura de capital es irrelevante</div> <div class="card-body mb6"><strong>Modigliani y Miller</strong> (MM, 1958): bajo ciertos supuestos, el <strong>valor de la firma no depende de su estructura de capital</strong> (<strong>MM Proposition I</strong>). Lo determinan solo sus <strong>expected future cash flows</strong>, que son los mismos con o sin deuda.</div><div class="fbox">V<sub>L</sub>&nbsp;=&nbsp;V<sub>D</sub>&nbsp;+&nbsp;V<sub>E</sub>&nbsp;=&nbsp;V<sub>U</sub></div><div class="var-table"> <div class="var-row"><span class="var-name" style="min-width:40px;">V<sub>L</sub></span><span class="var-desc"><strong>Value of levered firm</strong> (valor de la deuda + valor del equity)</span></div> <div class="var-row"><span class="var-name" style="min-width:40px;">V<sub>U</sub></span><span class="var-desc"><strong>Value of unlevered firm</strong> (100% equity)</span></div> </div><div id="c8-a1-sup" style="font-weight:700;font-size:13px;color:var(--text-sec);margin:22px 0 2px;text-transform:uppercase;letter-spacing:.03em;">Supuestos de MM</div><div class="ex-table"> <div class="ex-row"><span class="ex-label">Mercados perfectos</span><span class="ex-val">Sin <strong>costos de transacción, impuestos ni bankruptcy</strong>.</span></div> <div class="ex-row"><span class="ex-label">Expectativas homogéneas</span><span class="ex-val">Todos esperan los <strong>mismos cash flows</strong> de la firma.</span></div> <div class="ex-row"><span class="ex-label">Borrowing y lending sin riesgo</span><span class="ex-val">Los inversores piden prestado y prestan a la <strong>tasa libre de riesgo</strong>.</span></div> <div class="ex-row"><span class="ex-label">Sin agency costs</span><span class="ex-val">Sin conflictos de interés entre managers y shareholders.</span></div> <div class="ex-row bd-none"><span class="ex-label fw400">Inversión independiente del financiamiento</span><span class="ex-val fw400">El <strong>operating income</strong> no depende de cómo se financia la firma.</span></div> </div><div class="alert mt10"> <i class="fa-solid fa-circle-info"></i> <span>Estos supuestos se relajan después: <strong>impuestos</strong> y <strong>bankruptcy costs</strong> (LOS 25.c), <strong>asymmetric information</strong> y <strong>agency costs</strong> (LOS 25.d).</span> </div> </div>

<div class="card" id="c8-a1b"> <div class="card-title"><i class="fa-solid fa-chart-pie c-accent"></i> La analogía del pie</div> <div class="card-body mb6">El <strong>tamaño del pie</strong> (valor de la firma) no depende de cómo se lo reparte entre deuda y equity. Quien comprara <strong>toda la deuda y todo el equity</strong> tendría derecho a <strong>todo el EBIT</strong>, igual que el dueño de una firma sin deuda: los dos valen lo mismo.</div>
